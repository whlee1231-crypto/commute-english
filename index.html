on't check my work email on the trip.|여행 중에는 회사 이메일을 보지 않을 거예요."}, {"title": "미래 계획 섞어 말하기", "tip": "이번 주에 배운 고잉 투와 윌을 섞어 씁니다. 정해 둔 계획은 고잉 투, 방금 정한 일은 윌이에요.", "s": ["I'm going to be busy next week.|다음 주에 바쁠 거예요.", "I'll call you when I get there.|도착하면 전화할게요.", "We're going to see a show tonight.|오늘 밤 공연 볼 거예요.", "Maybe I'll stay home this weekend.|이번 주말엔 아마 집에 있을 거예요.", "I'm going to try the local food.|현지 음식을 먹어볼 거예요.", "I'll send the samples next week.|다음 주에 샘플을 보내드릴게요.", "See you next time.|다음에 봐요.", "I'm sure you'll love it.|분명히 마음에 드실 거예요."], "d": ["A:Any plans for the holidays?|연휴에 계획 있어요?", "B:Yes. We're going to visit Thailand.|네. 태국에 갈 거예요.", "A:Oh, I love Thailand. I'm sure you'll love it.|오, 저 태국 정말 좋아해요. 분명히 마음에 드실 거예요.", "B:Thanks. I'm going to try the local food.|고마워요. 현지 음식을 먹어볼 거예요."], "p": "I'll see you tomorrow.|씨와 투모로우처럼 뜻이 중요한 단어에만 힘을 주고 길게 말합니다. 아일과 유는 약하고 빠르게 지나가요.", "sub": ["I'm going to rest this weekend.|이번 주말 쉼", "I'll think about it.|생각해볼게요", "We're going to move next year.|내년 이사", "I'll be there at seven.|7시에 도착", "It's going to be cold tonight.|오늘 밤 추움", "I'll get back to you soon.|곧 답변"], "st": ["David is going to fly to Korea tomorrow.|데이비드는 내일 한국에 가요.", "He's going to meet a supplier on Monday.|그는 월요일에 공급업체를 만날 거예요.", "After the meeting, he'll visit a market.|회의 후에 그는 시장에 갈 거예요.", "He says, I'll bring some snacks home for my kids.|그는 아이들에게 간식을 사 가겠다고 해요."], "q": ["When is David going to fly to Korea?|Tomorrow.", "Who is he going to meet?|A supplier.", "What will he do after the meeting?|He'll visit a market."], "o": ["What are you going to do after work today?|I'm going to go home and play with my baby.", "Any plans for next year?|Yes. I'm going to travel abroad with my family."], "my": "I'm going to relax and enjoy time with my baby.|아기와 함께 쉬면서 시간을 즐길 거예요."}]}, "16": {"days": [{"title": "because ~ 이유 말하기", "tip": "할 말 뒤에 비코즈를 붙이고 이유를 말해보세요. 이유를 하나 붙이면 대답이 훨씬 자연스러워져요.", "s": ["I'm tired because I worked late.|늦게까지 일해서 피곤해요.", "I'm happy because it's Friday.|금요일이라서 기뻐요.", "I'm late because the traffic was bad.|차가 막혀서 늦었어요.", "I like it because it's simple.|단순해서 좋아요.", "I can't go because I'm busy.|바빠서 못 가요.", "We came here because we love the sea.|바다를 좋아해서 여기 왔어요.", "I called because I have a question.|질문이 있어서 전화했어요.", "I'm hungry because I skipped lunch.|점심을 걸러서 배고파요."], "d": ["A:You look tired today.|오늘 피곤해 보여요.", "B:Yeah. I'm tired because I worked late.|네. 늦게까지 일해서 피곤해요.", "A:Oh no. Are you okay?|저런. 괜찮아요?", "B:I'm okay. I'm happy because it's Friday.|괜찮아요. 금요일이라서 기뻐요."], "p": "I'm late 'cause I missed the bus.|비코즈는 대화에서 커즈나 코즈로 짧게 줄어듭니다. 앞의 비는 거의 들리지 않아요.", "sub": ["I'm sleepy because I got up early.|일찍 일어나서 졸림", "I stayed home because it rained.|비 와서 집에 있음", "I like this hotel because it's quiet.|조용해서 좋음", "I'm busy because we have a big order.|큰 주문 때문에 바쁨", "I took a taxi because I was late.|늦어서 택시", "I'm happy because my baby smiled.|아기가 웃어서 기쁨"], "st": ["Sam is very tired today.|샘은 오늘 아주 피곤해요.", "He's tired because his baby cried all night.|아기가 밤새 울어서 피곤해요.", "He drinks a lot of coffee because he has a meeting.|회의가 있어서 커피를 많이 마셔요.", "But he's happy because the meeting goes well.|하지만 회의가 잘 돼서 기뻐요."], "q": ["Why is Sam tired?|Because his baby cried all night.", "Why does he drink a lot of coffee?|Because he has a meeting.", "Why is he happy?|Because the meeting goes well."], "o": ["Why are you learning English?|Because I want to talk with people when I travel.", "Do you like your job?|Yes, I do, because I meet a lot of people."], "my": "I'm learning English because I want to travel more.|여행을 더 많이 하고 싶어서 영어를 배우고 있어요."}, {"title": "so ~ 그래서", "tip": "이유를 먼저 말하고 쏘 뒤에 결과를 붙입니다. 비코즈와 순서만 반대예요.", "s": ["It was raining, so I stayed home.|비가 와서 집에 있었어요.", "I was hungry, so I ate early.|배가 고파서 일찍 먹었어요.", "It's late, so I have to go.|늦어서 가봐야 해요.", "The hotel was full, so we moved.|호텔이 꽉 차서 옮겼어요.", "I missed the bus, so I took a taxi.|버스를 놓쳐서 택시를 탔어요.", "The price was good, so we ordered more.|가격이 좋아서 더 주문했어요.", "My baby was sick, so I left early.|아기가 아파서 일찍 퇴근했어요.", "So, what do you think?|그래서, 어떻게 생각해요?"], "d": ["A:How was your morning?|아침 어땠어요?", "B:Bad. I missed the bus, so I took a taxi.|별로였어요. 버스를 놓쳐서 택시를 탔어요.", "A:Oh no. Were you late?|저런. 늦었어요?", "B:No. The traffic was light, so I made it.|아뇨. 차가 안 막혀서 제시간에 왔어요."], "p": "I was hungry, so I ate.|쏘 앞에서 살짝 쉬고 결과를 이어 말합니다. 쉼표 앞은 끝을 살짝 올려서 말이 아직 끝나지 않았다는 느낌을 주세요.", "sub": ["It was cold, so I wore a jacket.|추워서 재킷", "I was tired, so I went to bed early.|피곤해서 일찍 잠", "It's my first time, so I'm nervous.|처음이라 긴장", "The shop was closed, so we went back.|가게 닫혀서 돌아감", "I don't drink, so I'll have juice.|술 안 마셔서 주스", "It was cheap, so I bought two.|싸서 두 개 삼"], "st": ["Kate wanted to go to the beach.|케이트는 바다에 가고 싶었어요.", "But it was raining, so she stayed at the hotel.|하지만 비가 와서 호텔에 있었어요.", "She was bored, so she went to the hotel cafe.|심심해서 호텔 카페에 갔어요.", "She met a nice couple there, so it was a good day.|거기서 좋은 부부를 만나서 좋은 하루였어요."], "q": ["Why did Kate stay at the hotel?|Because it was raining.", "Where did she go?|To the hotel cafe.", "Was it a bad day?|No, it was a good day."], "o": ["What did you do last weekend?|It was cold, so I stayed home with my family.", "You look busy today.|Yes, we have a big order, so I'm busy."], "my": "I drive a lot, so I study in the car.|운전을 많이 해서 차에서 공부해요."}, {"title": "Why? 이유 묻고 답하기", "tip": "와이로 이유를 묻고, 비코즈로 짧게 답합니다. 대답은 비코즈로 바로 시작해도 괜찮아요.", "s": ["Why did you choose this hotel?|왜 이 호텔을 골랐어요?", "Why do you like it?|왜 그게 좋아요?", "Why is it so expensive?|왜 이렇게 비싸요?", "Because it's close to the beach.|해변이 가까워서요.", "Because it's my first time here.|여기 처음이라서요.", "Because we use better steel.|더 좋은 강철을 써서요.", "How come you're so early?|어째서 이렇게 일찍 왔어요?", "Why not? Let's go.|좋죠. 가요."], "d": ["A:Why did you choose this hotel?|왜 이 호텔을 골랐어요?", "B:Because it's close to the beach.|해변이 가까워서요.", "A:Good choice. My kids love the beach, too.|잘 고르셨네요. 우리 아이들도 해변을 좋아해요.", "B:Really? Then why not go together later?|정말요? 그럼 이따 같이 가는 거 어때요?"], "p": "Why did you choose it?|와이, 왓, 웨어로 시작하는 질문은 끝을 내려서 말합니다. 끝을 올리면 다시 되묻는 느낌이 돼요.", "sub": ["Why are you so happy?|왜 그렇게 기뻐요", "Why did you come to Korea?|한국에 온 이유", "Why is the store closed?|가게 닫은 이유", "Because it's a holiday.|휴일이라서", "Because I love the food.|음식이 좋아서", "How come you're not tired?|어째서 안 피곤해요"], "st": ["A customer calls Jin.|한 고객이 진에게 전화해요.", "He asks, Why is the price higher this month?|왜 이번 달 가격이 더 높냐고 물어요.", "Jin says, Because steel prices went up.|진은 철 가격이 올라서라고 말해요.", "The customer understands, so he places the order.|고객은 이해하고 주문을 해요."], "q": ["Who calls Jin?|A customer.", "Why is the price higher?|Because steel prices went up.", "Does the customer place the order?|Yes, he does."], "o": ["Why do you want to visit Europe?|Because I want to see old cities with my family.", "Why do you drink coffee every morning?|Because I get up early and drive to work."], "my": "Why the car? Because my baby keeps me busy at home.|왜 차냐고요? 집에서는 아기 때문에 바쁘거든요."}, {"title": "because of ~, That's why ~", "tip": "비코즈 오브 뒤에는 짧은 명사만 붙입니다. 댓츠 와이는 그래서 그런 거예요 라는 뜻이에요.", "s": ["I'm late because of the traffic.|차가 막혀서 늦었어요.", "The flight was canceled because of the snow.|눈 때문에 비행기가 취소됐어요.", "I couldn't sleep because of the noise.|소음 때문에 못 잤어요.", "That's why I'm here.|그래서 제가 여기 온 거예요.", "That's why I like it.|그래서 그게 좋아요.", "Oh, I see. That's why.|아, 그래서 그렇군요.", "We're busy because of a big order.|큰 주문 때문에 바빠요.", "Thanks to you, we made it.|덕분에 해냈어요."], "d": ["A:You look sleepy.|졸려 보여요.", "B:I couldn't sleep because of the noise.|소음 때문에 잠을 못 잤어요.", "A:Oh, I see. That's why.|아, 그래서 그렇군요.", "B:Yeah. That's why I need coffee.|네. 그래서 커피가 필요해요."], "p": "because of the traffic|비코즈 오브 더는 끊지 말고 커저브더처럼 약하게 이어 말합니다. 힘은 뒤의 트래픽에만 주세요.", "sub": ["I'm late because of the rain.|비 때문에 늦음", "We stayed in because of the heat.|더위 때문에 실내", "The store is closed because of the holiday.|휴일 때문에 닫음", "That's why I called you.|그래서 전화함", "That's why it's so popular.|그래서 인기 많음", "Thanks to you, I found it.|덕분에 찾음"], "st": ["Tim's flight was canceled because of the snow.|팀의 비행기가 눈 때문에 취소됐어요.", "So he stayed one more night at the hotel.|그래서 호텔에서 하룻밤 더 묵었어요.", "He met a Korean businessman at the bar.|그는 바에서 한국인 사업가를 만났어요.", "They became friends. That's why Tim calls the snow lucky.|둘은 친구가 됐어요. 그래서 팀은 그 눈이 행운이었다고 해요."], "q": ["Why was Tim's flight canceled?|Because of the snow.", "Where did he stay?|At the hotel.", "Who did he meet?|A Korean businessman."], "o": ["Why were you late today?|Because of the traffic. It was really bad.", "Why is your company busy these days?|Because of a big order from a new customer."], "my": "That's why my car is my classroom.|그래서 제 차가 제 교실이에요."}, {"title": "이유 섞어 말하기", "tip": "비코즈, 쏘, 댓츠 와이를 섞어서 이유를 말해봅니다. 이유를 하나 붙이면 대답이 두 배 길어져요.", "s": ["I chose this one because it's strong.|튼튼해서 이걸 골랐어요.", "It's a long trip, so we'll rest first.|긴 여행이라 먼저 쉴 거예요.", "I love this city because people are kind.|사람들이 친절해서 이 도시가 좋아요.", "The baby is sleeping, so let's talk quietly.|아기가 자니까 조용히 얘기해요.", "I come here every day because the coffee's great.|커피가 맛있어서 매일 여기 와요.", "It's raining, so let's take a taxi.|비가 오니까 택시 타요.", "Why? No reason. Just because.|왜요? 별 이유 없어요. 그냥요.", "That's why I'm learning English.|그래서 영어를 배우고 있어요."], "d": ["A:Why did you come to this city?|왜 이 도시에 왔어요?", "B:Because people are kind and the food is good.|사람들이 친절하고 음식이 맛있어서요.", "A:It's raining now. Do you have an umbrella?|지금 비가 와요. 우산 있어요?", "B:No, I don't. It's raining, so let's take a taxi.|아뇨, 없어요. 비가 오니까 택시 타요."], "p": "It's strong, so I chose it.|스트롱 끝에 그 소리를 붙여 스트롱그라고 하지 마세요. 영어의 끝소리는 짧게 닫고 바로 끝냅니다.", "sub": ["I'm tired, so I'll go to bed.|피곤해서 잘게요", "I'm here because of work.|일 때문에 옴", "It's my baby's nap time, so we'll go back.|아기 낮잠 시간이라 돌아감", "I like it here because it's quiet.|조용해서 좋음", "That's why I'm so busy.|그래서 바쁨", "The food is spicy, so drink some water.|매우니까 물 드세요"], "st": ["Olivia is visiting Korea with her husband.|올리비아는 남편과 한국을 방문 중이에요.", "They love Korean food, so they eat out every night.|한국 음식을 좋아해서 매일 밤 외식해요.", "Tonight they're eating at the hotel because Olivia has a cold.|오늘 밤은 올리비아가 감기에 걸려서 호텔에서 먹어요.", "Her husband orders fried chicken, so they're both happy.|남편이 치킨을 시켜서 둘 다 행복해요."], "q": ["Who is Olivia visiting Korea with?|With her husband.", "Why do they eat out every night?|Because they love Korean food.", "Why are they eating at the hotel tonight?|Because Olivia has a cold."], "o": ["Why do you want to speak English?|Because I want to talk with people on my trips.", "Is your job hard?|Sometimes, because I have a lot of customers. But I like it."], "my": "It's not easy, but I'm getting better because I practice every day.|쉽지 않지만 매일 연습해서 점점 나아지고 있어요."}]}, "17": {"days": [{"title": "~er than ~보다 더", "tip": "짧은 형용사 끝에 어를 붙이고 댄을 쓰면 비교가 됩니다. 빅은 비거, 칩은 치퍼가 돼요.", "s": ["This one is cheaper.|이게 더 싸요.", "It's bigger than my car.|제 차보다 더 커요.", "Today is colder than yesterday.|오늘이 어제보다 더 추워요.", "This bolt is longer than that one.|이 볼트가 저것보다 더 길어요.", "The bus is slower than the train.|버스가 기차보다 느려요.", "My baby is much bigger now.|우리 아기가 이제 훨씬 컸어요.", "Is it far? No, it's closer.|멀어요? 아니요, 더 가까워요.", "Can you make it cheaper?|더 싸게 해 주실 수 있어요?"], "d": ["A:This bag is nice, and it's on sale.|이 가방 좋아요, 세일 중이에요.", "B:This one is cheaper. Is it bigger?|이게 더 싸네요. 더 커요?", "A:Yes. It's bigger than that one.|네. 저것보다 더 커요.", "B:Great. I'll take it.|좋아요. 이걸로 할게요."], "p": "It's bigger than mine.|비거의 어는 혀를 살짝 뒤로 당겨 짧고 약하게 냅니다. 비걸처럼 끝을 세게 굴리지 마세요.", "sub": ["It's hotter today.|오늘 더 더움", "This road is faster.|이 길이 더 빠름", "My phone is older than yours.|내 폰이 더 오래됨", "The new model is lighter.|새 모델이 더 가벼움", "This screw is shorter.|이 나사가 더 짧음", "Can you speak slower?|더 천천히"], "st": ["Jack and Ryan are brothers.|잭과 라이언은 형제예요.", "Jack is older, but Ryan is taller.|잭이 나이가 더 많지만 라이언이 키가 더 커요.", "Jack's car is bigger than Ryan's car.|잭의 차가 라이언의 차보다 커요.", "But Ryan's car is faster.|하지만 라이언의 차가 더 빨라요."], "q": ["Who is older?|Jack is.", "Who is taller?|Ryan is.", "Whose car is faster?|Ryan's car."], "o": ["Is Korea colder than here?|Yes, it's much colder in winter.", "Is your baby bigger now?|Yes, much bigger. Time goes so fast."], "my": "Our screws are stronger than cheap ones.|저희 나사는 값싼 나사보다 더 튼튼해요."}, {"title": "more ~ 긴 단어 비교", "tip": "긴 형용사는 끝에 어를 붙이지 않고 앞에 모어를 씁니다. 모어 익스펜시브, 모어 컴퍼터블처럼요.", "s": ["It's more expensive than I thought.|생각보다 더 비싸요.", "This hotel is more comfortable.|이 호텔이 더 편해요.", "Korean is more difficult than English.|한국어가 영어보다 더 어려워요.", "This model is more popular.|이 모델이 더 인기 있어요.", "I need more time.|시간이 더 필요해요.", "Can I have more water?|물 좀 더 주시겠어요?", "It's less expensive online.|온라인이 덜 비싸요.", "We need more samples.|샘플이 더 필요해요."], "d": ["A:How much is this room?|이 방은 얼마예요?", "B:Hmm. It's more expensive than I thought.|음. 생각보다 더 비싸네요.", "A:But it's bigger and more comfortable.|하지만 더 크고 더 편해요.", "B:Okay. I need more time to think.|알겠어요. 생각할 시간이 좀 더 필요해요."], "p": "more expensive|모어 뒤에 모음이 오면 알 소리가 다음 단어로 넘어가 모릭스펜시브처럼 이어집니다. 모어와 익스펜시브를 끊지 마세요.", "sub": ["It's more interesting.|더 흥미로움", "This chair is more comfortable.|이 의자가 더 편함", "I want to travel more.|여행 더 하고 싶음", "It's more convenient by train.|기차가 더 편리", "Can you give me more details?|자세한 내용 더", "Is there a less expensive one?|덜 비싼 것"], "st": ["Mark is looking for a hotel in Bangkok.|마크는 방콕에서 호텔을 찾고 있어요.", "The first hotel is cheap, but it's far.|첫 번째 호텔은 싸지만 멀어요.", "The second hotel is more expensive.|두 번째 호텔은 더 비싸요.", "But it's more comfortable, so he chooses it.|하지만 더 편해서 그는 그곳을 골라요."], "q": ["Where is Mark looking for a hotel?|In Bangkok.", "Which hotel is more expensive?|The second hotel.", "Why does he choose it?|Because it's more comfortable."], "o": ["Is traveling with a baby more difficult?|Yes, it's more difficult, but it's more fun, too.", "Do you need more time?|Yes, please. Can I think about it?"], "my": "They're a little more expensive, too.|조금 더 비싸기도 해요."}, {"title": "better, worse 더 좋아요, 더 나빠요", "tip": "굿을 비교하면 베터, 배드를 비교하면 워스입니다. 훨씬은 머치를 앞에 붙여요.", "s": ["This one is better.|이게 더 좋아요.", "It's much better now.|이제 훨씬 나아요.", "I feel better today.|오늘은 몸이 좀 나아요.", "The weather is getting worse.|날씨가 점점 나빠지고 있어요.", "Our quality is better.|저희 품질이 더 좋아요.", "It's better than last year.|작년보다 나아요.", "Which is better, tea or coffee?|차랑 커피 중 뭐가 더 좋아요?", "It's worse than I thought.|생각보다 더 나빠요."], "d": ["A:How's your baby? Still sick?|아기는 어때요? 아직 아파요?", "B:Much better now, thanks.|이제 훨씬 나아요, 고마워요.", "A:Good. Which is better here, tea or coffee?|다행이네요. 여기는 차랑 커피 중 뭐가 더 좋아요?", "B:The coffee is better. Try it.|커피가 더 맛있어요. 마셔 보세요."], "p": "It's better.|베터의 티는 모음 사이에서 부드러운 르 소리로 바뀌어 베러처럼 들립니다. 워터, 레터도 같은 원리예요.", "sub": ["This road is better.|이 길이 더 나음", "Your plan is better.|당신 계획이 더 좋음", "The traffic is worse today.|오늘 교통 더 나쁨", "It's much better than before.|전보다 훨씬 좋음", "I feel much better.|몸이 훨씬 나음", "Which hotel is better?|어느 호텔이 더 나음"], "st": ["Amy compares two suppliers.|에이미는 두 공급업체를 비교해요.", "Supplier A is cheaper, but its quality is worse.|에이 업체는 더 싸지만 품질이 더 나빠요.", "Supplier B is a little more expensive.|비 업체는 조금 더 비싸요.", "But its quality is much better, so she picks B.|하지만 품질이 훨씬 좋아서 그녀는 비 업체를 골라요."], "q": ["What does Amy compare?|Two suppliers.", "Which supplier is cheaper?|Supplier A.", "Why does she pick B?|Because its quality is much better."], "o": ["Which do you like better, the sea or the mountains?|I like the sea better. My baby loves the sand.", "How's your English these days?|It's getting better, little by little."], "my": "But the quality is much better.|하지만 품질이 훨씬 좋아요."}, {"title": "the best ~ 제일, 최고", "tip": "셋 이상 중에 제일은 단어 끝에 이스트를 붙이고 앞에 더를 씁니다. 긴 단어는 앞에 더 모스트를 붙여요.", "s": ["This is the best coffee here.|이게 여기서 제일 맛있는 커피예요.", "What's the best way to get there?|거기 가는 가장 좋은 방법이 뭐예요?", "It's the biggest city in Korea.|한국에서 제일 큰 도시예요.", "This is our most popular item.|이게 저희 제일 인기 상품이에요.", "It was the best trip ever.|최고의 여행이었어요.", "Summer is our busiest season.|여름이 저희 제일 바쁜 시즌이에요.", "Which one is the cheapest?|어떤 게 제일 싸요?", "What's the most famous food here?|여기서 제일 유명한 음식이 뭐예요?"], "d": ["A:Welcome! Is this your first time here?|어서 오세요! 여기 처음이세요?", "B:Yes. What's the most famous food here?|네. 여기서 제일 유명한 음식이 뭐예요?", "A:Fish tacos. We have the best ones in town.|피시 타코요. 저희 집이 동네에서 제일 맛있어요.", "B:Great. Which one is the most popular?|좋네요. 어떤 게 제일 인기 있어요?"], "p": "the best price|베스트 뒤에 자음이 오면 끝의 티가 거의 사라져 베스 프라이스처럼 들립니다. 티를 세게 터뜨리지 마세요.", "sub": ["It's the oldest building here.|가장 오래된 건물", "You're the best!|당신 최고예요", "That was the best meal.|최고의 식사", "What's the fastest way?|가장 빠른 길", "This is our strongest screw.|가장 튼튼한 나사", "It's the most beautiful beach.|가장 아름다운 해변"], "st": ["Paul is in Vietnam with his family.|폴은 가족과 베트남에 있어요.", "He asks the hotel staff, What's the best restaurant here?|호텔 직원에게 여기서 제일 좋은 식당이 어디냐고 물어요.", "The staff says the most popular one is by the river.|직원은 제일 인기 있는 곳이 강가에 있다고 해요.", "Paul says it was the best dinner of the trip.|폴은 그게 여행 중 최고의 저녁이었다고 해요."], "q": ["Where is Paul?|In Vietnam.", "Who does he ask?|The hotel staff.", "Where is the most popular restaurant?|By the river."], "o": ["What's the best food in Korea?|I think it's Korean barbecue. You should try it.", "What's your best-selling product?|Our self-drilling screws are the most popular."], "my": "That's why our customers say they're the best.|그래서 고객들이 저희 나사가 최고라고 해요."}, {"title": "비교 섞어 말하기", "tip": "애즈 무엇 애즈는 똑같이 무엇하다는 뜻입니다. 이번 주에 배운 비교 표현과 섞어서 말해보세요.", "s": ["It's as good as the old one.|예전 것만큼 좋아요.", "It's not as cheap as before.|예전만큼 싸지 않아요.", "Our price is lower than theirs.|저희 가격이 그쪽보다 낮아요.", "This one is a little heavier.|이게 조금 더 무거워요.", "It's twice as big.|두 배나 커요.", "The sooner, the better.|빠를수록 좋아요.", "Which do you like better?|어느 게 더 좋아요?", "It's the same price.|가격이 같아요."], "d": ["A:Is this new model better?|이 새 모델이 더 좋아요?", "B:It's as strong as the old one, but lighter.|예전 것만큼 튼튼한데 더 가벼워요.", "A:Is it more expensive?|더 e you ever ridden a camel?|낙타 타기", "Have you ever lost your passport?|여권 분실", "Have you ever worked abroad?|해외 근무", "Have you ever seen the northern lights?|오로라"], "st": ["Noah is from Brazil.|노아는 브라질 사람이에요.", "He has never been to Asia.|그는 아시아에 가 본 적이 없어요.", "His friend asks, Have you ever tried Korean food?|친구가 한국 음식 먹어 봤냐고 물어요.", "Noah says, Yes, I have. I love bibimbap.|노아는 네, 비빔밥을 정말 좋아한다고 해요."], "q": ["Where is Noah from?|He's from Brazil.", "Has he been to Asia?|No, he hasn't.", "What Korean food does he love?|Bibimbap."], "o": ["Have you ever been to America?|No, I haven't. But I really want to go.", "Have you ever tried Mexican food?|Yes, I have. I love tacos."], "my": "I've traveled abroad a few times.|해외여행을 몇 번 해 봤어요."}, {"title": "I've ~, I've never ~ 해 봤어요, 안 해 봤어요", "tip": "아이브는 해 봤어요, 아이브 네버는 한 번도 안 해 봤어요 라는 뜻입니다. 네버에 힘을 주세요.", "s": ["I've been there once.|거기 한 번 가 봤어요.", "I've never been to Europe.|유럽에 가 본 적이 없어요.", "I've seen that movie.|그 영화 봤어요.", "I've never tried it.|그거 먹어 본 적 없어요.", "I've heard a lot about you.|말씀 많이 들었어요.", "I've never seen anything like it.|이런 건 처음 봐요.", "We've worked with them before.|전에 그 회사랑 일해 봤어요.", "I've never done this before.|이거 처음 해 봐요."], "d": ["A:Nice to meet you. I've heard a lot about you.|만나서 반가워요. 말씀 많이 들었어요.", "B:Thank you. Nice to meet you, too.|감사합니다. 저도 반가워요.", "A:Have you been to our office before?|저희 사무실에 와 보신 적 있어요?", "B:No. I've never been to this city.|아뇨. 이 도시는 처음이에요."], "p": "I've been there.|아이브의 브는 윗니를 아랫입술에 살짝 대기만 하고 짧게 넘어갑니다. 브를 빼먹고 아이 빈이라고 하면 경험의 뜻이 약해져요.", "sub": ["I've been to Thailand.|태국 가 봄", "I've never been skiing.|스키 안 타 봄", "I've met him before.|전에 만남", "I've tried sushi in Japan.|일본에서 초밥", "We've never had a problem.|문제 없었음", "I've never driven abroad.|해외 운전 안 해 봄"], "st": ["Grace has been to many countries.|그레이스는 많은 나라에 가 봤어요.", "She's been to Japan, China and Korea.|일본, 중국, 한국에 가 봤어요.", "But she's never been to Africa.|하지만 아프리카에는 가 본 적이 없어요.", "She says, I've always wanted to see Kenya.|그녀는 케냐에 늘 가 보고 싶었다고 해요."], "q": ["Has Grace been to Korea?|Yes, she has.", "Has she been to Africa?|No, she hasn't.", "Where does she want to go?|Kenya."], "o": ["Have you been to Europe?|No, I've never been there. I want to go someday.", "Have you tried this before?|No, I've never tried it. What is it?"], "my": "But I've never been to Europe.|하지만 유럽에는 가 본 적이 없어요."}, {"title": "Have you been to ~? 가 봤어요?", "tip": "가 봤는지 물을 때는 해브 유 빈 투를 씁니다. 고운이 아니라 빈을 쓰는 게 포인트예요.", "s": ["Have you been to Seoul?|서울에 가 봤어요?", "Have you been here before?|여기 와 본 적 있어요?", "I've been to Bali with my family.|가족과 발리에 가 봤어요.", "Have you been to the night market?|야시장 가 봤어요?", "Where have you traveled?|어디 여행해 봤어요?", "It's my first time here.|여기 처음이에요.", "Have you been to a Korean restaurant?|한국 식당에 가 봤어요?", "You should go there sometime.|언젠가 거기 가 보세요."], "d": ["A:Have you been here before?|여기 와 본 적 있어요?", "B:No, it's my first time here.|아뇨, 여기 처음이에요.", "A:Have you been to the night market?|야시장 가 봤어요?", "B:Not yet. I'm going to go tonight.|아직이요. 오늘 밤에 가 볼 거예요."], "p": "Have you been here?|예스나 노로 답하는 질문은 끝을 올려 말합니다. 끝을 내리면 따지는 느낌이 날 수 있어요.", "sub": ["Have you been to Paris?|파리", "Have you been to this cafe?|이 카페", "Have you been to a baseball game?|야구 경기", "I've been to Jeju Island.|제주도 가 봄", "It's my first time in Spain.|스페인 처음", "You should go to the beach.|해변 가 보세요"], "st": ["Rachel is staying at a hotel in Hawaii.|레이첼은 하와이의 한 호텔에 묵고 있어요.", "She meets a Korean family at the pool.|수영장에서 한국 가족을 만나요.", "She asks, Have you been to the North Shore?|노스 쇼어에 가 봤냐고 물어요.", "The father says, Not yet. We're going tomorrow.|아빠가 아직이요, 내일 가요 라고 해요."], "q": ["Where is Rachel?|In Hawaii.", "Who does she meet?|A Korean family.", "When are they going to the North Shore?|Tomorrow."], "o": ["Have you been to the US?|No, not yet. I want to go with my family.", "Have you been to this restaurant before?|No, it's my first time. What's good here?"], "my": "I've been to Thailand and Vietnam with my family.|가족과 태국, 베트남에 가 봤어요."}, {"title": "몇 번, 얼마나 해 봤어요", "tip": "몇 번 해 봤는지는 하우 매니 타임즈로 묻습니다. 대답은 원스, 트와이스, 쓰리 타임즈예요.", "s": ["How many times have you been there?|거기 몇 번 가 봤어요?", "I've been there twice.|거기 두 번 가 봤어요.", "Only once, for work.|일 때문에 딱 한 번이요.", "I've been to China three times.|중국에 세 번 가 봤어요.", "How long have you been here?|여기 온 지 얼마나 됐어요?", "I've been here for three days.|여기 온 지 3일 됐어요.", "I've worked here for ten years.|여기서 10년 일했어요.", "Many times. I love it there.|여러 번이요. 거기 정말 좋아요."], "d": ["A:How long have you been here?|여기 온 지 얼마나 됐어요?", "B:I've been here for three days.|3일 됐어요.", "A:Have you been to Singapore before?|전에 싱가포르에 와 본 적 있어요?", "B:Yes, only once, for work.|네, 일 때문에 딱 한 번이요."], "p": "three times|쓰리의 첫소리는 혀끝을 윗니와 아랫니 사이에 살짝 물고 바람을 내보냅니다. 혀를 물지 않으면 나무를 뜻하는 트리처럼 들릴 수 있어요.", "sub": ["I've been to Tokyo once.|도쿄 한 번", "We've met twice before.|전에 두 번 만남", "I've visited that factory many times.|그 공장 여러 번 방문", "How long have you lived here?|여기 산 지 얼마", "I've had this car for five years.|이 차 5년 탐", "How many times have you tried?|몇 번 시도"], "st": ["Mr. Lee is a sales manager.|이 씨는 영업 매니저예요.", "He has been to China ten times for work.|그는 일 때문에 중국에 열 번 가 봤어요.", "He has worked at his company for twelve years.|그는 회사에서 12년 일했어요.", "But he has never been to China on vacation.|하지만 휴가로 중국에 간 적은 없어요."], "q": ["What does Mr. Lee do?|He's a sales manager.", "How many times has he been to China?|Ten times.", "Has he been to China on vacation?|No, he hasn't."], "o": ["How many times have you been to Japan?|Three times. Mostly for work.", "How long have you worked at your company?|For many years. I really like it."], "my": "And I've been to Japan three times for work.|그리고 일 때문에 일본에 세 번 가 봤어요."}, {"title": "경험 섞어 말하기", "tip": "해 본 적이 있는지는 해브로 말하고, 언제 했는지는 과거형으로 말합니다. 라스트 이어처럼 때를 붙이면 과거형으로 바꿔요.", "s": ["Yes, I have. I went last year.|네, 있어요. 작년에 갔어요.", "Not yet, but I want to.|아직이요, 하지만 해 보고 싶어요.", "I've never seen it before.|전에 본 적 없어요.", "Have you ever visited Korea?|한국에 와 본 적 있어요?", "When did you go there?|거기 언제 갔어요?", "How was it? Did you like it?|어땠어요? 좋았어요?", "It was my first time, too.|저도 처음이었어요.", "I've wanted to go for years.|몇 년 동안 가 보고 싶었어요."], "d": ["A:Have you ever been to New York?|뉴욕에 가 본 적 있어요?", "B:Yes, I have. I went last year.|네, 있어요. 작년에 갔어요.", "A:Really? How was it? Did you like it?|정말요? 어땠어요? 좋았어요?", "B:I loved it. Have you ever visited Korea?|정말 좋았어요. 한국에 와 본 적 있어요?"], "p": "How was it?|워즈 잇은 끊지 말고 워짓처럼 이어 말합니다. 앞 단어의 끝소리가 뒤의 모음에 붙어요.", "sub": ["Yes, I went there in May.|5월에 갔음", "No, but my brother has.|형제는 가 봄", "I've never been, but I'd love to.|가 보고 싶음", "When did you visit Korea?|한국 방문 언제", "How was the food there?|음식 어땠음", "I've always wanted to try it.|늘 해 보고 싶었음"], "st": ["Ella has never been abroad.|엘라는 해외에 가 본 적이 없어요.", "Last month, she went to Korea for the first time.|지난달 처음으로 한국에 갔어요.", "She tried kimchi and walked around old palaces.|김치를 먹어 보고 오래된 궁궐을 걸었어요.", "Now she says, It was the best trip ever.|이제 그녀는 최고의 여행이었다고 말해요."], "q": ["Where did Ella go last month?|To Korea.", "Was it her first trip abroad?|Yes, it was.", "What food did she try?|Kimchi."], "o": ["Have you ever been to Australia?|No, I haven't. But I'd love to go someday.", "Have you ever traveled with your baby?|Not yet. We're going to try it next year."], "my": "I've never traveled abroad with my baby, so I'm excited about our next trip.|아기와 해외여행을 해 본 적이 없어서 다음 여행이 기대돼요."}]}, "19": {"days": [{"title": "and then ~ 그다음에", "tip": "앤 덴은 그다음에 라는 뜻으로, 일어난 순서대로 이야기를 이어 줍니다. 과거형과 함께 써보세요.", "s": ["I had coffee and then went to work.|커피를 마시고 출근했어요.", "We had dinner, and then we walked.|저녁 먹고 나서 산책했어요.", "Go straight, and then turn left.|직진하고 그다음에 좌회전하세요.", "I'll check and then call you.|확인하고 전화드릴게요.", "Lunch first, and then the meeting.|점심 먼저, 그다음에 회의요.", "And then what happened?|그래서 어떻게 됐어요?", "We landed and then took a taxi.|착륙하고 나서 택시를 탔어요.", "Let's eat first and then decide.|먼저 먹고 그다음에 정해요."], "d": ["A:What did you do last night?|어젯밤에 뭐 했어요?", "B:We had dinner, and then we walked on the beach.|저녁 먹고 나서 해변을 걸었어요.", "A:Nice! And then what happened?|좋네요! 그다음엔요?", "B:We had coffee and then went to bed.|커피 마시고 잤어요."], "p": "I had coffee and then left.|앤드는 대화에서 드가 빠지고 아주 약한 은으로 줄어듭니다. 커피은덴처럼 앞말에 붙여 말하세요.", "sub": ["I showered and then had breakfast.|샤워 후 아침", "Turn right, and then go straight.|우회전 후 직진", "We'll eat and then go shopping.|먹고 쇼핑", "I called him and then sent an email.|전화 후 이메일", "Wash your hands, and then eat.|손 씻고 먹기", "We checked in and then rested.|체크인 후 휴식"], "st": ["Leo arrived in Tokyo in the morning.|레오는 아침에 도쿄에 도착했어요.", "He checked in and then had some ramen.|체크인하고 나서 라멘을 먹었어요.", "He walked around the city, and then he took a nap.|시내를 걷고 나서 낮잠을 잤어요.", "At night, he met a customer for dinner.|밤에는 고객을 만나 저녁을 먹었어요."], "q": ["Where did Leo arrive?|In Tokyo.", "What did he eat after he checked in?|Some ramen.", "Who did he meet at night?|A customer."], "o": ["What did you do last weekend?|We went to the park, and then we had lunch.", "What do you do after work?|I drive home and then play with my baby."], "my": "Last Saturday, we had breakfast and then went to the zoo.|지난 토요일에 아침을 먹고 나서 동물원에 갔어요."}, {"title": "but ~ 하지만", "tip": "벗은 앞말과 반대되는 말을 이어 줍니다. 좋은 점과 아쉬운 점을 한 문장에 담아보세요.", "s": ["It's small, but it's nice.|작지만 좋아요.", "I like it, but it's expensive.|좋은데 비싸요.", "I want to go, but I can't.|가고 싶은데 못 가요.", "It was cold, but we had fun.|추웠지만 재미있었어요.", "Sorry, but I have to go.|죄송하지만 가봐야 해요.", "The price is good, but delivery is slow.|가격은 좋은데 배송이 느려요.", "I'm tired, but I'm happy.|피곤하지만 행복해요.", "Good idea, but maybe next time.|좋은 생각인데 다음에 해요."], "d": ["A:Do you want to join us for a drink?|한잔하러 같이 갈래요?", "B:I want to go, but I can't.|가고 싶은데 못 가요.", "A:Oh, why not?|어, 왜요?", "B:Sorry, but I have to go. My baby is waiting.|미안하지만 가봐야 해요. 아기가 기다려요."], "p": "I like it, but it's expensive.|벗은 약하고 짧게 넘어가고, 벗 뒤의 말에 힘을 줍니다. 벗 뒤에 오는 말이 진짜 하고 싶은 말이에요.", "sub": ["It's old, but it's clean.|낡았지만 깨끗함", "I'd love to, but I'm busy.|하고 싶지만 바쁨", "It's far, but it's worth it.|멀지만 가 볼 만함", "I tried, but I couldn't.|해봤지만 못함", "It's cheap, but the quality is good.|싸지만 품질 좋음", "Sorry, but I don't understand.|죄송하지만 이해 못함"], "st": ["Mia went to Paris last summer.|미아는 지난여름에 파리에 갔어요.", "The city was beautiful, but it was very crowded.|도시는 아름다웠지만 아주 붐볐어요.", "The food was great, but it was expensive.|음식은 맛있었지만 비쌌어요.", "She was tired, but she wants to go again.|피곤했지만 그녀는 또 가고 싶어 해요."], "q": ["Where did Mia go?|To Paris.", "Was the city quiet?|No, it was very crowded.", "Does she want to go again?|Yes, she does."], "o": ["How was your trip?|It was short, but it was really fun.", "Do you like your job?|Yes, but it's sometimes stressful."], "my": "My baby was excited, but it was really hot.|아기는 신났지만 날이 정말 더웠어요."}, {"title": "Actually ~ 사실은", "tip": "액추얼리는 사실은 이라는 뜻으로, 상대 생각과 다른 말을 부드럽게 꺼낼 때 씁니다. 문장 맨 앞에 붙여보세요.", "s": ["Actually, I'm from Korea.|사실 저는 한국에서 왔어요.", "Actually, it's my first time.|사실 처음이에요.", "Actually, I have a question.|사실 질문이 하나 있어요.", "Actually, I don't drink coffee.|사실 저는 커피를 안 마셔요.", "Actually, it was really good.|사실 정말 좋았어요.", "Well, actually, it's a little small.|음, 사실 좀 작아요.", "Oh, I actually like it.|오, 저는 사실 그거 좋아해요.", "Actually, we make rivets, too.|사실 저희는 리벳도 만들어요."], "d": ["A:Are you from Japan?|일본에서 오셨어요?", "B:Actually, I'm from Korea.|사실 한국에서 왔어요.", "A:Oh, sorry! Do you come here often?|아, 미안해요! 여기 자주 오세요?", "B:No. Actually, it's my first time.|아뇨. 사실 처음이에요."], "p": "Actually|액추얼리는 첫 부분 액에 힘을 주고 나머지는 빠르게 흘립니다. 네 박자로 또박또박 말하지 마세요.", "sub": ["Actually, I'm a little tired.|사실 좀 피곤", "Actually, I changed my mind.|사실 마음 바꿈", "Actually, it's not far.|사실 안 멂", "Actually, I've been here before.|사실 와 봤음", "Actually, my baby is sleeping.|사실 아기 자는 중", "Actually, the price went up.|사실 가격 올랐음"], "st": ["At the airport, a woman asks Jun, Are you Chinese?|공항에서 한 여성이 준에게 중국 사람이냐고 물어요.", "Jun smiles and says, Actually, I'm Korean.|준은 웃으며 사실 한국 사람이라고 해요.", "She says, Oh! I actually love Korean dramas.|그녀는 사실 한국 드라마를 정말 좋아한다고 해요.", "They talk about dramas until the flight.|두 사람은 비행기 탈 때까지 드라마 이야기를 해요."], "q": ["Where are they?|At the airport.", "Is Jun Chinese?|No, he's Korean.", "What does the woman love?|Korean dramas."], "o": ["Is this your first time here?|Actually, no. I've been here twice.", "Do you want some coffee?|Actually, I'd like some tea, please."], "my": "Actually, my baby fell asleep before we saw the lions.|사실 아기는 사자를 보기도 전에 잠들었어요."}, {"title": "First, After that 순서 말하기", "tip": "퍼스트, 애프터 댓, 파이널리로 순서를 정리하면 긴 이야기도 쉽게 이어집니다.", "s": ["First, we went to the hotel.|먼저 호텔에 갔어요.", "After that, we had lunch.|그 후에 점심을 먹었어요.", "Finally, we got home at ten.|마침내 10시에 집에 도착했어요.", "Before dinner, I took a shower.|저녁 전에 샤워했어요.", "After the meeting, let's have lunch.|회의 끝나고 점심 먹어요.", "First, let me introduce our company.|먼저 저희 회사를 소개할게요.", "Then we'll talk about the price.|그다음에 가격 이야기를 할게요.", "In the end, it was fun.|결국 재미있었어요."], "d": ["A:So, where do we start?|자, 어디서부터 시작할까요?", "B:First, let me introduce our company.|먼저 저희 회사를 소개할게요.", "A:Sure. And the price?|좋아요. 가격은요?", "B:Then we'll talk about the price. After that, let's have lunch.|그다음에 가격 이야기를 하고요. 그 후에 점심 먹어요."], "p": "First, let me introduce our company.|퍼스트의 퍼는 윗니를 아랫입술에 대고 바람을 내보냅니다. 두 입술을 붙였다 떼는 프 소리가 아니에요.", "sub": ["First, check the size.|먼저 사이즈 확인", "After that, we went shopping.|그 후 쇼핑", "Finally, we found the hotel.|마침내 호텔 찾음", "Before lunch, let's finish this.|점심 전에 끝내기", "After work, I'll call you.|퇴근 후 전화", "In the end, we took a taxi.|결국 택시"], "st": ["Mr. Han visits a customer in Germany.|한 씨는 독일에 있는 고객을 방문해요.", "First, he shows them some samples.|먼저 샘플을 보여줘요.", "After that, they talk about prices and delivery.|그 후에 가격과 납기 이야기를 해요.", "Finally, they have dinner together.|마지막으로 함께 저녁을 먹어요."], "q": ["Where is Mr. Han's customer?|In Germany.", "What does he do first?|He shows them some samples.", "What do they do last?|They have dinner together."], "o": ["What did you do this morning?|First, I fed my baby. After that, I drove to work.", "How do you start a meeting?|First, I introduce our company. Then I show our products."], "my": "After that, we had lunch and went home early.|그 후에 점심을 먹고 일찍 집에 갔어요."}, {"title": "연결어 섞어 말하기", "tip": "앤 덴, 벗, 액추얼리를 섞어서 짧은 이야기를 만들어봅니다. 바이 더 웨이는 그런데 라는 뜻으로 화제를 바꿀 때 써요.", "s": ["By the way, where are you staying?|그런데 어디서 묵으세요?", "Anyway, it was a good trip.|어쨌든 좋은 여행이었어요.", "It was hard, but actually fun.|힘들었지만 사실 재미있었어요.", "We got lost, and then it rained.|길을 잃었는데 그다음에 비까지 왔어요.", "By the way, I love your bag.|그런데 가방 정말 예뻐요.", "Also, we make stainless steel screws.|또 저희는 스테인리스 나사도 만들어요.", "So, that's my story.|그래서, 이게 제 이야기예요.", "Anyway, let's get back to work.|어쨌든 다시 일하죠."], "d": ["A:How was your trip to Italy?|이탈리아 여행 어땠어요?", "B:We got lost, and then it rained.|길을 잃었는데 그다음에 비까지 왔어요.", "A:Oh no! That sounds hard.|저런! 힘들었겠네요.", "B:It was hard, but actually fun. Anyway, it was a good trip.|힘들었지만 사실 재미있었어요. 어쨌든 좋은 여행이었어요."], "p": "By the way|바이 더 웨이는 한 덩어리로 빠르게 말하고 마지막 웨이에 힘을 줍니다. 가운데 더는 아주 약하게 스쳐 지나가요.", "sub": ["By the way, what's your name?|그런데 이름이", "Anyway, thanks for your help.|어쨌든 감사", "It was long, but actually good.|길었지만 좋았음", "We ate, and then we went shopping.|먹고 쇼핑", "Also, we can deliver fast.|또 빠른 배송", "Actually, I have one more question.|사실 질문 하나 더"], "st": ["Sophie and her husband took their baby to Jeju.|소피와 남편은 아기를 데리고 제주에 갔어요.", "The flight was short, but the baby cried a lot.|비행은 짧았지만 아기가 많이 울었어요.", "They checked in, and then the baby fell asleep.|체크인하고 나서 아기가 잠들었어요.", "Actually, Sophie says it was their best trip.|사실 소피는 그게 최고의 여행이었다고 해요."], "q": ["Where did Sophie's family go?|To Jeju.", "What happened on the flight?|The baby cried a lot.", "When did the baby fall asleep?|After they checked in."], "o": ["How was your weekend?|It was busy, but actually fun. We went to the zoo.", "How's work these days?|Busy, but good. By the way, how's your family?"], "my": "It was short, but it was a really happy day.|짧았지만 정말 행복한 하루였어요."}]}, "20": {"days": [{"title": "I think ~ 내 생각엔", "tip": "아이 띵크는 내 생각을 부드럽게 꺼내는 말입니다. 문장 앞에 붙이기만 하면 단정하지 않고 겸손하게 들려요.", "s": ["Yes, I think so too.|네, 저도 그렇게 생각해요.", "I think it's a good idea.|좋은 생각인 것 같아요.", "I think it's too expensive.|너무 비싼 것 같아요.", "I think you're right.|당신 말이 맞는 것 같아요.", "I think it's going to rain.|비가 올 것 같아요.", "I think this one is better.|이게 더 나은 것 같아요.", "I think my baby is hungry.|아기가 배고픈 것 같아요.", "I think we're lost.|우리 길을 잃은 것 같아요."], "d": ["A:This place is really popular.|여기 정말 인기 많네요.", "B:Yes, I think so too. It's very busy.|네, 저도 그렇게 생각해요. 아주 붐비네요.", "A:Let's try the steak.|스테이크 먹어 봐요.", "B:Hmm, I think it's too expensive.|음, 너무 비싼 것 같아요."], "p": "I think so.|띵크의 첫소리는 혀끝을 윗니와 아랫니 사이에 살짝 물고 바람을 냅니다. 끝의 크는 거의 삼켜서 아이 띵쏘 처럼 이어 말하세요.", "sub": ["I think it's cold.|추운 것 같아요", "I think it's delicious.|맛있는 것 같아요", "I think he's busy.|그가 바쁜 것 같아요", "I think it's closed.|문 닫은 것 같아요", "I think it's a nice hotel.|좋은 호텔 같아요", "I think we're late.|늦은 것 같아요"], "st": ["Mark is at a market in Bangkok.|마크는 방콕의 한 시장에 있어요.", "He sees a nice bag.|그는 멋진 가방을 봐요.", "He thinks it's too expensive.|그는 그게 너무 비싸다고 생각해요.", "So he buys a cheaper one.|그래서 더 싼 걸 사요."], "q": ["Where is Mark?|At a market in Bangkok.", "What does he see?|A nice bag.", "What does he think about the bag?|He thinks it's too expensive."], "o": ["What do you think of this hotel?|I think it's really nice.", "Is it going to rain today?|I think so. It's very cloudy."], "my": "I think learning English is really important.|영어를 배우는 건 정말 중요하다고 생각해요."}, {"title": "I don't think ~ 부드럽게 반대하기", "tip": "아니라고 생각할 때는 아이 돈 띵크로 시작합니다. 아이 띵크 낫 보다 훨씬 자연스러워요.", "s": ["I don't think so.|그렇지 않은 것 같아요.", "I don't think it's far.|먼 것 같지 않아요.", "I don't think he's here.|그는 여기 없는 것 같아요.", "I don't think we have time.|우리 시간이 없을 것 같아요.", "I don't think it's a good idea.|좋은 생각은 아닌 것 같아요.", "I don't think it's open today.|오늘은 문을 안 여는 것 같아요.", "I don't think that's true.|그건 사실이 아닌 것 같아요.", "I don't think my baby likes it.|아기가 그걸 안 좋아하는 것 같아요."], "d": ["A:Let's walk to the museum.|박물관까지 걸어가요.", "B:Okay. I don't think it's far.|좋아요. 멀지 않은 것 같아요.", "A:Should we have lunch first?|점심 먼저 먹을까요?", "B:I don't think we have time.|시간이 없을 것 같아요."], "p": "I don't think so.|돈트의 트는 소리 내지 않고 혀만 잠깐 멈춥니다. 아이 돈 띵쏘 처럼 한 번에 이어서 말하세요.", "sub": ["I don't think it's spicy.|안 매운 것 같아요", "I don't think she's home.|그녀가 집에 없는 것 같아요", "I don't think it's expensive.|안 비싼 것 같아요", "I don't think we need a taxi.|택시 필요 없음", "I don't think it's going to rain.|비 안 올 것 같음", "I don't think it's a problem.|문제없을 것 같아요"], "st": ["Lisa's husband wants to go out.|리사의 남편은 외출하고 싶어 해요.", "But Lisa doesn't think it's a good idea.|하지만 리사는 좋은 생각이 아니라고 봐요.", "She thinks it's going to snow.|눈이 올 거라고 생각하거든요.", "So they stay home and watch a movie.|그래서 그들은 집에서 영화를 봐요."], "q": ["Who wants to go out?|Lisa's husband.", "What does Lisa think?|She thinks it's going to snow.", "What do they do?|They stay home and watch a movie."], "o": ["Is English easy for you?|No, I don't think it's easy. But it's fun.", "Do you think it's going to rain?|I don't think so. It's sunny now."], "my": "But I don't think it's easy for me.|하지만 저한테 쉽다고는 생각하지 않아요."}, {"title": "What do you think? 의견 묻기", "tip": "내 의견을 말한 다음에는 상대에게도 물어보세요. 왓 두 유 띵크 한마디면 대화가 상대에게 넘어갑니다.", "s": ["What do you think?|어떻게 생각하세요?", "What do you think of this?|이거 어떻게 생각하세요?", "What do you think about the food here?|여기 음식 어떻게 생각하세요?", "Do you think it's okay?|괜찮다고 생각하세요?", "Do you think we can make it?|우리 시간 맞출 수 있을까요?", "How do you like it here?|여기 어떠세요?", "Which one do you think is better?|어느 게 더 나은 것 같아요?", "What's your opinion on this?|이것에 대한 의견은 어때요?"], "d": ["A:This is my first time in Korea.|한국은 처음이에요.", "B:Really? How do you like it here?|정말요? 여기 어떠세요?", "A:I love it. The food is great.|정말 좋아요. 음식이 훌륭해요.", "B:What do you think of kimchi?|김치는 어떻게 생각하세요?"], "p": "What do you think?|왓 두 유는 빠른 대화에서 와루유 또는 워댜 처럼 뭉쳐집니다. 앞은 가볍게 흘리고 띵크에 힘을 주세요.", "sub" e best.|에이미는 하와이가 최고라고 생각해요.", "Ben agrees, but he's not sure about the price.|벤은 동의하지만 가격은 잘 모르겠대요.", "In the end, they choose Guam.|결국 그들은 괌을 골라요."], "q": ["What are Amy and Ben doing?|They're planning a trip.", "What is Ben not sure about?|The price.", "Which place do they choose?|Guam."], "o": ["Traveling with a baby is hard. Do you agree?|I agree. But it's also a lot of fun.", "Coffee is better than tea. Do you agree?|I agree. I drink coffee every morning."], "my": "I agree with her. Practicing in the car really helps.|저도 같은 생각이에요. 차에서 연습하는 게 정말 도움이 돼요."}, {"title": "의견 말하기 종합", "tip": "이번 주에 배운 의견 표현을 이어서 말해봅니다. 의견 다음에 이유를 하나 붙이면 훨씬 자연스러워요.", "s": ["In my opinion, it's worth it.|제 생각엔 그럴 만한 가치가 있어요.", "I think it's great because it's close.|가까워서 좋은 것 같아요.", "I don't think so. It's too far.|그렇지 않은 것 같아요. 너무 멀어요.", "What do you think? Be honest.|어떻게 생각해요? 솔직하게요.", "I agree, but it's a little crowded.|동의하지만 좀 붐벼요.", "I feel like it's too late.|너무 늦은 것 같아요.", "It seems like a nice place.|좋은 곳 같아요.", "Personally, I like the old one better.|개인적으로는 예전 게 더 좋아요."], "d": ["A:Which hotel should we book?|어느 호텔을 예약할까요?", "B:In my opinion, the beach hotel is better.|제 생각엔 해변 호텔이 더 나아요.", "A:Really? I think it's too expensive.|정말요? 너무 비싼 것 같은데요.", "B:Maybe, but I think it's worth it.|그럴 수도 있지만 그만한 가치가 있는 것 같아요."], "p": "In my opinion, it's worth it.|오피니언은 가운데 피에 힘을 주고 앞의 오는 어처럼 약하게 말합니다. 쉼표에서 잠깐 쉬면 의견이 또렷하게 들려요.", "sub": ["In my opinion, it's too long.|너무 길어요", "I feel like it's a little cold.|좀 추운 것 같아요", "It seems like a good deal.|좋은 거래 같아요", "Personally, I prefer the beach.|저는 바다가 좋아요", "I think it's worth the money.|돈값 해요", "I don't think it's worth it.|그만한 가치 없어요"], "st": ["Kevin's team is choosing a new supplier.|케빈의 팀은 새 거래처를 고르고 있어요.", "His boss likes the cheaper company.|상사는 더 싼 회사를 좋아해요.", "But Kevin thinks the other one is better.|하지만 케빈은 다른 회사가 더 낫다고 생각해요.", "He says, In my opinion, quality comes first.|그는 제 생각엔 품질이 먼저입니다 라고 말해요."], "q": ["What is Kevin's team doing?|Choosing a new supplier.", "Which company does his boss like?|The cheaper one.", "What does Kevin think comes first?|Quality."], "o": ["What's most important in business, do you think?|In my opinion, trust is the most important.", "Is a family trip worth the money?|I think so. The memories are worth it."], "my": "In my opinion, a little every day is the best way.|제 생각엔 매일 조금씩 하는 게 가장 좋은 방법이에요."}]}, "21": {"days": [{"title": "Would you ~? 공손한 부탁", "tip": "우쥬는 상대에게 정중하게 부탁하는 말입니다. 우쥬 마인드는 혹시 괜찮으시면 이라는 느낌으로 더 공손해요.", "s": ["Would you hold this for a second?|이것 좀 잠깐 들어 주시겠어요?", "Would you take our picture?|저희 사진 좀 찍어 주시겠어요?", "Would you open the window, please?|창문 좀 열어 주시겠어요?", "Would you mind waiting a minute?|잠깐 기다려 주시겠어요?", "Would you mind if I sit here?|여기 앉아도 괜찮을까요?", "Would you watch my bag for a minute?|제 가방 좀 잠깐 봐 주시겠어요?", "Sure, no problem at all.|그럼요, 전혀 문제없어요.", "Not at all. Go ahead.|전혀요. 그렇게 하세요."], "d": ["A:Excuse me. Would you mind if I sit here?|실례지만 여기 앉아도 괜찮을까요?", "B:Not at all. Go ahead.|전혀요. 앉으세요.", "A:Thanks. Are you here with your family?|고마워요. 가족이랑 오셨어요?", "B:Yes. Would you take our picture?|네. 저희 사진 좀 찍어 주시겠어요?"], "p": "Would you mind?|우드 유는 우쥬로 붙고, 마인드의 드는 거의 들리지 않게 끝납니다. 우쥬 마인 처럼 부드럽게 말하세요.", "sub": ["Would you close the door?|문 닫기", "Would you pass the salt?|소금 건네기", "Would you call me a taxi?|택시 불러 주기", "Would you mind helping me?|도와주기", "Would you mind speaking slowly?|천천히 말하기", "Would you check this for me?|확인해 주기"], "st": ["Jenny is at the airport with her baby.|제니는 아기와 함께 공항에 있어요.", "She needs to go to the restroom.|그녀는 화장실에 가야 해요.", "She asks a woman, Would you watch my bag?|한 여성에게 가방 좀 봐 달라고 부탁해요.", "The woman says, Sure, no problem.|그 여성은 그럼요, 문제없어요 라고 해요."], "q": ["Where is Jenny?|At the airport.", "Where does she need to go?|To the restroom.", "What does she ask the woman?|To watch her bag."], "o": ["Would you mind if I sit here?|Not at all. Go ahead.", "Do you need anything?|Yes. Would you bring some water, please?"], "my": "I asked a coworker, Would you help me with English?|동료에게 영어 좀 도와줄 수 있냐고 물었어요."}, {"title": "Why don't we ~? 같이 하자고 제안하기", "tip": "와이 돈 위는 왜 안 하냐는 뜻이 아니라 우리 같이 하자는 제안입니다. 와이 돈 유는 이렇게 해 보라는 권유예요.", "s": ["Why don't we take a break?|우리 좀 쉬는 게 어때요?", "Why don't we eat here?|여기서 먹는 게 어때요?", "Why don't we take a taxi?|택시 타는 게 어때요?", "Why don't we meet tomorrow?|내일 만나는 게 어때요?", "Why don't we go together?|같이 가는 게 어때요?", "Why don't you try this one?|이거 한번 드셔 보세요.", "Why don't you sit down?|좀 앉으세요.", "That's a great idea.|좋은 생각이에요."], "d": ["A:I'm so hungry.|너무 배고파요.", "B:Me too. Why don't we eat here?|저도요. 여기서 먹는 게 어때요?", "A:Good idea. What's good here?|좋아요. 여기 뭐가 맛있어요?", "B:Why don't you try the noodles?|국수 한번 드셔 보세요."], "p": "Why don't we go?|와이 돈트 위는 트가 빠지고 와이돈위 처럼 한 덩어리로 붙습니다. 끝의 동사에 힘을 주세요.", "sub": ["Why don't we go for a walk?|산책", "Why don't we order pizza?|피자 주문", "Why don't we ask someone?|누군가에게 묻기", "Why don't we leave early?|일찍 출발", "Why don't you call him?|그에게 전화", "Why don't you take a rest?|좀 쉬어요"], "st": ["Mike and his son are at the zoo.|마이크와 아들은 동물원에 있어요.", "His son is tired and hot.|아들은 피곤하고 더워해요.", "Mike says, Why don't we get some ice cream?|마이크가 아이스크림 먹을까 라고 말해요.", "His son smiles and says, Great idea!|아들이 웃으며 좋은 생각이에요! 라고 해요."], "q": ["Where are Mike and his son?|At the zoo.", "How does his son feel?|Tired and hot.", "What does Mike suggest?|Getting some ice cream."], "o": ["What should we do this afternoon?|Why don't we go to the beach?", "I'm so tired. What should I do?|Why don't you take a short break?"], "my": "He said, Sure. Why don't we practice at lunch?|그는 좋다며 점심시간에 연습하자고 했어요."}, {"title": "How about ~? Let's ~ 가볍게 제안하기", "tip": "하우 어바웃 뒤에는 명사를 넣거나 동사에 잉을 붙입니다. 렛츠는 바로 같이 하자는 가벼운 제안이에요.", "s": ["How about some coffee?|커피 어때요?", "How about tomorrow morning?|내일 아침 어때요?", "How about going to the beach?|바다에 가는 거 어때요?", "What about this one?|이건 어때요?", "Let's take a picture here.|여기서 사진 찍어요.", "Let's go this way.|이쪽으로 가요.", "Let's not hurry. We have time.|서두르지 말아요. 시간 있어요.", "Sounds good to me.|저는 좋아요."], "d": ["A:When can we meet?|언제 만날 수 있을까요?", "B:How about tomorrow morning?|내일 아침 어때요?", "A:Sounds good to me. Where?|좋아요. 어디서요?", "B:Let's meet in the hotel lobby.|호텔 로비에서 만나요."], "p": "How about some coffee?|하우 어바웃은 하워바웃 처럼 이어집니다. 어바웃의 바에 힘을 주고 끝의 트는 소리를 멈추기만 하세요.", "sub": ["How about Friday?|금요일", "How about lunch together?|같이 점심", "How about taking a taxi?|택시 타기", "Let's go home.|집에 가요", "Let's order now.|지금 주문", "Let's meet at six.|6시에 만나요"], "st": ["Sara and Paul are on a trip in Rome.|사라와 폴은 로마 여행 중이에요.", "Paul says, Let's go to the museum.|폴이 박물관에 가자고 해요.", "Sara says, How about lunch first?|사라는 점심 먼저 어떠냐고 해요.", "They eat pizza and then go to the museum.|그들은 피자를 먹고 박물관에 가요."], "q": ["Where are Sara and Paul?|In Rome.", "What does Sara want first?|Lunch.", "What do they eat?|Pizza."], "o": ["When are you free this week?|How about Thursday afternoon?", "Where should we eat tonight?|How about a seafood place near the hotel?"], "my": "I said, How about twice a week?|저는 일주일에 두 번 어떠냐고 했어요."}, {"title": "Do you want me to ~? 도와줄까요", "tip": "두 유 원트 미 투는 제가 해 드릴까요 라는 뜻입니다. 도움을 받으면 고맙다고 하고, 괜찮을 때는 부드럽게 사양하세요.", "s": ["Do you want me to help?|제가 도와드릴까요?", "Do you want me to call a taxi?|택시 불러 드릴까요?", "Should I send you the file?|파일 보내 드릴까요?", "Let me carry that for you.|그거 제가 들어 드릴게요.", "Yes, please. That'd be great.|네, 그래 주시면 좋겠어요.", "Thanks, but I'm okay.|고맙지만 괜찮아요.", "Thanks, maybe next time.|고마워요, 다음에요.", "That's very kind of you.|정말 친절하시네요."], "d": ["A:Your bags look heavy. Do you want me to help?|가방이 무거워 보여요. 도와드릴까요?", "B:Yes, please. That'd be great.|네, 그래 주시면 좋겠어요.", "A:No problem. Where's your room?|별말씀을요. 방이 어디예요?", "B:Third floor. That's very kind of you.|3층이에요. 정말 친절하시네요."], "p": "Do you want me to help?|두 유 원트 미 투는 대화에서 쥬 원미러 처럼 아주 빠르게 뭉쳐 들립니다. 원트의 트가 빠지고 투는 러 처럼 약해져요.", "sub": ["Do you want me to drive?|운전해 줄까요", "Do you want me to wait?|기다려 줄까요", "Should I call you later?|나중에 전화할까요", "Let me get the door.|문 열어 줄게요", "Let me pay this time.|이번엔 내가 낼게요", "Thanks, but I can do it.|고맙지만 내가 할 수 있어요"], "st": ["Mr. Lee is at a hotel in Singapore.|이 씨는 싱가포르의 한 호텔에 있어요.", "His baby is crying, and his bags are heavy.|아기는 울고 가방은 무거워요.", "A staff member says, Do you want me to help?|직원이 도와드릴까요 라고 말해요.", "Mr. Lee says, Yes, please. Thank you so much.|이 씨는 네, 정말 고마워요 라고 해요."], "q": ["Where is Mr. Lee?|At a hotel in Singapore.", "Why does he need help?|His baby is crying, and his bags are heavy.", "Who helps him?|A staff member."], "o": ["Do you want me to take your picture?|Yes, please. That'd be great.", "Should I call a taxi for you?|Thanks, but I'm okay. We'll walk."], "my": "Now he wants me to speak first every time.|이제 그는 매번 저보고 먼저 말하라고 해요."}, {"title": "부탁과 제안 종합", "tip": "부탁하고, 제안하고, 거절하는 말을 섞어서 연습합니다. 거절할 때도 그러고 싶지만 이라고 먼저 말하면 부드러워요.", "s": ["Would you like to join us?|저희랑 같이 하실래요?", "Could you do me a favor?|부탁 하나 들어주시겠어요?", "Why don't we split the bill?|나눠서 계산하는 게 어때요?", "How about a quick coffee?|간단히 커피 한잔 어때요?", "I'd love to, but I can't today.|그러고 싶지만 오늘은 안 돼요.", "Can we do it another time?|다음에 해도 될까요?", "Let's keep in touch.|계속 연락해요.", "Sure, why not? Let's go.|그럼요, 좋아요. 가요."], "d": ["A:We're going to the night market. Would you like to join us?|저희 야시장 가는데 같이 가실래요?", "B:I'd love to, but my baby is sleeping.|그러고 싶은데 아기가 자고 있어요.", "A:Oh, okay. How about tomorrow night?|아, 그렇군요. 내일 밤은 어때요?", "B:Sure, why not? Let's go tomorrow.|그럼요, 좋아요. 내일 가요."], "p": "Would you like to join us?|부탁과 제안은 끝을 부드럽게 올리면 공손하게 들립니다. 끝을 뚝 떨어뜨리면 명령처럼 들릴 수 있어요.", "sub": ["Would you like to come with us?|같이 가기", "Could you do me a big favor?|큰 부탁", "Why don't we share a taxi?|택시 같이 타기", "How about dinner on Friday?|금요일 저녁", "I'd love to, but I'm busy.|바빠서 안 돼요", "Let's do it next time.|다음에 해요"], "st": ["Anna meets a couple at the hotel pool.|안나는 호텔 수영장에서 한 커플을 만나요.", "They ask, Would you like to join us for dinner?|그들은 저녁 같이 하겠냐고 물어요.", "Anna says, I'd love to, but I'm tired today.|안나는 그러고 싶지만 오늘은 피곤하다고 해요.", "So they say, How about tomorrow?|그래서 그들은 내일은 어떠냐고 해요."], "q": ["Where does Anna meet the couple?|At the hotel pool.", "What do they ask her?|To join them for dinner.", "Why can't she go today?|She's tired."], "o": ["Would you like to have dinner with us?|I'd love to. What time?", "Could you do me a favor?|Sure. What is it?"], "my": "It's not easy, but I'm getting better.|쉽지 않지만 점점 나아지고 있어요."}]}, "22": {"days": [{"title": "That's great! 기쁨 리액션", "tip": "좋은 소식을 들으면 크게 반응해 주세요. 리액션은 평소보다 높고 길게 말해야 진심으로 들립니다.", "s": ["That's such great news!|정말 좋은 소식이네요!", "Wow, that's really amazing!|와, 정말 대단하네요!", "Congratulations on your new baby!|아기 태어난 거 축하해요!", "I'm so happy for you.|정말 잘됐네요.", "Well done! I knew you could do it.|잘했어요! 해낼 줄 알았어요.", "That sounds like fun.|재밌겠네요.", "How exciting! When do you leave?|정말 신나겠네요! 언제 떠나요?", "You must be so proud.|정말 뿌듯하시겠어요."], "d": ["A:My daughter started school this year.|딸이 올해 학교에 들어갔어요.", "B:Wow, that's great news!|와, 정말 좋은 소식이네요!", "A:Yes, and she loves it.|네, 그리고 아주 좋아해요.", "B:You must be so proud.|정말 뿌듯하시겠어요."], "p": "That's amazing!|감정 리액션은 힘주는 단어를 높고 길게 끌어 줍니다. 어메이징의 메이를 크게 올려 말하세요.", "sub": ["That's wonderful!|멋져요", "That's awesome!|최고예요", "How nice!|좋네요", "I'm so glad to hear that.|그 말 들으니 기뻐요", "That sounds exciting.|신나겠어요", "You must be so happy.|정말 기쁘시겠어요"], "st": ["Rachel calls her friend Tim.|레이첼은 친구 팀에게 전화해요.", "She says, I got the job!|그녀는 나 취직했어! 라고 말해요.", "Tim says, Congratulations! That's great news!|팀은 축하해! 정말 좋은 소식이야! 라고 해요.", "They decide to have dinner together.|그들은 같이 저녁을 먹기로 해요."], "q": ["Who does Rachel call?|Her friend Tim.", "What's her news?|She got the job.", "What do they decide to do?|Have dinner together."], "o": ["Did you hear I'm getting married next month?|Wow, congratulations! That's great news.", "How do you feel when your baby smiles?|I feel so happy. It's the best feeling."], "my": "When my baby first walked, I was so happy.|아기가 처음 걸었을 때 정말 행복했어요."}, {"title": "Oh no! 안타까움과 위로", "tip": "안 좋은 소식에는 목소리를 낮추고 천천히 말합니다. 짧은 위로 한마디가 큰 힘이 돼요.", "s": ["Oh no! Are you okay?|저런! 괜찮으세요?", "Oh, that's too bad.|아, 안됐네요.", "I'm sorry to hear that.|그 말을 들으니 안타깝네요.", "That must be hard.|정말 힘드시겠어요.", "Don't worry about it.|걱정하지 마세요.", "It's not your fault.|당신 잘못이 아니에요.", "I hope you feel better soon.|빨리 나으시길 바라요.", "Is there anything I can do?|제가 뭐 도와드릴 게 있을까요?"], "d": ["A:I lost my phone at the beach.|해변에서 휴대폰을 잃어버렸어요.", "B:Oh no! That's too bad.|저런! 안됐네요.", "A:I know. All my photos were on it.|그러게요. 사진이 전부 거기 있었어요.", "B:I'm sorry. Is there anything I can do?|안타까워요. 제가 뭐 도와드릴 게 있을까요?"], "p": "Oh no. That's too bad.|위로할 때는 목소리를 낮추고 천천히 말합니다. 투 배드에서 말끝을 내리며 부드럽게 마무리하세요.", "sub": ["That's a shame.|아쉽네요", "That's terrible.|끔찍하네요", "I'm sorry about that.|그 일은 유감이에요", "That must be tough.|힘드시겠어요", "Take care of yourself.|몸 잘 챙기세요", "I hope it gets better.|나아지길 바라요"], "st": ["David's flight is canceled.|데이비드의 비행기가 취소됐어요.", "He has to wait until tomorrow.|그는 내일까지 기다려야 해요.", "A woman says, Oh no, that's too bad.|한 여성이 저런, 안됐네요 라고 말해요.", "She tells him about a good hotel nearby.|그녀는 근처 좋은 호텔을 알려줘요."], "q": ["What happened to David's flight?|It's canceled.", "How long does he have to wait?|Until tomorrow.", "What does the woman tell him about?|A good hotel nearby."], "o": ["My flight got delayed three hours. Can you believe it?|Oh no, that's terrible. Are you okay?", "I lost my wallet yesterday. What should I do?|Oh no, I'm sorry. Why don't you call the police?"], "my": "But then the baby fell down and cried.|그런데 아기가 넘어져서 울었어요."}, {"title": "I'm so ~ 내 기분 말하기", "tip": "아임 쏘 뒤에 기분을 넣으면 내 감정을 말할 수 있습니다. 쏘를 길게 끌수록 감정이 커져요.", "s": ["I'm so excited about this trip.|이번 여행이 너무 신나요.", "I'm a little nervous.|조금 긴장돼요.", "I'm really worried about it.|그게 정말 걱정돼요.", "I'm so tired today.|오늘 너무 피곤해요.", "I'm so relieved to hear that.|그 말을 들으니 정말 안심돼요.", "I'm a bit disappointed.|조금 실망했어요.", "I'm really looking forward to it.|정말 기대돼요.", "I was so surprised.|정말 놀랐어요."], "d": ["A:Is this your first trip abroad with the baby?|아기랑 처음 해외여행 오신 거예요?", "B:Yes. I'm so excited about this trip.|네. 이번 여행이 너무 신나요.", "A:How was the flight?|비행은 어땠어요?", "B:I was a little nervous, but it was fine.|조금 긴장했는데 괜찮았어요."], "p": "I'm so excited.|익사이티드는 가운데 사이에 힘을 줍니다. 쏘를 길게 끌면 감정이 더 크게 전달돼요.", "sub": ["I'm so happy.|너무 행복해요", "I'm so bored.|너무 심심해요", "I'm a little scared.|조금 무서워요", "I'm really angry.|정말 화나요", "I'm so proud of my team.|우리 팀이 자랑스러워요", "I'm looking forward to the trip.|여행이 기대돼요"], "st": ["Kate has a big presentation today.|케이트는 오늘 큰 발표가 있어요.", "In the morning, she's very nervous.|아침에 그녀는 많이 긴장해요.", "But the presentation goes really well.|하지만 발표가 아주 잘 돼요.", "Now she's relieved and very happy.|이제 그녀는 안심되고 아주 기뻐요."], "q": ["What does Kate have today?|A big presentation.", "How does she feel in the morning?|Very nervous.", "How does she feel now?|Relieved and happy."], "o": ["How do you feel about your next trip?|I'm so excited. I'm really looking forward to it.", "How do you feel before a big meeting?|I'm a little nervous, but I'm okay."], "my": "I was really worried, but it was okay.|정말 걱정했는데 괜찮았어요."}, {"title": "Really? 놀람 리액션", "tip": "놀랐을 때는 끝을 확 올려서 말합니다. 목소리가 함께 놀라야 상대가 신나서 이야기를 이어가요.", "s": ["Really? Are you serious?|정말요? 진짜예요?", "No way! That's crazy!|말도 안 돼요! 대박이에요!", "Seriously? Ten hours on a plane?|진짜요? 비행기를 열 시간이나요?", "I can't believe it!|믿을 수가 없어요!", "You're kidding me! Is that true?|농담이죠! 그게 사실이에요?", "What a nice surprise!|정말 반가운 깜짝 소식이네요!", "I had no idea.|전혀 몰랐어요.", "Oh, I didn't know that.|아, 그건 몰랐어요."], "d": ["A:I have five kids.|저는 아이가 다섯이에요.", "B:Really? Are you serious?|정말요? 진짜예요?", "A:Yes! And twins are coming next month.|네! 그리고 다음 달에 쌍둥이가 태어나요.", "B:No way! I can't believe it!|말도 안 돼요! 믿을 수가 없어요!"], "p": "Seriously? No way!|씨리어슬리는 첫 음절 씨에 힘을 주고 끝을 확 올립니다. 노 웨이는 웨이를 길게 끌어 놀람을 보여주세요.", "sub": ["Are you sure?|확실해요", "That's so funny!|너무 웃겨요", "I didn't expect that.|예상 못 했어요", "What a small world!|세상 좁네요", "Wow, that's a lot!|와, 많네요", "You're joking, right?|농담이죠"], "st": ["Mia meets a man at a hotel in Hawaii.|미아는 하와이의 한 호텔에서 한 남자를 만나요.", "He's from the same small town as her.|그는 그녀와 같은 작은 마을 출신이에요.", "Mia says, No way! What a small world!|미아는 말도 안 돼! 세상 좁네! 라고 해요.", "They laugh and talk for an hour.|그들은 웃으며 한 시간 동안 이야기해요."], "q": ["Where does Mia meet the man?|At a hotel in Hawaii.", "Where is the man from?|The same small town as her.", "How long do they talk?|For an hour."], "o": ["I've been to Korea ten times. Can you believe it?|Really? Ten times? That's amazing!", "Did you know my wife is from Korea?|No way! I had no idea. Where in Korea?"], "my": "Now my baby walks everywhere. I can't believe it!|이제 아기가 여기저기 걸어 다녀요. 믿기지가 않아요!"}, {"title": "리액션 종합", "tip": "기쁨, 위로, 놀람 리액션을 상황에 맞게 골라 써봅니다. 리액션 뒤에 질문을 하나 붙이면 대화가 이어져요.", "s": ["Wow, really? Tell me more.|와, 정말요? 더 얘기해 주세요.", "That's great! When did it happen?|잘됐네요! 언제 그랬어요?", "Oh no. What happened?|저런. 무슨 일이에요?", "I know! It's so cute.|그러니까요! 너무 귀여워요.", "That's so funny! I love it.|너무 웃겨요! 정말 좋아요.", "Good for you! You deserve it.|잘됐네요! 그럴 자격 있어요.", "Me too! I feel the same.|저도요! 같은 마음이에요.", "What a relief! I was so worried.|정말 다행이에요! 너무 걱정했어요."], "d": ["A:My son said his first word yesterday.|아들이 어제 처음으로 말을 했어요.", "B:Wow, really? What did he say?|와, 정말요? 뭐라고 했어요?", "A:He said Dad! Not Mom!|아빠라고 했어요! 엄마가 아니라요!", "B:That's so funny! You must be so happy.|너무 웃기네요! 정말 기쁘시겠어요."], "p": "What a relief!|왓 어는 와러 처럼 이어집니다. 와러 릴리프 하고, 릴리프의 리에 힘을 주세요.", "sub": ["What a nice view!|멋진 경치", "What a cute baby!|귀여운 아기", "What a beautiful day!|아름다운 날", "Oh no, what happened?|무슨 일이에요", "Wow, tell me more.|더 얘기해 줘요", "I know, right?|그러니까요"], "st": ["John shows his coworkers a photo.|존은 동료들에게 사진을 보여줘요.", "It's his new baby girl.|그의 갓 태어난 딸이에요.", "Everyone says, What a cute baby!|모두가 아기 너무 귀엽다 라고 말해요.", "John smiles. He's tired, but very happy.|존은 웃어요. 피곤하지만 아주 행복해요."], "q": ["What does John show his coworkers?|A photo of his new baby girl.", "What does everyone say?|What a cute baby!", "How does John feel?|Tired, but very happy."], "o": ["Did you know my son can swim now?|Wow, really? That's great! How old is he?", "We missed our flight yesterday. Can you believe it?|Oh no! What happened?"], "my": "Every day is a surprise, and I love it.|매일이 놀라움이고, 저는 그게 너무 좋아요."}]}, "23": {"days": [{"title": "When ~ 할 때", "tip": "웬 뒤에 상황을 말하고, 쉼표에서 한 번 쉰 뒤 하는 일을 말합니다. 두 덩어리로 나누면 긴 문장도 쉬워요.", "s": ["When I travel, I take lots of pictures.|여행할 때 사진을 많이 찍어요.", "When I'm tired, I drink coffee.|피곤할 때 커피를 마셔요.", "When my baby sleeps, I read a book.|아기가 잘 때 책을 읽어요.", "When I was young, I played soccer a lot.|어렸을 때 축구를 많이 했어요.", "Call me when you get there.|도착하면 전화 주세요.", "When I got home, everyone was asleep.|집에 왔을 때 모두 자고 있었어요.", "When you're free, let's grab lunch.|시간 될 때 점심 같이 해요.", "What do you do when you're stressed?|스트레스 받을 때 뭐 하세요?"], "d": ["A:What do you do when you're stressed?|스트레스 받을 때 뭐 하세요?", "B:When I'm stressed, I go for a run.|스트레스 받으면 달리러 나가요.", "A:Me too. When do you usually run?|저도요. 보통 언제 달려요?", "B:When my baby is asleep, usually at night.|아기가 잘 때요, 보통 밤에요."], "p": "When I travel, I take pictures.|긴 문장은 쉼표에서 한 번 쉬고 두 덩어리로 나눠 말합니다. 앞 덩어리 끝을 살짝 올리면 말이 이어진다는 신호가 돼요.", "sub": ["When I'm hungry, I get grumpy.|배고프면 짜증 나요", "When it snows, we stay home.|눈 오면 집에", "When I was a kid, I loved cars.|어릴 때 자동차", "Text me when you arrive.|도착하면 문자", "When I'm free, I watch movies.|한가할 때 영화", "When we meet, let's have dinner.|만나면 저녁"], "st": ["When Chris travels, he always gets up early.|크리스는 여행할 때 항상 일찍 일어나요.", "When the streets are quiet, he takes pictures.|거리가 조용할 때 그는 사진을 찍어요.", "When his family wakes up, he buys breakfast.|가족이 깨어나면 그는 아침을 사 와요.", "His wife says he's the best travel partner.|아내는 그가 최고의 여행 파트너라고 해요."], "q": ["What does Chris do when he travels?|He gets up early.", "When does he take pictures?|When the streets are quiet.", "What does he do when his family wakes up?|He buys breakfast."], "o": ["What do you do when you have free time?|When I have free time, I play with my baby.", "What do you do when you can't sleep?|When I can't sleep, I listen to music."], "my": "When I drive to work, I listen to English.|출근길에 운전할 때 영어를 들어요."}, {"title": "If ~ 하면", "tip": "이프는 만약 하면 이라는 조건입니다. 이프 뒤는 현재형으로 말하고, 뒤 문장은 윌이나 부탁하는 말로 이어요.", "s": ["If it rains, we'll stay inside.|비가 오면 안에 있을 거예요.", "If you're hungry, let's eat now.|배고프면 지금 먹어요.", "If I have time, I'll call you.|시간 되면 전화할게요.", "If you need help, just ask me.|도움이 필요하면 그냥 저한테 말하세요.", "If it's too expensive, we won't buy it.|너무 비싸면 안 살 거예요.", "If you come to Korea, let me know.|한국에 오시면 알려 주세요.", "I'll send it if you want.|원하시면 보내 드릴게요.", "What will you do if it rains?|비 오면 뭐 할 거예요?"], "d": ["A:What will you do if it rains tomorrow?|내일 비 오면 뭐 할 거예요?", "B:If it rains, we'll go to the aquarium.|비 오면 아쿠아리움에 갈 거예요.", "A:Good idea. If you need a ride, call me.|좋은 생각이에요. 차가 필요하면 전화하세요.", "B:Thanks. If I need one, I'll call you.|고마워요. 필요하면 전화할게요."], "p": "If it rains, we'll stay inside.|이프 잇은 붙여서 이핏 처럼 말합니다. 위 윌은 윌 한 음절로 짧게 줄이세요.", "sub": ["If it's sunny, we'll go hiking.|맑으면 등산", "If you're tired, take a rest.|피곤하면 쉬어요", "If I'm late, start without me.|늦으면 먼저 시작", "If you like it, buy it.|마음에 들면 사요", "If the price is good, we'll order.|가격 좋으면 주문", "If you visit, I'll show you around.|오시면 안내"], "st": ["Emma and her husband plan a picnic.|엠마와 남편은 소풍을 계획해요.", "If it's sunny, they'll go to the park.|맑으면 공원에 갈 거예요.", "If it rains, they'll go to a museum.|비가 오면 박물관에 갈 거예요.", "The next day is sunny. They go to the park.|다음 날은 맑아요. 그들은 공원에 가요."], "q": ["What do Emma and her husband plan?|A picnic.", "Where will they go if it rains?|To a museum.", "Where do they go in the end?|To the park."], "o": ["What will you do if you have a day off?|If I have a day off, I'll go somewhere with my family.", "What do you do if a customer is angry?|If a customer is angry, I listen first."], "my": "If I don't understand, I just repeat it.|못 알아들으면 그냥 따라 해요."}, {"title": "because, but 이유와 반전", "tip": "비코즈로 이유를, 벗으로 반대 내용을 이어 붙입니다. 두 문장을 하나로 이으면 말이 훨씬 자연스러워요.", "s": ["I'm late because of the traffic.|차가 막혀서 늦었어요.", "I like it because it's simple.|단순해서 좋아요.", "I'm tired because my baby woke up.|아기가 깨서 피곤해요.", "It's small, but it's very strong.|작지만 아주 튼튼해요.", "I wanted to go, but I was busy.|가고 싶었는데 바빴어요.", "It's cheap, but the quality is good.|싸지만 품질이 좋아요.", "We came here because it's near the beach.|해변에서 가까워서 여기 왔어요.", "I called him, but he didn't answer.|그에게 전화했지만 받지 않았어요."], "d": ["A:Why did you choose this hotel?|왜 이 호텔을 골랐어요?", "B:We came here because it's near the beach.|해변에서 가까워서 여기 왔어요.", "A:Nice. Is the room good?|좋네요. 방은 괜찮아요?", "B:It's small, but it's very clean.|작지만 아주 깨끗해요."], "p": "I'm late because of the traffic.|비코즈는 빠른 대화에서 커즈 처럼 짧게 줄어듭니다. 앞의 비는 거의 들리지 않아요.", "sub": ["I'm happy because it's Friday.|금요일이라 행복", "I stayed home because I was sick.|아파서 집에", "I bought it because it was cheap.|싸서 샀어요", "It's old, but it works well.|오래됐지만 잘 돼요", "I tried, but it didn't work.|해봤지만 안 됐어요", "It's expensive, but it's worth it.|비싸지만 가치 있어요"], "st": ["Jason wanted to go to the beach.|제이슨은 해변에 가고 싶었어요.", "But he stayed at the hotel because it was windy.|하지만 바람이 불어서 호텔에 있었어요.", "He was bored, but his son was happy.|그는 지루했지만 아들은 즐거웠어요.", "The hotel had a big indoor pool.|호텔에 큰 실내 수영장이 있었거든요."], "q": ["Where did Jason want to go?|To the beach.", "Why did he stay at the hotel?|Because it was windy.", "Why was his son happy?|Because the hotel had a big pool."], "o": ["Why do you like your job?|I like it because I meet a lot of people.", "Do you like spicy food?|I like it, but my wife doesn't."], "my": "It's hard because I'm tired, but I keep going.|피곤해서 힘들지만 계속해요."}, {"title": "before, after, so 순서와 결과", "tip": "비포는 전에, 애프터는 후에, 쏘는 그래서 입니다. 일의 순서와 결과를 한 문장으로 이어 말해보세요.", "s": ["I drink coffee before I go to work.|출근하기 전에 커피를 마셔요.", "After work, I play with my baby.|퇴근 후에 아기와 놀아요.", "Wash your hands before you eat.|먹기 전에 손 씻어요.", "After we ate, we went for a walk.|밥 먹은 후에 산책했어요.", "It was late, so we took a taxi.|늦어서 택시를 탔어요.", "I was hungry, so I ordered pizza.|배고파서 피자를 시켰어요.", "The shop was closed, so we came back.|가게가 닫혀서 돌아왔어요.", "Let's check in before we have lunch.|점심 먹기 전에 체크인해요."], "d": ["A:What do you usually do after work?|퇴근 후에 보통 뭐 하세요?", "B:After work, I play with my baby.|퇴근 후에 아기와 놀아요.", "A:That's sweet. Do you cook, too?|다정하네요. 요리도 하세요?", "B:Sometimes. I'm not good at it, so I keep it simple.|가끔요. 잘 못해서 간단하게 해요."], "p": "After work, I play with my baby.|애프터의 터는 혀를 가볍게 튕겨서 러 처럼 냅니다. 애프러 워크 처럼 들려요.", "sub": ["Brush your teeth before you sleep.|자기 전 양치", "After lunch, let's have coffee.|점심 후 커피", "Call me before you leave.|떠나기 전 전화", "It was raining, so we stayed in.|비 와서 집에", "I was tired, so I went to bed early.|피곤해서 일찍 잠", "It was cheap, so I bought two.|싸서 두 개 샀어요"], "st": ["Before the meeting, Tom checked the samples.|회의 전에 톰은 샘플을 확인했어요.", "The buyer liked them, so he ordered more.|바이어가 마음에 들어 해서 더 주문했어요.", "After the meeting, they had dinner together.|회의 후에 그들은 함께 저녁을 먹었어요.", "Tom was tired, but very happy.|톰은 피곤했지만 아주 기뻤어요."], "q": ["What did Tom do before the meeting?|He checked the samples.", "Why did the buyer order more?|Because he liked the samples.", "What did they do after the meeting?|They had dinner together."], "o": ["What do you do before you go to bed?|Before I go to bed, I check on my baby.", "What did you do after work yesterday?|I was tired, so I went to bed early."], "my": "After work, I practice again so I don't forget.|퇴근 후에 잊어버리지 않게 다시 연습해요."}, {"title": "긴 문장 종합", "tip": "웬, 이프, 비코즈, 벗, 쏘를 섞어서 두 덩어리 문장을 만들어 봅니다. 중요한 단어에만 힘을 주고 나머지는 가볍게 넘어가세요.", "s": ["When I have time, I'll visit your factory.|시간 되면 귀사 공장을 방문할게요.", "If you like it, I'll send more samples.|마음에 드시면 샘플을 더 보내 드릴게요.", "I was nervous because it was my first time.|처음이라서 긴장했어요.", "It's a long trip, but my baby loves flying.|긴 여행이지만 아기는 비행기를 좋아해요.", "The rivets are small, but they're very strong.|리벳은 작지만 아주 튼튼해요.", "It was sunny, so we went to the beach.|날씨가 맑아서 해변에 갔어요.", "When we got there, the hotel was full.|도착했을 때 호텔이 꽉 차 있었어요.", "If you have questions, feel free to ask.|질문 있으면 편하게 물어보세요."], "d": ["A:How was your flight with the baby?|아기랑 비행은 어땠어요?", "B:It was long, but my baby slept a lot.|길었지만 아기가 많이 잤어요.", "A:Lucky you! What will you do tomorrow?|운이 좋았네요! 내일은 뭐 할 거예요?", "B:If it's sunny, we'll go to the beach.|맑으면 해변에 갈 거예요."], "p": "I was nervous because it was my first time.|긴 문장에서는 중요한 단어만 크고 길게 말합니다. 너버스와 퍼스트 타임에 힘을 주고 나머지는 빠르게 지나가세요.", "sub": ["When I visited Tokyo, I ate lots of sushi.|도쿄에서 초밥", "If it's on sale, I'll buy two.|세일하면 두 개", "I couldn't sleep because the room was hot.|방이 더워서 못 잠", "It's heavy, but it's easy to use.|무겁지만 쓰기 쉬움", "The meeting ended early, so we went shopping.|회의 일찍 끝나 쇼핑", "When you're ready, let me know.|준비되면 알려줘요"], "st": ["When Mr. Choi visited Vietnam, he met a new buyer.|최 씨는 베트남에 갔을 때 새 바이어를 만났어요.", "The buyer was worried because the price was high.|바이어는 가격이 높아서 걱정했어요.", "Mr. Choi said, If you order more, it'll be cheaper.|최 씨는 더 많이 주문하면 더 싸진다고 했어요.", "The buyer agreed, so they signed the deal.|바이어가 동의해서 그들은 계약했어요."], "q": ["Who did Mr. Choi meet in Vietnam?|A new buyer.", "Why was the buyer worried?|Because the price was high.", "What happened in the end?|They signed the deal."], "o": ["What do you do when you travel with your baby?|When we travel, we always pack lots of snacks.", "What will you do if you get a long vacation?|If I get a long vacation, I'll go to Europe with my family."], "my": "If I keep this up, I'll be able to talk on our next trip.|이렇게 계속하면 다음 여행에서는 대화할 수 있을 거예요."}]}, "24": {"days": [{"title": "호텔에서: 여행 이야기와 계획", "tip": "호텔 로비에서 다른 여행객과 이야기하는 상황입니다. 지난 일, 경험, 계획을 섞어서 말해보세요.", "s": ["We got here yesterday.|저희는 어제 여기 왔어요.", "We came from Korea for a week.|한국에서 일주일 일정으로 왔어요.", "Have you ever stayed here before?|여기 묵어 보신 적 있어요?", "This is our first time here.|여기는 처음이에요.", "We went snorkeling this morning.|오늘 아침에

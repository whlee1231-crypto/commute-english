<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121417">
<title>출퇴근 영어</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@200;300;500&family=Noto+Sans+KR:wght@300;400;500;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 다크 계기판: 밤에 켜진 자동차 클러스터. 앰버 한 색만 "지금 할 일"에 쓰고 나머지는 조용히 둔다.
   숫자(시간, 진도, D-day)는 계기판 숫자처럼 가는 좁은 글꼴로 크게. */
:root{color-scheme:dark;
 --bg:#121417;--panel:#1B1E23;--panel2:#252A31;--line:#30363E;
 --fg:#F2EFE9;--muted:#A6ACB5;--dim:#878E98;
 --amber:#FFB02E;--amber-ink:#1A1204;--amber-soft:rgba(255,176,46,.14);
 --ok:#9FD8B4;--warn:#FF7A5C;
 --num:"Barlow Condensed","Noto Sans KR",sans-serif;
 --body:"Pretendard Variable",Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.6 var(--body);-webkit-font-smoothing:antialiased;
 padding-block:20px 104px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto;display:grid;gap:22px}
h1,h2,h3,p{margin:0}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
select,input,textarea{font-size:16px}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}

/* 머리 */
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.top h1{font:500 17px/1.2 var(--body);letter-spacing:-.01em;color:var(--muted)}
.dday{font:300 22px/1 var(--num);color:var(--fg);font-variant-numeric:tabular-nums;letter-spacing:.02em}

/* 오늘 계기판 */
.sign{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px 20px 20px;display:grid;gap:16px;
 box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.sign .where{font-size:14px;color:var(--muted)}
.sign h2{font:300 clamp(30px,9vw,42px)/1.18 var(--body);letter-spacing:-.025em;text-wrap:balance}
.sign .tip{color:var(--muted);font-size:15px;line-height:1.65}
.go{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.go button{border:1px solid var(--line);border-radius:14px;padding:16px 14px;font-weight:500;font-size:17px;background:var(--panel2);color:var(--fg);min-height:84px;text-align:left;display:grid;align-content:space-between;gap:6px}
.go button.next{background:var(--amber);border-color:var(--amber);color:var(--amber-ink);font-weight:700}
.go small{display:block;font-weight:400;font-size:13px;opacity:.75}
.meter{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;margin-top:2px}
.meter .track{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.meter .fill{display:block;height:100%;background:var(--amber);border-radius:2px}
.meter b{font:300 20px/1 var(--num);font-variant-numeric:tabular-nums;color:var(--fg)}
.meter b small{font-size:14px;color:var(--muted);margin-left:1px}

/* 안내 칸 */
.notice{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:10px;font-size:15px;color:var(--muted)}
.notice b{display:block;color:var(--fg);font-weight:500}
.notice.alert{border-color:rgba(255,176,46,.55);background:linear-gradient(var(--amber-soft),var(--amber-soft)),var(--panel)}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:10px 16px;font-weight:500;font-size:15px;min-height:46px;color:var(--fg)}
.btn.primary{background:var(--amber);border-color:var(--amber);color:var(--amber-ink);font-weight:700}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* 누적 숫자 */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.stats div{min-width:0;background:var(--bg);padding:14px 12px}
.stats b{display:block;font:300 30px/1.1 var(--num);font-variant-numeric:tabular-nums;letter-spacing:.01em;white-space:nowrap}
.stats span{font-size:13px;color:var(--muted)}
.pace{font-size:14px;color:var(--muted)}

/* 아래 메뉴 */
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(21,23,26,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
nav button{border:0;background:none;padding:16px 4px;color:var(--dim);font-weight:500;font-size:14px;position:relative}
nav button[aria-current="true"]{color:var(--fg)}
nav button[aria-current="true"]::after{content:"";position:absolute;left:50%;bottom:8px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--amber)}
h3.sec{font:500 18px/1.3 var(--body);letter-spacing:-.01em}

/* 노선 */
.route{list-style:none;margin:0;padding:0;display:grid}
.route>li{position:relative;padding:0 0 22px 30px}
.route>li::before{content:"";position:absolute;left:8px;top:8px;bottom:-8px;width:2px;background:var(--line)}
.route>li:last-child::before{display:none}
.route>li.done::before{background:var(--muted)}
.route>li i{position:absolute;left:3px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--dim)}
.route>li.done i{background:var(--muted);border-color:var(--muted)}
.route>li.now i{background:var(--amber);border-color:var(--amber);box-shadow:0 0 0 5px var(--amber-soft)}
.route .wk{font:300 16px var(--num);color:var(--muted);font-variant-numeric:tabular-nums}
.route b{display:block;font-weight:500}
.route p{font-size:14px;color:var(--muted)}
details{margin-top:6px;font-size:14px}
summary{color:var(--muted);cursor:pointer}
details ol{margin:8px 0 0;padding-left:0;list-style:none}
details li{padding:3px 0;color:var(--muted);display:flex;gap:10px}
details li span{font:300 15px/1.6 var(--num);flex:none;width:34px;color:var(--dim)}
details li.cur{color:var(--fg);font-weight:500}
details li.cur span{color:var(--amber)}

/* 문장 목록 */
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.list li{border-bottom:1px solid var(--line)}
.list button{all:unset;box-sizing:border-box;display:block;width:100%;padding:14px 2px;cursor:pointer}
.list button:focus-visible{outline:2px solid var(--amber)}
.en{font-weight:500;display:block;color:var(--fg)}
.ko{font-size:14px;color:var(--muted);display:block}

/* 회화 */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 14px;font-size:14px;min-height:40px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chat{display:grid;gap:12px;min-width:0}
.m{max-width:88%;padding:11px 14px;border-radius:16px;min-width:0;overflow-wrap:anywhere}
.m.them{background:var(--panel);border:1px solid var(--line);justify-self:start;border-bottom-left-radius:6px}
.m.me{background:var(--panel2);color:var(--fg);justify-self:end;border-bottom-right-radius:6px;border:1px solid var(--line)}
.m .ko{margin-top:2px}
.fix{justify-self:stretch;background:var(--amber-soft);border-left:2px solid var(--amber);border-radius:6px;padding:10px 14px;font-size:15px;color:var(--fg)}
.fix b{display:block;font-weight:500}
.play{all:unset;cursor:pointer;font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;margin-top:4px;display:inline-block}

/* 입력 */
textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:80px;resize:vertical;color:var(--fg)}
textarea::placeholder,input::placeholder{color:var(--dim)}
label{display:grid;gap:6px;font-size:14px;color:var(--muted)}
select,input[type=date],input[type=text]{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:46px;color:var(--fg)}
.check{display:flex;gap:10px;align-items:flex-start;color:var(--fg);font-size:15px}
.check input{width:20px;height:20px;margin-top:3px;flex:none;accent-color:var(--amber)}
.small{font-size:14px;color:var(--muted)}
.io{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:14px}
.io textarea{min-height:90px;font-size:12px;line-height:1.4;font-family:ui-monospace,Consolas,monospace}
.filebtn{position:relative;display:inline-flex;align-items:center;color:var(--fg);font-size:15px}
.filebtn input{position:absolute;width:1px;height:1px;opacity:0}

/* 운전 화면: 지금 나오는 문장이 주인공. 남은 시간은 위에 작게 */
#drive{position:fixed;inset:0;background:#0B0C0E;color:var(--fg);z-index:20;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);gap:14px;
 padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.d-head{display:grid;gap:10px}
.d-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
#d-kind{font-size:15px;color:var(--muted)}
#d-time{font:500 34px/1 var(--num);font-variant-numeric:tabular-nums;color:var(--fg)}
#d-mid{display:grid;grid-template-rows:auto minmax(0,1fr);gap:10px;min-height:0;text-align:center}
.d-state{display:grid;gap:10px;justify-items:center}
#d-stage{font-size:17px;font-weight:600;color:var(--muted)}
#d-turn{font-size:18px;font-weight:700;padding:6px 18px;border-radius:999px;border:2px solid var(--line);color:var(--muted);min-height:42px}
#d-turn:empty{visibility:hidden}
#d-turn.mine{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
#d-line{display:flex;flex-direction:column;justify-content:safe center;align-items:center;gap:16px;min-height:0;overflow:hidden}
#d-en,#d-ko{max-width:100%;text-wrap:balance;word-break:keep-all;overflow-wrap:anywhere}
#d-en{font-size:clamp(34px,11vw,60px);font-weight:700;line-height:1.22;letter-spacing:-.015em}
#d-en:empty,#d-ko:empty{display:none}
#d-en mark{background:none;color:var(--amber);text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:7px}
#d-ko{font-size:clamp(18px,5.4vw,26px);line-height:1.45;color:var(--muted)}
#d-ko.cue{font-size:clamp(28px,8.5vw,44px);font-weight:700;color:var(--fg)}
#d-sub{color:var(--dim);font-size:14px;text-align:center}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;width:100%}
#d-bar{height:100%;width:0;background:var(--amber);transition:width 1s linear}
.ctrl{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:10px;margin-top:10px}
.ctrl button{border:1px solid var(--line);border-radius:22px;background:var(--panel);color:var(--fg);font-weight:600;min-height:96px;font-size:19px}
#d-pause{background:var(--amber);border-color:var(--amber);color:var(--amber-ink);font-size:22px;font-weight:700}
#d-end{background:none;border:0;color:var(--dim);min-height:48px;width:100%;font-size:15px}
/* 가로로 거치했을 때 */
@media (orientation:landscape) and (max-height:520px){
 #drive{gap:8px;padding-top:calc(8px + env(safe-area-inset-top,0px))}
 .d-head{gap:6px}#d-time{font-size:26px}#d-sub{display:none}
 .d-state{display:flex;justify-content:center;align-items:center;gap:14px}
 #d-line{gap:8px}
 .d-foot{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:end}
 .ctrl{margin-top:0}.ctrl button{min-height:64px}#d-end{width:auto;min-height:64px;padding:0 8px}}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:15px;z-index:30;max-width:calc(100vw - 32px);box-shadow:0 8px 24px rgba(0,0,0,.4)}
@media (prefers-reduced-motion:no-preference){.go button,.btn,.ctrl button{transition:transform .08s}.go button:active,.btn:active,.ctrl button:active{transform:scale(.97)}}
@media (prefers-reduced-motion:reduce){#d-bar{transition:none}}

/* 발음 체크 */
.pc .big{font-size:23px;line-height:1.35;display:block;color:var(--fg);font-weight:500}
.res{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.score{font:300 44px/1 var(--num);font-variant-numeric:tabular-nums;color:var(--fg)}
.diff{font-size:18px;line-height:1.7}
.diff .ok{color:var(--ok)}
.diff .miss{color:var(--warn);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;font-weight:700}
.top h3.sec{min-width:0}
/* 마이크 버튼: 누르면 앰버 테두리와 점이 켜진다 */
.micbtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:64px;border-radius:16px;border:1px solid var(--amber);background:var(--amber);color:var(--amber-ink);font-weight:700;font-size:18px}
.micbtn .dot{width:12px;height:12px;border-radius:50%;background:var(--amber-ink)}
.micbtn.on{background:var(--panel2);color:var(--amber)}
.micbtn.on .dot{background:var(--amber)}
@media (prefers-reduced-motion:no-preference){.micbtn.on .dot{animation:rec 1.2s ease-in-out infinite}}
@keyframes rec{50%{opacity:.25}}
.live{min-height:1.5em;color:var(--fg);font-size:16px}
.live:empty{display:none}
details.kb summary{font-size:14px}
details.kb label{margin-top:8px}
details.kb .row{margin-top:8px}
.btn.on{border-color:var(--amber);color:var(--amber)}

/* v12 다듬기: 터치 크기 48px, 글자 14px 이상, 모서리와 메뉴 통일 */
body{padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}
.top h1{font-size:19px;font-weight:700;color:var(--fg)}
.sign{border-radius:24px;padding:24px 20px 20px}
.sign h2{font-weight:700;line-height:1.25;word-break:keep-all}
.go button{border-radius:18px;min-height:96px;font-size:18px;font-weight:700}
.go small{font-size:14px;font-weight:500}
.notice{border-radius:20px;padding:18px;line-height:1.65}
.btn{border-radius:14px;min-height:48px}
.chip{min-height:44px;font-size:15px}
.stats{border-radius:20px}
.stats span{font-size:14px}
.sec{font-weight:700}
h3.sec{font-weight:700}
.list button{padding:16px 2px;min-height:60px}
.en{font-size:17px;font-weight:600;line-height:1.45}
.ko{font-size:15px}
.play{display:inline-flex;align-items:center;justify-self:start;min-height:44px;font-size:15px;color:var(--fg)}
summary{min-height:44px;display:list-item;line-height:44px}
nav{background:rgba(18,20,23,.94);padding-top:6px}
nav button{display:grid;justify-items:center;gap:4px;padding:4px 2px 8px;min-height:62px;font-size:13px;font-weight:600}
nav svg{width:56px;height:30px;padding:4px 17px;border-radius:999px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="true"] svg{background:var(--amber-soft);stroke:var(--amber)}
nav button[aria-current="true"]::after{content:none}
#toast{bottom:calc(92px + env(safe-area-inset-bottom,0px));border-radius:14px}
</style>
<div class="wrap">
 <header class="top"><h1>출퇴근 영어</h1><span class="dday" id="dday"></span></header>
 <section id="v-home" class="wrap"></section>
 <section id="v-talk" class="wrap" hidden></section>
 <section id="v-words" class="wrap" hidden></section>
 <section id="v-route" class="wrap" hidden></section>
</div>
<nav aria-label="메뉴">
 <button data-v="home" aria-current="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"/></svg>오늘</button><button data-v="talk"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H10l-5 4v-4H4z"/></svg>집에서 회화</button><button data-v="words"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h9"/></svg>문장</button><button data-v="route"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8.5 18H15a3 3 0 000-6H9a3 3 0 010-6h6.5"/></svg>노선</button>
</nav>
<div id="drive" hidden>
 <div class="d-head"><div class="d-row"><div id="d-kind"></div><div id="d-time" aria-label="남은 시간">30:00</div></div><div class="bar"><div id="d-bar"></div></div></div>
 <div id="d-mid"><div class="d-state"><div id="d-stage"></div><div id="d-turn"></div></div><div id="d-line"><div id="d-en" lang="en"></div><div id="d-ko"></div></div></div>
 <div><div id="d-sub">화면은 신호 대기 때만 보세요</div><div class="d-foot"><div class="ctrl"><button id="d-prev">다시 듣기</button><button id="d-pause">일시정지</button><button id="d-next">다음</button></div><button id="d-end">수업 끝내기</button></div></div>
</div>
<div id="toast" role="status" hidden></div>
<script>/* 수업 콘텐츠: "영어|한국어" 형식. 회화의 A는 상대방, B는 나. */
const PHASES=[
 {name:"입 트기",from:1,to:12,goal:"짧은 문장을 생각 없이 입으로 꺼낸다"},
 {name:"문장 늘리기",from:13,to:24,goal:"과거, 미래, 이유를 붙여 말한다"},
 {name:"스몰토크",from:25,to:38,goal:"처음 만난 외국인과 5분 대화를 잇는다"},
 {name:"비즈니스",from:39,to:50,goal:"회사와 제품을 소개하고 가격과 납기를 묻는다"},
 {name:"실전 리허설",from:51,to:56,goal:"원어민 속도로 듣고 끊기지 않게 답한다"}
];

례합니다. 괜찮으세요?", "B:Yes, I am. Is the station far from here?|네, 괜찮아요. 역이 여기서 멀어요?", "A:No, it's not. It's five minutes away.|아니요, 안 멀어요. 5분 거리예요.", "B:Great. Thank you so much.|잘됐네요. 정말 감사합니다."], "p": "Are you okay? Is it far?|예 아니요로 답하는 질문은 마지막 단어에서 음을 살짝 올립니다. 아유는 한 박자로 짧게, 오케이의 케이에서 음을 올려 보세요.", "sub": ["Are you ready?|준비됐어요", "Are you hungry?|배고파요", "Are you from here?|여기 출신", "Is it expensive?|비싸요", "Is it open now?|지금 열었어요", "Is this your bag?|당신 가방"], "st": ["Mark is at the airport.|마크는 공항에 있어요.", "A woman asks, Are you okay?|한 여성이 괜찮냐고 물어요.", "He says, Yes, I am. Is the gate far?|그는 네, 괜찮아요. 게이트가 멀어요? 라고 해요.", "She says, No, it's not. It's right there.|그녀는 아니요, 바로 저기예요 라고 해요."], "q": ["Where is Mark?|He's at the airport.", "Is Mark okay?|Yes, he is.", "Is the gate far?|No, it's not."], "o": ["Are you busy these days?|Yes, I am. I'm busy at work.", "Are you a morning person?|No, I'm not. But my baby is!"], "my": "Am I busy? Yes, I'm always busy at work.|바쁘냐고요? 네, 회사에서 늘 바빠요."}, {"title": "Do you ~? Does it ~? 일반동사 질문", "tip": "일반 동사 질문은 두 또는 더즈로 시작합니다. 그 사람, 그것처럼 하나를 말할 때는 더즈를 써요.", "s": ["Do you live near here?|이 근처에 사세요?", "Do you take credit cards?|신용카드 받으세요?", "Do you know the Wi-Fi password?|와이파이 비밀번호 아세요?", "Does it come with rice?|밥이 같이 나와요?", "Does this bus go downtown?|이 버스 시내로 가요?", "Does your baby sleep well?|아기가 잘 자요?", "Yes, it does.|네, 그래요.", "No, he doesn't.|아니요, 그는 안 그래요."], "d": ["A:Hi. Do you live near here?|안녕하세요. 이 근처에 사세요?", "B:No, I'm from Korea. Does this bus go downtown?|아니요, 한국에서 왔어요. 이 버스 시내로 가요?", "A:Yes, it does. Do you have a bus card?|네, 가요. 버스 카드 있으세요?", "B:No, I don't. Do they take credit cards?|아니요, 없어요. 신용카드도 받나요?"], "p": "Does he like it?|더즈 히는 히의 흐 소리가 약해져서 더지처럼 들립니다. 더즈 잇도 더짓처럼 붙여서 말해 보세요.", "sub": ["Do you need a bag?|봉투 필요", "Do you have this in blue?|파란색 있어요", "Do you sell water?|물 팔아요", "Does it hurt?|아파요", "Does he work here?|여기서 일함", "Does the room have a crib?|아기 침대"], "st": ["Jun is in a shop in Tokyo.|준은 도쿄의 한 가게에 있어요.", "He asks, Do you take credit cards?|그는 신용카드 받냐고 물어요.", "The clerk says, Yes, we do.|점원이 네, 받아요 라고 해요.", "Then he asks, Does this come in a smaller size?|그리고 더 작은 사이즈도 있냐고 물어요."], "q": ["Where is Jun?|He's in a shop in Tokyo.", "Does the shop take credit cards?|Yes, it does.", "What size does he want?|A smaller size."], "o": ["Do you drive to work?|Yes, I do. I listen to English in the car.", "Does your baby sleep well?|Not really. Our baby wakes up a lot at night."], "my": "Does my family travel? Yes, every summer.|우리 가족이 여행을 하냐고요? 네, 매년 여름에요."}, {"title": "I'm not / I don't 부정 구분", "tip": "비 동사 문장은 아임 낫, 일반 동사 문장은 아이 돈트로 부정합니다. 둘을 짝으로 묶어서 연습해요.", "s": ["I'm not hungry yet.|아직 배 안 고파요.", "I don't eat breakfast.|저는 아침을 안 먹어요.", "It's not far from here.|여기서 멀지 않아요.", "I don't know this area.|이 동네를 잘 몰라요.", "She's not at her desk.|그녀는 자리에 없어요.", "He doesn't work on Fridays.|그는 금요일엔 일 안 해요.", "We're not in a hurry.|저희는 급하지 않아요.", "It doesn't matter.|상관없어요."], "d": ["A:Do you want some lunch?|점심 좀 드실래요?", "B:Thanks, but I'm not hungry yet.|고맙지만 아직 배 안 고파요.", "A:Okay. Is the restaurant far?|알겠어요. 식당이 멀어요?", "B:No, it's not far from here. We're not in a hurry.|아니요, 여기서 멀지 않아요. 저희 급하지 않아요."], "p": "I don't know.|돈트의 끝 트는 거의 소리 내지 않고 멈춥니다. 아이 돈 노우처럼 들리고, 빠르면 아이 도노처럼 들려요.", "sub": ["I'm not ready yet.|아직 준비 안 됨", "I'm not from here.|여기 사람 아님", "I don't have a car here.|여기 차 없음", "I don't drink beer.|맥주 안 마심", "It's not my bag.|내 가방 아님", "He doesn't speak Korean.|한국어 못함"], "st": ["Paul is on a business trip.|폴은 출장 중이에요.", "He's not hungry, so he doesn't eat lunch.|배가 안 고파서 점심을 안 먹어요.", "He doesn't know the city well.|그는 그 도시를 잘 몰라요.", "But his hotel is not far from the office.|하지만 호텔이 사무실에서 멀지 않아요."], "q": ["Is Paul on vacation?|No, he's on a business trip.", "Does he eat lunch?|No, he doesn't.", "Is the hotel far from the office?|No, it's not."], "o": ["Are you hungry?|Not really. I'm not hungry yet.", "Do you drink coffee at night?|No, I don't. I can't sleep after coffee."], "my": "I'm not good at English yet, but I don't give up.|아직 영어를 잘하지는 못하지만 포기하지 않아요."}, {"title": "be와 do 섞어 쓰기", "tip": "이번 주에 익힌 비 동사와 일반 동사를 섞어 말합니다. 질문을 듣고 아임으로 답할지 아이 두로 답할지 바로 고르세요.", "s": ["Are you here with your family?|가족이랑 오셨어요?", "Yes, I am. We're from Korea.|네. 저희는 한국에서 왔어요.", "Do you speak English at work?|직장에서 영어 쓰세요?", "Yes, I do. But not much.|네, 써요. 많이는 아니고요.", "My job is busy, but I like it.|일은 바쁘지만 좋아해요.", "Does your company sell overseas?|회사가 해외에도 파세요?", "We don't make cars. We make fasteners.|저희는 차는 안 만들어요. 화스너를 만들어요.", "I'm not perfect, but I try.|완벽하진 않지만 노력해요."], "d": ["A:Are you here with your family?|가족이랑 오셨어요?", "B:Yes, I am. We're from Korea.|네. 저희는 한국에서 왔어요.", "A:Your English is good. Do you speak English at work?|영어 잘하시네요. 직장에서 영어 쓰세요?", "B:Yes, I do. But not much.|네, 써요. 많이는 아니고요."], "p": "Do you speak English?|중요한 단어에만 힘을 줍니다. 두 유는 작고 빠르게, 스피크와 잉글리시는 크고 길게 말해 리듬을 만드세요.", "sub": ["Are you on a business trip?|출장", "Do you work in sales?|영업", "Is your hotel nice?|호텔 좋아요", "Does your baby walk yet?|아기 걸어요", "I'm not sure about that.|잘 모르겠음", "We don't open on Sundays.|일요일 휴무"], "st": ["Mr. Choi is at a trade show.|최 씨는 무역 박람회에 있어요.", "A buyer asks, Are you from Korea?|한 바이어가 한국에서 왔냐고 물어요.", "He says, Yes, I am. We make screws and rivets.|그는 네, 저희는 나사와 리벳을 만들어요 라고 해요.", "The buyer asks, Do you sell to Europe?|바이어가 유럽에도 파냐고 물어요."], "q": ["Where is Mr. Choi?|He's at a trade show.", "Is he from Korea?|Yes, he is.", "What does his company make?|Screws and rivets."], "o": ["Are you busy at work these days?|Yes, I am. But I like my job.", "Do you practice English every day?|Yes, I do. I practice in my car."], "my": "I drive to work every day, and I practice English in the car.|매일 차로 출근하면서 차 안에서 영어를 연습해요."}]}, "6": {"days": [{"title": "I have ~ / Do you have ~? 가진 것", "tip": "해브는 가지고 있다는 뜻 말고도 약속, 감기, 질문이 있다고 할 때 씁니다. 두 유 해브로 가게와 호텔에서 바로 물어보세요.", "s": ["Do you have a room for tonight?|오늘 밤 방 있어요?", "We have a reservation.|저희 예약했어요.", "I have a meeting at two.|2시에 회의가 있어요.", "Do you have a minute?|잠깐 시간 있으세요?", "I have a bad cold.|감기가 심하게 걸렸어요.", "Do you have any samples?|샘플 있으세요?", "We have three sizes.|저희는 세 가지 사이즈가 있어요.", "Do you have this in black?|이거 검은색 있어요?"], "d": ["A:Good evening. How can I help you?|안녕하세요. 무엇을 도와드릴까요?", "B:Hi. Do you have a room for tonight?|안녕하세요. 오늘 밤 방 있어요?", "A:Yes, we do. For how many people?|네, 있어요. 몇 분이세요?", "B:Three of us. We have a baby.|세 명이에요. 아기가 있어요."], "p": "Do you have a minute?|해브 어는 해버처럼 이어집니다. 앞 단어의 끝 자음이 뒤의 모음과 만나면 한 단어처럼 붙여 말하세요.", "sub": ["I have a headache.|두통", "I have a flight at nine.|9시 비행기", "Do you have a map?|지도", "Do you have a charger?|충전기", "We have a new product.|신제품", "They have free Wi-Fi.|무료 와이파이"], "st": ["Kevin is at a hotel in Singapore.|케빈은 싱가포르의 한 호텔에 있어요.", "He doesn't have a reservation.|그는 예약을 안 했어요.", "He asks, Do you have a room for tonight?|오늘 밤 방이 있냐고 물어요.", "They have one room, and it has a sea view.|방이 하나 있는데, 바다 전망이에요."], "q": ["Where is Kevin?|At a hotel in Singapore.", "Does he have a reservation?|No, he doesn't.", "What does the room have?|It has a sea view."], "o": ["Do you have any plans this weekend?|Yes, I do. I have a family dinner.", "Do you have samples?|Yes, we do. I have some in my bag."], "my": "I have a small family. We have a baby at home.|저희는 가족이 단출해요. 집에 아기가 있어요."}, {"title": "have lunch, have fun 해브 덩어리", "tip": "해브 뒤에 식사나 시간을 붙이면 먹다, 보내다라는 뜻이 됩니다. 해브 어 굿 타임처럼 덩어리로 외워두세요.", "s": ["Let's have lunch together.|같이 점심 먹어요.", "I have breakfast at seven.|저는 7시에 아침을 먹어요.", "We have dinner together every night.|저희는 매일 밤 같이 저녁을 먹어요.", "What do you want to have?|뭐 드실래요?", "I'll have the steak.|저는 스테이크로 할게요.", "Have a good trip!|여행 잘 다녀오세요!", "Have fun this weekend!|이번 주말 재밌게 보내세요!", "We had a great time.|정말 즐거웠어요."], "d": ["A:Are you free now? Let's have lunch together.|지금 시간 돼요? 같이 점심 먹어요.", "B:Sure. What do you want to have?|좋아요. 뭐 드실래요?", "A:Maybe pasta. How about you?|파스타 먹을까 해요. 당신은요?", "B:I'll have the steak.|저는 스테이크로 할게요."], "p": "I'll have the steak.|아일은 아이 윌로 나누지 말고 아일처럼 짧게 줄입니다. 끝의 엘은 혀끝을 윗니 뒤에 대고 살짝 멈추세요.", "sub": ["Let's have coffee.|커피", "I'll have a beer.|맥주", "I'll have the same.|같은 걸로", "Have a good weekend!|좋은 주말", "Have a safe flight!|안전한 비행", "We had a nice dinner.|좋은 저녁"], "st": ["Amy and her family are in Bali.|에이미 가족은 발리에 있어요.", "They have breakfast by the pool.|그들은 수영장 옆에서 아침을 먹어요.", "At night, they have dinner on the beach.|밤에는 해변에서 저녁을 먹어요.", "They have a great time.|그들은 정말 즐거운 시간을 보내요."], "q": ["Where is Amy's family?|In Bali.", "Where do they have breakfast?|By the pool.", "Do they have a good time?|Yes, they do."], "o": ["What do you usually have for breakfast?|I usually have bread and coffee.", "What would you like to have?|I'll have the chicken, please."], "my": "We have dinner together every evening.|저희는 매일 저녁 함께 저녁을 먹어요."}, {"title": "get = 받다, 사다, 가져오다", "tip": "겟은 받다, 사다, 가져오다를 한 단어로 해결합니다. 아이 갓은 받았어요, 캔 아이 겟은 주세요라는 뜻이에요.", "s": ["I got your email.|이메일 받았어요.", "Where can I get a taxi?|택시 어디서 탈 수 있어요?", "Let me get you some water.|물 좀 갖다 드릴게요.", "I'll get the check.|계산은 제가 할게요.", "I got this at the airport.|이거 공항에서 샀어요.", "Can I get a refill?|리필 돼요?", "Did you get the samples?|샘플 받으셨어요?", "Let's get some coffee.|커피 한잔해요."], "d": ["A:Hi, it's Tom. I got your email.|안녕하세요, 톰이에요. 이메일 받았어요.", "B:Great. Did you get the samples, too?|잘됐네요. 샘플도 받으셨어요?", "A:Yes, I did. They look good.|네, 받았어요. 좋아 보여요.", "B:Thanks. Let's get some coffee next week.|고마워요. 다음 주에 커피 한잔해요."], "p": "I got it.|갓 잇은 가릿처럼 들립니다. 모음 사이에 낀 트가 부드러운 르 소리로 바뀌는 미국식 발음이에요.", "sub": ["I got a text.|문자 받음", "I got a new phone.|새 폰 삼", "Can I get a bag?|봉투", "Can I get some napkins?|냅킨", "Let me get my wallet.|지갑 가져오기", "I'll get the door.|문 열어 줌"], "st": ["Sam is at a coffee shop.|샘은 커피숍에 있어요.", "He gets a big coffee and a muffin.|그는 큰 커피와 머핀을 사요.", "Then he gets a call from his boss.|그때 상사에게서 전화가 와요.", "His boss asks, Did you get my email?|상사가 내 이메일 받았냐고 물어요."], "q": ["Where is Sam?|At a coffee shop.", "What does he get?|A big coffee and a muffin.", "Who calls him?|His boss."], "o": ["Did you get my email?|Yes, I did. I'll reply today.", "Where do you get your coffee?|I usually get it near my office."], "my": "On weekends, we get coffee and take a walk.|주말에는 커피를 사서 산책해요."}, {"title": "get = 도착하다, ~해지다", "tip": "겟 뒤에 장소가 오면 도착하다, 상태가 오면 그렇게 되다라는 뜻입니다. 겟 홈, 게팅 콜드처럼 묶어 말하세요.", "s": ["How do I get to the airport?|공항에 어떻게 가요?", "We got here yesterday.|저희는 어제 여기 왔어요.", "What time do you get home?|몇 시에 집에 와요?", "I get off work at six.|저는 6시에 퇴근해요.", "It's getting cold.|날씨가 추워지고 있어요.", "I get tired easily these days.|요즘 쉽게 피곤해요.", "My English is getting better.|영어가 점점 늘고 있어요.", "Don't get lost.|길 잃지 마세요."], "d": ["A:When did you get here?|언제 여기 오셨어요?", "B:We got here yesterday. How do we get to the beach?|어제 왔어요. 해변에 어떻게 가요?", "A:Take the number five bus. Don't get lost!|5번 버스 타세요. 길 잃지 마세요!", "B:Thanks. We'll get there before dark.|고마워요. 어두워지기 전에 도착할게요."], "p": "It's getting cold.|잉으로 끝나는 소리는 혀 뒤를 입천장에 붙이고 코로 냅니다. 게팅구처럼 끝에 그 소리를 덧붙이지 마세요.", "sub": ["How do I get to the station?|역", "How do I get downtown?|시내", "We got here last night.|어젯밤 도착", "It's getting late.|늦어짐", "It's getting dark.|어두워짐", "I get nervous in English.|영어로 긴장"], "st": ["Nina and her son get to London at night.|니나와 아들은 밤에 런던에 도착해요.", "It's getting cold and dark.|날이 춥고 어두워지고 있어요.", "She asks, How do we get to the hotel?|호텔에 어떻게 가냐고 물어요.", "They get a taxi and get there fast.|그들은 택시를 타고 빨리 도착해요."], "q": ["When do they get to London?|At night.", "How's the weather?|It's getting cold.", "How do they get to the hotel?|By taxi."], "o": ["What time do you get off work?|I usually get off at six.", "Is your English getting better?|Yes, it is. Little by little."], "my": "I get home late on weekdays, but my baby's smile makes me happy.|평일엔 늦게 집에 오지만, 아기 웃음이 저를 행복하게 해요."}, {"title": "have와 get 섞어 쓰기", "tip": "해브와 겟을 한 대화에 섞어 씁니다. 가진 것은 해브, 받거나 도착하는 것은 겟이라고 기억하세요.", "s": ["Do you have a car here?|여기 차  Is tax included?|죄송해요, 15달러요, 50달러요? 세금 포함이에요?"], "p": "fifteen, fifty|피프틴은 뒤의 틴에 힘을 주고 길게, 피프티는 앞의 피프에 힘을 줍니다. 에프는 윗니를 아랫입술에 대고 바람을 내세요.", "sub": ["How much is this shirt?|셔츠", "How much is the room?|방", "It's thirteen dollars.|13달러", "It's thirty dollars.|30달러", "It's ten euros each.|하나에 10유로", "How much is shipping?|배송비"], "st": ["Lucy is at a market in Thailand.|루시는 태국의 한 시장에 있어요.", "She asks, How much is this dress?|이 원피스 얼마냐고 물어요.", "The man says, It's five hundred baht.|남자가 500바트라고 해요.", "She says, Can you give me a discount?|그녀는 할인해 주실 수 있냐고 해요."], "q": ["Where is Lucy?|At a market in Thailand.", "How much is the dress?|Five hundred baht.", "What does she ask for?|A discount."], "o": ["How much is a cup of coffee near you?|It's about five thousand won.", "How much is this screw?|It's ten cents per piece."], "my": "In sales, I talk about prices every day.|영업을 하니까 매일 가격 이야기를 해요."}, {"title": "What time? 시간 말하기", "tip": "시간은 숫자 두 개를 이어서 말하면 됩니다. 세븐 서티는 일곱 시 반이고, 정각에는 어클락을 붙여요.", "s": ["What time is check-out?|체크아웃 몇 시예요?", "It's at eleven a.m.|오전 11시예요.", "Breakfast is from seven to ten.|조식은 7시부터 10시까지예요.", "The meeting starts at two thirty.|회의는 2시 반에 시작해요.", "My flight leaves at nine fifteen.|제 비행기는 9시 15분에 떠나요.", "It's almost five o'clock.|거의 5시 다 됐어요.", "See you at seven.|7시에 봐요.", "I'll be there in ten minutes.|10분 안에 갈게요."], "d": ["A:Your room is ready. Breakfast is from seven to ten.|방 준비됐어요. 조식은 7시부터 10시까지예요.", "B:Great. What time is check-out?|좋네요. 체크아웃은 몇 시예요?", "A:It's at eleven a.m.|오전 11시예요.", "B:Okay. My flight leaves at two thirty.|알겠어요. 제 비행기는 2시 반에 떠나요."], "p": "It's five o'clock.|어클락은 오 클락으로 끊지 말고 한 덩어리로 말합니다. 앞의 어는 약하게, 클락에 힘을 주고 끝의 크는 살짝 삼키세요.", "sub": ["What time is breakfast?|조식", "What time do you close?|문 닫는 시간", "It's at noon.|정오", "The bus leaves at six forty.|버스 6시 40분", "See you at eight thirty.|8시 반", "I'll be there in five minutes.|5분 뒤"], "st": ["Dan has a flight at nine a.m.|댄은 오전 9시 비행기가 있어요.", "He gets up at five thirty.|그는 5시 반에 일어나요.", "He leaves the hotel at six.|그는 6시에 호텔을 나서요.", "He gets to the airport at seven.|그는 7시에 공항에 도착해요."], "q": ["What time is Dan's flight?|At nine a.m.", "When does he get up?|At five thirty.", "When does he get to the airport?|At seven."], "o": ["What time do you get up?|I get up at six. My baby wakes me up.", "What time is good for a call?|Two o'clock is good for me."], "my": "I start work at eight and finish at six.|8시에 일을 시작해서 6시에 끝나요."}, {"title": "When? 날짜와 요일", "tip": "날짜는 달 이름 뒤에 퍼스트, 세컨드, 써드를 붙입니다. 그 다음부터는 숫자 끝에 쓰 소리를 붙이면 돼요.", "s": ["What's the date today?|오늘 며칠이에요?", "It's March third.|3월 3일이에요.", "I'm free on Tuesday.|화요일에 시간 돼요.", "We leave on the twentieth.|저희는 20일에 떠나요.", "My birthday is in May.|제 생일은 5월이에요.", "Let's meet next Thursday.|다음 주 목요일에 만나요.", "The office is closed on weekends.|사무실은 주말에 문 닫아요.", "How about Friday the fifth?|5일 금요일 어때요?"], "d": ["A:When are you free this week?|이번 주 언제 시간 되세요?", "B:I'm free on Tuesday. How about you?|화요일에 시간 돼요. 당신은요?", "A:Tuesday is busy. Let's meet next Thursday.|화요일은 바빠요. 다음 주 목요일에 만나요.", "B:Okay. Is that the twelfth?|좋아요. 그날이 12일이죠?"], "p": "third, Thursday|쓰 소리는 혀끝을 윗니와 아랫니 사이에 살짝 물고 바람을 냅니다. 써드를 서드나 떠드로 말하지 않게 주의하세요.", "sub": ["I'm free on Monday.|월요일", "We arrive on the first.|1일 도착", "My birthday is in October.|10월 생일", "Let's meet next Wednesday.|다음 주 수요일", "The store is closed on Sundays.|일요일 휴무", "How about the fifteenth?|15일"], "st": ["Ella's family has a trip in July.|엘라 가족은 7월에 여행이 있어요.", "They leave on July second.|그들은 7월 2일에 떠나요.", "They come back on the ninth.|그들은 9일에 돌아와요.", "Her baby's birthday is on the fifth.|그녀의 아기 생일은 5일이에요."], "q": ["When is the family trip?|In July.", "When do they come back?|On the ninth.", "When is the baby's birthday?|On the fifth."], "o": ["When are you free this week?|I'm free on Thursday afternoon.", "When is your vacation?|It's in August. We're going to the beach."], "my": "Monday is my busiest day of the week.|월요일이 일주일 중 가장 바쁜 날이에요."}, {"title": "How many? 수량과 납기", "tip": "비즈니스 숫자는 단위가 중요합니다. 사우전드는 천, 텐 사우전드는 만, 헌드레드 사우전드는 십만이에요.", "s": ["How many pieces do you need?|몇 개 필요하세요?", "We need ten thousand pieces.|만 개가 필요해요.", "There are five hundred in a box.|한 박스에 500개 들어 있어요.", "The minimum order is one box.|최소 주문은 한 박스예요.", "When do you need them?|언제 필요하세요?", "We can ship by June tenth.|6월 10일까지 보낼 수 있어요.", "Delivery takes about two weeks.|배송은 2주 정도 걸려요.", "Does that work for you?|그거 괜찮으세요?"], "d": ["A:We need these rivets. Ten thousand pieces.|이 리벳이 필요해요. 만 개요.", "B:Okay. When do you need them?|알겠습니다. 언제 필요하세요?", "A:By the end of May.|5월 말까지요.", "B:No problem. We can ship by May twentieth.|문제없어요. 5월 20일까지 보낼 수 있어요."], "p": "ten thousand pieces|천이나 백 앞에 숫자가 오면 끝에 즈를 붙이지 않습니다. 텐 사우전즈가 아니라 텐 사우전드, 끝의 드는 아주 약하게 말해요.", "sub": ["We need five thousand pieces.|5천 개", "There are a hundred in a pack.|한 팩 100개", "The minimum order is ten boxes.|최소 10박스", "We can ship next Monday.|다음 주 월요일", "Delivery takes three days.|3일", "Can you ship by the fifteenth?|15일까지"], "st": ["Ms. Garcia runs a building company.|가르시아 씨는 건설 회사를 운영해요.", "She needs twenty thousand screws.|그녀는 나사 2만 개가 필요해요.", "She needs them by April first.|4월 1일까지 필요해요.", "The supplier says, We can ship by March twentieth.|공급업체는 3월 20일까지 보낼 수 있다고 해요."], "q": ["How many screws does she need?|Twenty thousand.", "When does she need them?|By April first.", "When can the supplier ship?|By March twentieth."], "o": ["How many pieces are in a box?|There are five hundred in a box.", "How long does delivery take?|Usually about one week."], "my": "Customers always ask me, How many and by when?|고객들은 항상 몇 개를, 언제까지 되냐고 물어요."}, {"title": "전화번호와 숫자 종합", "tip": "전화번호는 숫자를 하나씩 읽고, 영은 주로 오라고 읽습니다. 세 자리, 네 자리로 끊어서 리듬 있게 말해보세요.", "s": ["What's your phone number?|전화번호가 뭐예요?", "It's five five five, oh one two three.|555에 0123이에요.", "Let me read it back to you.|다시 읽어 드릴게요.", "Is that six or seven?|6이에요, 7이에요?", "Call me after three.|3시 이후에 전화 주세요.", "The total is two hundred dollars.|합계는 200달러예요.", "We have a meeting on the eighth.|8일에 회의가 있어요.", "Room four twelve, please.|412호요."], "d": ["A:What's your phone number?|전화번호가 뭐예요?", "B:It's five five five, oh one two three.|555에 0123이에요.", "A:Let me read it back. Five five five, oh one two three.|다시 읽어 볼게요. 555에 0123.", "B:That's right. Call me after three.|맞아요. 3시 이후에 전화 주세요."], "p": "oh one two three|전화번호 속 영은 오우라고 읽습니다. 숫자를 묶음별로 끊고, 마지막 숫자에서 음을 내려 끝났다는 신호를 주세요.", "sub": ["Is that five or nine?|5 아니면 9", "Call me after lunch.|점심 후", "The total is ninety dollars.|합계 90달러", "Room seven oh five, please.|705호", "We have a call on the twelfth.|12일 통화", "My room is on the tenth floor.|10층"], "st": ["Mr. Kang meets a buyer in Dubai.|강 씨는 두바이에서 바이어를 만나요.", "The buyer asks, What's your phone number?|바이어가 전화번호를 물어요.", "Mr. Kang says it slowly, number by number.|강 씨는 숫자 하나하나 천천히 말해요.", "The buyer reads it back and says, Got it.|바이어가 다시 읽고 알겠어요 라고 해요."], "q": ["Where is Mr. Kang?|In Dubai.", "What does the buyer ask?|His phone number.", "How does Mr. Kang say it?|Slowly, number by number."], "o": ["What's your room number?|It's room eight oh two.", "When can I call you?|Call me after three. I have a meeting until then."], "my": "My number is on my business card, so call me anytime.|제 번호는 명함에 있으니 언제든 전화 주세요."}]}, "8": {"days": [{"title": "It's next to ~ 위치 말하기", "tip": "위치는 넥스트 투, 어크로스 프롬, 온 더 써드 플로어처럼 덩어리로 외웁니다. 호텔에서 바로 쓰는 표현들이에요.", "s": ["Where's the elevator?|엘리베이터 어디예요?", "It's next to the front desk.|프런트 옆에 있어요.", "The gym is on the third floor.|헬스장은 3층에 있어요.", "The restaurant is across from the lobby.|식당은 로비 맞은편에 있어요.", "The pool is behind the hotel.|수영장은 호텔 뒤에 있어요.", "It's at the end of the hall.|복도 끝에 있어요.", "Is there an ATM near here?|이 근처에 현금인출기 있어요?", "There's a store on the corner.|모퉁이에 가게가 있어요."], "d": ["A:Good morning. How can I help?|좋은 아침이에요. 뭘 도와드릴까요?", "B:Hi. Where's the restaurant?|안녕하세요. 식당이 어디예요?", "A:It's across from the lobby.|로비 맞은편에 있어요.", "B:Thanks. Is there an ATM near here?|고마워요. 이 근처에 현금인출기 있어요?"], "p": "next to the desk|넥스트 투처럼 자음이 여러 개 겹치면 가운데 트는 거의 빠집니다. 넥스 투처럼 부드럽게 이어 말하세요.", "sub": ["It's next to the elevator.|엘리베이터 옆", "It's across from the bank.|은행 맞은편", "The bar is on the top floor.|맨 위층", "The restroom is down the hall.|복도 쪽", "Is there a pharmacy near here?|약국", "There's a cafe on the corner.|모퉁이 카페"], "st": ["The Lee family is at a hotel in Hawaii.|이 씨 가족은 하와이의 한 호텔에 있어요.", "The pool is behind the hotel.|수영장은 호텔 뒤에 있어요.", "The restaurant is on the second floor.|식당은 2층에 있어요.", "There's a small market across the street.|길 건너편에 작은 마트가 있어요."], "q": ["Where is the pool?|Behind the hotel.", "Where is the restaurant?|On the second floor.", "What's across the street?|A small market."], "o": ["Where's your office?|It's next to a big factory, near the highway.", "Is there a good restaurant near your home?|Yes, there's a great noodle place on the corner."], "my": "Our apartment is next to a big park.|저희 아파트는 큰 공원 옆에 있어요."}, {"title": "How do I get to ~? 길 묻기", "tip": "길을 물을 때는 익스큐즈 미로 시작하고 하우 두 아이 겟 투를 붙입니다. 걸어갈 수 있는지도 꼭 물어보세요.", "s": ["Excuse me, I'm a little lost.|실례합니다, 길을 좀 잃었어요.", "How do I get to the museum?|박물관에 어떻게 가요?", "Is it within walking distance?|걸어갈 수 있는 거리예요?", "How far is it from here?|여기서 얼마나 멀어요?", "It's about ten minutes on foot.|걸어서 10분 정도예요.", "Should I take a taxi?|택시 타야 할까요?", "Which way is the beach?|해변이 어느 쪽이에요?", "Can you show me on the map?|지도에서 보여 주실 수 있어요?"], "d": ["A:You look lost. Can I help?|길 잃으신 것 같네요. 도와드릴까요?", "B:Yes, please. How do I get to the museum?|네, 부탁해요. 박물관에 어떻게 가요?", "A:It's about ten minutes on foot.|걸어서 10분 정도예요.", "B:Great. Can you show me on the map?|좋네요. 지도에서 보여 주실 수 있어요?"], "p": "Which way? Where is it?|위치와 웨어의 워는 입술을 동그랗게 내밀었다가 빠르게 풀며 냅니다. 이치나 에어처럼 들리지 않게 우 입모양으로 시작하세요.", "sub": ["How do I get to the park?|공원", "How do I get to the mall?|쇼핑몰", "How far is the station?|역까지 거리", "Is it far from the hotel?|호텔에서 먼지", "Which way is the exit?|출구", "Should I take the subway?|지하철"], "st": ["Mia is in New York with her husband.|미아는 남편과 뉴욕에 있어요.", "They want to go to Central Park.|그들은 센트럴 파크에 가고 싶어 해요.", "Mia asks a man, How do we get there?|미아가 한 남자에게 거기 어떻게 가냐고 물어요.", "He says, It's about fifteen minutes on foot.|그는 걸어서 15분 정도라고 해요."], "q": ["Where is Mia?|In New York.", "Where do they want to go?|To Central Park.", "How far is it?|About fifteen minutes on foot."], "o": ["How far is your office from home?|It's about thirty minutes by car.", "Is your hotel far from here?|No, it's close. It's five minutes on foot."], "my": "My office is about thirty minutes from home by car.|사무실은 집에서 차로 30분쯤 걸려요."}, {"title": "Go straight, turn left 길 안내", "tip": "길 안내는 동사로 바로 시작합니다. 고 스트레이트, 턴 레프트, 턴 라이트 세 개만 확실히 들리면 돼요.", "s": ["Go straight for two blocks.|두 블록 직진하세요.", "Turn left at the light.|신호등에서 좌회전하세요.", "Turn right at the corner.|모퉁이에서 우회전하세요.", "It's on your left.|왼쪽에 있어요.", "Cross the street.|길을 건너세요.", "Go past the bank.|은행을 지나가세요.", "You can't miss it.|바로 보일 거예요.", "So, left at the light, right?|그러니까 신호등에서 왼쪽이죠?"], "d": ["A:Go straight for two blocks.|두 블록 직진하세요.", "B:Okay. And then?|네. 그다음엔요?", "A:Turn left at the light. It's on your left.|신호등에서 좌회전하세요. 왼쪽에 있어요.", "B:So, left at the light, right? Thank you!|그러니까 신호등에서 왼쪽이죠? 고마워요!"], "p": "right, light|라이트의 르는 혀끝을 어디에도 닿지 않게 살짝 말아서 시작하고, 신호등 라이트의 르는 혀끝을 윗니 뒤에 붙였다 뗍니다. 둘을 바꾸면 오른쪽과 신호등이 헷갈려요.", "sub": ["Go straight for one block.|한 블록", "Turn right at the light.|신호등 우회전", "Turn left at the bank.|은행에서 좌회전", "It's on your right.|오른쪽", "Go past the church.|교회 지나기", "It's at the end of the street.|길 끝"], "st": ["Tom asks for directions to a cafe.|톰은 카페 가는 길을 물어요.", "A woman says, Go straight for two blocks.|한 여성이 두 블록 직진하라고 해요.", "Then turn right at the bank.|그다음 은행에서 우회전하래요.", "The cafe is on his left.|카페는 그의 왼쪽에 있어요."], "q": ["Where does Tom want to go?|To a cafe.", "Where does he turn right?|At the bank.", "Is the cafe on his right?|No, it's on his left."], "o": ["How do I get to your office from the station?|Go straight and turn left at the light.", "Is the restroom near here?|Yes. Go straight. It's on your right."], "my": "I just go straight on one big road, so it's easy.|큰길 하나로 쭉 가기만 하면 돼서 쉬워요."}, {"title": "At the airport 공항에서", "tip": "공항에서는 게이트, 배기지 클레임, 체크인 카운터 같은 장소 이름이 중요합니다. 웨어즈 더와 묶어서 말해보세요.", "s": ["Where's the check-in counter?|체크인 카운터가 어디예요?", "Which gate is it?|몇 번 게이트예요?", "It's gate twenty-three.|23번 게이트예요.", "Where's baggage claim?|수하물 찾는 곳이 어디예요?", "Where's the taxi stand?|택시 승강장이 어디예요?", "Is there a family restroom?|가족 화장실 있어요?", "How do I get to Terminal 2?|2터미널에 어떻게 가요?", "Take the shuttle train downstairs.|아래층에서 셔틀 트레인을 타세요."], "d": ["A:Can I see your boarding pass?|탑승권 보여 주시겠어요?", "B:Sure. Which gate is it?|네. 몇 번 게이트예요?", "A:It's gate twenty-three. Take the shuttle train downstairs.|23번 게이트예요. 아래층에서 셔틀 트레인을 타세요.", "B:Thanks. Is there a family restroom?|고마워요. 가족 화장실 있어요?"], "p": "baggage claim|클레임의 클은 크 다음에 으 소리를 넣지 말고 한 박자로 붙여 말합니다. 크을레임처럼 두 박자가 되지 않게 하세요.", "sub": ["Where's the restroom?|화장실", "Where's the exit?|출구", "Which terminal is it?|터미널", "It's gate eight.|8번 게이트", "Where's the currency exchange?|환전소", "Where can I get a cart?|카트"], "st": ["The Kim family lands in Rome.|김 씨 가족은 로마에 도착해요.", "First, they go to baggage claim.|먼저 수하물 찾는 곳으로 가요.", "They get their bags and the stroller.|짐과 유모차를 찾아요.", "Then they ask, Where's the taxi stand?|그리고 택시 승강장이 어디냐고 물어요."], "q": ["Where does the Kim family land?|In Rome.", "Where do they go first?|To baggage claim.", "What do they ask?|Where's the taxi stand?"], "o": ["Where are you flying to?|We're flying to Guam for a family trip.", "Do you like airports?|Yes, I do. But with a baby, it's hard."], "my": "The airport is close, so it's easy for us to travel.|공항이 가까워서 여행 다니기 편해요."}, {"title": "호텔과 도시 종합", "tip": "이번 주에 익힌 위치와 길 표현을 이어 씁니다. 묻고, 듣고, 다시 확인하는 순서로 연습하세요.", "s": ["Excuse me, where's the subway station?|실례합니다, 지하철역이 어디예요?", "Go straight and turn right.|직진하다가 우회전하세요.", "It's across from the big mall.|큰 쇼핑몰 맞은편에 있어요.", "How long does it take on foot?|걸어서 얼마나 걸려요?", "About five minutes. It's very close.|5분 정도요. 아주 가까워요.", "Is our room on this floor?|저희 방이 이 층에 있어요?", "Your room is at the end of the hall.|방은 복도 끝에 있어요.", "Let me check the map.|지도 좀 볼게요."], "d": ["A:Hi there. Do you need help?|안녕하세요. 도움 필요하세요?", "B:Yes. Excuse me, where's the subway station?|네. 실례지만 지하철역이 어디예요?", "A:Go straight and turn right. It's across from the big mall.|직진하다가 우회전하세요. 큰 쇼핑몰 맞은편이에요.", "B:Thanks. How long does it take on foot?|고마워요. 걸어서 얼마나 걸려요?"], "p": "How long does it take?|중요한 하우, 롱, 테이크에 힘을 주고 더즈 잇은 작고 빠르게 넘깁니다. 강약이 살아야 원어민처럼 들려요.", "sub": ["Where's the bus stop?|버스 정류장", "It's across from the hotel.|호텔 맞은편", "How long does it take by bus?|버스로", "It's very close.|가까움", "Our room is on the fifth floor.|5층", "Let me check my phone.|폰 확인"], "st": ["Ryan is in Osaka on business.|라이언은 출장으로 오사카에 있어요.", "His hotel is next to the station.|그의 호텔은 역 옆에 있어요.", "The client's office is two stops away.|고객사 사무실은 두 정거장 거리예요.", "He goes there by subway in ten minutes.|그는 지하철로 10분 만에 거기 가요."], "q": ["Why is Ryan in Osaka?|He's there on business.", "Where is his hotel?|Next to the station.", "How does he get to the office?|By subway."], "o": ["What place in Korea do you recommend?|Jeju Island. The beaches are beautiful.", "How do I get to your factory?|Take a taxi from the station. It's about twenty minutes."], "my": "Come visit Korea, and I'll show you around.|한국에 놀러 오세요. 제가 구경시켜 드릴게요."}]}, "9": {"days": [{"title": "I love ~ / I enjoy ~ 정말 좋아하는 것", "tip": "좋아하는 정도에 따라 아이 라이크, 아이 리얼리 라이크, 아이 러브로 올라갑니다. 인조이 뒤에는 잉으로 끝나는 동사가 와요.", "s": ["I love this song.|이 노래 정말 좋아요.", "I really love the beach.|저는 바다를 정말 좋아해요.", "I enjoy cooking on weekends.|저는 주말에 요리하는 걸 즐겨요.", "We love trying local food.|저희는 현지 음식 먹어보는 걸 좋아해요.", "My baby loves bath time.|우리 아기는 목욕 시간을 정말 좋아해요.", "I'm really into golf these days.|요즘 골프에 푹 빠졌어요.", "I love it here.|여기 정말 좋아요.", "What do you like to do for fun?|재미로 뭐 하는 거 좋아하세요?"], "d": [" Can you help me with my bag?|Sure, I can. Wow, it's heavy!"], "my": "When I don't understand, I ask, 'Can you say that again?'|못 알아들으면 '다시 말해 줄 수 있어요?'라고 물어요."}, {"title": "Could you ~? 더 정중하게", "tip": "쿠드 유는 캔 유보다 정중한 부탁입니다. 호텔과 비즈니스 자리에서 특히 많이 써요.", "s": ["Could you check this for me?|이것 좀 확인해 주시겠어요?", "Could you recommend a restaurant?|식당 하나 추천해 주시겠어요?", "Could you send me a quote?|견적서를 보내 주시겠어요?", "Could you give us a discount?|할인해 주실 수 있을까요?", "Could you call me back later?|나중에 다시 전화 주시겠어요?", "Could I see the room first?|방을 먼저 볼 수 있을까요?", "I couldn't sleep last night.|어젯밤에 잠을 못 잤어요.", "I couldn't find the hotel.|호텔을 못 찾았어요."], "d": ["A:Hello. How can I help you?|안녕하세요. 무엇을 도와드릴까요?", "B:Could you recommend a restaurant?|식당 하나 추천해 주시겠어요?", "A:Sure. Try the Italian place next door.|그럼요. 옆에 있는 이탈리아 식당에 가 보세요.", "B:Great. Could you write the name down?|좋네요. 이름을 적어 주시겠어요?"], "p": "Could you send me a quote?|쿠드 유는 이어서 쿠쥬처럼 말합니다. 드와 유가 만나면 쥬 소리가 돼요.", "sub": ["Could you check this?|확인", "Could you wait outside?|밖에서 기다려", "Could you open the window?|창문", "Could you bring some water?|물", "Could you send it by Friday?|금요일까지", "I couldn't find the gate.|게이트 못 찾음"], "st": ["Mike got to his hotel late.|마이크는 호텔에 늦게 도착했어요.", "He couldn't find a restaurant.|그는 식당을 못 찾았어요.", "He asked, 'Could you recommend a place?'|그는 '한 곳 추천해 주시겠어요?'라고 물었어요.", "The staff told him about a great pizza place.|직원이 근사한 피자집을 알려 줬어요."], "q": ["Did Mike get to the hotel early?|No, he got there late.", "What couldn't he find?|A restaurant.", "What place did the staff tell him about?|A pizza place."], "o": ["Could you send me a quote by Friday?|Sure. I can send it on Thursday.", "Could you recommend a Korean dish?|Sure. Try bibimbap. It's not spicy."], "my": "At work, I say, 'Could you send me a quote?'|회사에서는 '견적서를 보내 주시겠어요?'라고 말해요."}, {"title": "can, can't, could 섞어 말하기", "tip": "이번 주 표현을 섞어서 약속 잡기와 부탁을 연습합니다. 짧은 대답 예스 아이 캔도 크게 따라 하세요.", "s": ["Can you hear me?|제 말 들려요?", "Sorry, I can't hear you.|미안해요, 잘 안 들려요.", "Can I bring my baby?|아기를 데려가도 될까요?", "Yes, you can.|네, 돼요.", "I can't make it tomorrow.|내일은 못 가요.", "Could we meet on Monday?|월요일에 만날 수 있을까요?", "I can do that.|그건 할 수 있어요.", "We can't lower the price.|가격은 못 낮춰요."], "d": ["A:Can we meet tomorrow?|내일 만날 수 있어요?", "B:Sorry, I can't make it tomorrow.|미안해요, 내일은 못 가요.", "A:No problem. How about Monday?|괜찮아요. 월요일은 어때요?", "B:Monday is good. I can do that.|월요일 좋아요. 그건 돼요."], "p": "Yes, you can.|짧은 대답 예스 유 캔에서는 캔을 약하게 줄이지 않고 캐앤처럼 또렷하게 말합니다. 문장 끝에 오는 캔은 세게 읽어요.", "sub": ["Can I bring my dog?|강아지", "Can you hear me now?|이제 들려요", "I can't make it today.|오늘 못 가요", "Could we meet at three?|세 시", "I can do that by Friday.|금요일까지", "We can't ship it today.|오늘 발송 못 해요"], "st": ["Lisa has a video call with a buyer.|리사는 바이어와 화상 통화를 해요.", "At first, she can't hear him.|처음에 그녀는 그의 말이 안 들려요.", "She asks, 'Can you hear me now?'|그녀는 '이제 들려요?'라고 물어요.", "Then they can talk about the price.|그러고 나서 그들은 가격 이야기를 할 수 있어요."], "q": ["Who does Lisa call?|A buyer.", "Can she hear him at first?|No, she can't.", "What do they talk about?|The price."], "o": ["Can you come to our office on Monday?|Yes, I can. What time is good?", "Can you lower the price?|Sorry, we can't. But we can ship it fast."], "my": "I can't speak perfectly, but I can talk to people.|완벽하게는 못 하지만, 사람들과 이야기할 수 있어요."}]}, "11": {"days": [{"title": "You should ~ 하는 게 좋아요", "tip": "유 슈드는 부드러운 조언입니다. 외국인에게 한국을 추천할 때 아주 많이 써요.", "s": ["You should try this.|이거 드셔 보세요.", "You should rest.|좀 쉬는 게 좋겠어요.", "You should visit Korea.|한국에 꼭 와 보세요.", "You should bring a jacket.|재킷을 챙기는 게 좋아요.", "You should take a taxi.|택시를 타는 게 좋아요.", "You should try the bibimbap.|비빔밥 꼭 드셔 보세요.", "We should leave now.|우리 지금 출발해야겠어요.", "I should call home.|집에 전화해야겠어요."], "d": ["A:I want to visit Korea.|한국에 가 보고 싶어요.", "B:You should visit in the fall.|가을에 오시는 게 좋아요.", "A:Really? Why?|정말요? 왜요?", "B:The weather is great. You should try the food, too.|날씨가 정말 좋아요. 음식도 꼭 드셔 보세요."], "p": "You should try this.|슈드는 슏처럼 약하고 짧게 말하고, 끝의 드는 거의 들리지 않게 다음 단어로 넘어갑니다.", "sub": ["You should rest.|쉬어요", "You should drink water.|물 마셔요", "You should see a doctor.|병원", "You should try the soup.|수프", "You should come early.|일찍 와요", "We should go now.|지금 가요"], "st": ["Ben is visiting Korea next month.|벤은 다음 달에 한국에 와요.", "His friend says he should try Korean barbecue.|친구는 한국식 고기구이를 꼭 먹어 보라고 해요.", "He should also visit the mountains.|산에도 가 보는 게 좋대요.", "Ben is very excited.|벤은 아주 신이 났어요."], "q": ["When is Ben visiting Korea?|Next month.", "What should he try?|Korean barbecue.", "Where else should he go?|To the mountains."], "o": ["What should I eat in Korea?|You should try Korean barbecue. It's great.", "When should I visit Korea?|You should come in the fall. It's not too hot."], "my": "Learning English is hard, so I should practice every day.|영어 배우기는 어려워서 매일 연습하는 게 좋아요."}, {"title": "I have to ~ 해야 해요", "tip": "아이 해브 투는 꼭 해야 하는 일입니다. 해브 투를 해프터처럼 빠르게 붙여 말해보세요.", "s": ["I have to go now.|저 이제 가야 해요.", "I have to work tomorrow.|내일 일해야 해요.", "I have to pick up my baby.|아기를 데리러 가야 해요.", "I have to check my email.|이메일을 확인해야 해요.", "I have to get up early.|일찍 일어나야 해요.", "We have to finish this today.|오늘 이걸 끝내야 해요.", "I have to ask my boss.|상사에게 물어봐야 해요.", "Sorry, I have to take this call.|미안해요, 이 전화 받아야 해요."], "d": ["A:Do you want another coffee?|커피 한 잔 더 할래요?", "B:Sorry, I have to go now.|미안해요, 이제 가야 해요.", "A:Oh, okay. Busy day?|아, 그래요. 바쁜 날이에요?", "B:Yes. I have to pick up my baby.|네. 아기를 데리러 가야 해요."], "p": "I have to go now.|해브 투는 해프터처럼 이어 말합니다. 브가 프로 바뀌고 투는 약하게 터로 줄어요.", "sub": ["I have to go.|가야 해요", "I have to call home.|집에 전화", "I have to pay now.|지금 계산", "I have to wait here.|여기서 기다려", "We have to hurry.|서둘러야", "I have to buy diapers.|기저귀"], "st": ["Kevin is a busy father.|케빈은 바쁜 아빠예요.", "He has to get up at six.|그는 여섯 시에 일어나야 해요.", "He has to take his daughter to daycare.|그는 딸을 어린이집에 데려다줘야 해요.", "Then he has to drive to work.|그다음 차로 출근해야 해요."], "q": ["What time does Kevin get up?|At six.", "Where does he take his daughter?|To daycare.", "How does he go to work?|He drives."], "o": ["What do you have to do tomorrow?|I have to work. I have a meeting at ten.", "Do you have to get up early?|Yes, I have to get up at six."], "my": "But I have to work all day, and I'm always busy.|하지만 하루 종일 일해야 해서 늘 바빠요."}, {"title": "Do I have to ~? 해야 하나요?", "tip": "두 아이 해브 투는 해야 하는지 묻는 말입니다. 호텔, 박물관, 식당에서 규칙을 물을 때 써요.", "s": ["Do I have to pay now?|지금 계산해야 하나요?", "Do I have to book a table?|자리를 예약해야 하나요?", "Do we have to wear a helmet?|헬멧을 써야 하나요?", "What time do I have to check out?|몇 시에 체크아웃해야 하나요?", "Do I have to show my passport?|여권을 보여 줘야 하나요?", "Where do I have to go?|어디로 가야 하나요?", "The baby has to sleep at eight.|아기는 여덟 시에 자야 해요.", "He has to sign here.|그분이 여기 서명해야 해요."], "d": ["A:Welcome. Here's your key.|환영합니다. 열쇠 여기 있어요.", "B:Thanks. What time do I have to check out?|고마워요. 몇 시에 체크아웃해야 하나요?", "A:At eleven.|열한 시요.", "B:Okay. Do I have to pay now?|알겠어요. 지금 계산해야 하나요?"], "p": "He has to sign here.|해즈 투는 해스터처럼 말합니다. 즈 소리가 스로 바뀌고 투는 약하게 터로 줄어요.", "sub": ["Do I have to wait?|기다려야 하나요", "Do I have to sign here?|여기 서명", "Do we have to take off our shoes?|신발 벗어요", "Where do I have to change trains?|어디서 갈아타요", "She has to work late.|늦게까지 일", "He has to leave at five.|다섯 시 출발"], "st": ["Amy is at a museum in London.|에이미는 런던의 박물관에 있어요.", "She asks, 'Do I have to pay?'|그녀는 '돈을 내야 하나요?'라고 물어요.", "The museum is free.|그 박물관은 무료예요.", "But she has to leave her big bag.|하지만 큰 가방은 맡겨야 해요."], "q": ["Where is Amy?|At a museum in London.", "Does she have to pay?|No, it's free.", "What does she have to leave?|Her big bag."], "o": ["Do I have to bring anything?|No, you don't. Just come.", "What time do I have to be there?|Please come at nine."], "my": "At night, I often think, 'Do I have to study tonight, too?'|밤이면 '오늘 밤에도 공부해야 하나?' 하고 자주 생각해요."}, {"title": "don't have to, shouldn't", "tip": "돈트 해브 투는 안 해도 된다, 슈든트는 하지 않는 게 좋다는 뜻입니다. 두 표현의 차이를 느끼며 말해보세요.", "s": ["You don't have to pay.|돈 안 내셔도 돼요.", "You don't have to come early.|일찍 안 오셔도 돼요.", "You don't have to worry.|걱정 안 하셔도 돼요.", "I don't have to work on Saturday.|토요일에는 일 안 해도 돼요.", "You shouldn't drink and drive.|음주 운전하면 안 돼요.", "You shouldn't eat too late.|너무 늦게 먹지 않는 게 좋아요.", "We shouldn't be late.|우리 늦으면 안 돼요.", "Don't worry. It's on me.|걱정 마세요. 제가 낼게요."], "d": ["A:How much do I owe you?|제가 얼마 드리면 돼요?", "B:You don't have to pay. It's on me.|안 내셔도 돼요. 제가 낼게요.", "A:Really? Thank you so much.|정말요? 정말 고마워요.", "B:You don't have to worry. You're my guest.|걱정 안 하셔도 돼요. 제 손님이시잖아요."], "p": "You don't have to worry.|돈트 해프터에서 돈트의 트는 거의 사라져 돈 해프터처럼 들립니다. 부정어 돈을 가장 세게 말하세요.", "sub": ["You don't have to wait.|안 기다려도", "You don't have to come.|안 와도", "I don't have to cook tonight.|요리 안 해도", "You shouldn't park here.|여기 주차", "You shouldn't touch that.|만지면 안 돼", "We shouldn't drive too fast.|너무 빨리"], "st": ["Paul visits a factory in Korea.|폴은 한국의 공장을 방문해요.", "He shouldn't touch the machines.|그는 기계를 만지면 안 돼요.", "In the office, he doesn't have to wear a helmet.|사무실에서는 헬멧을 안 써도 돼요.", "After the tour, he has lunch with the team.|견학 후 그는 팀과 점심을 먹어요."], "q": ["What does Paul visit?|A factory in Korea.", "Can he touch the machines?|No, he shouldn't.", "What does he do after the tour?|He has lunch with the team."], "o": ["Do I have to bring a gift?|No, you don't have to. Just come and relax.", "Should I take a taxi to your office?|You don't have to. I can pick you up."], "my": "But a friend told me, 'You don't have to be perfect.'|그런데 한 친구가 '완벽하지 않아도 돼'라고 말해 줬어요."}, {"title": "should, have to 섞어 말하기", "tip": "이번 주 표현을 섞어 초대와 약속 상황을 연습합니다. 슈드 해브는 후회할 때 쓰는 말이에요.", "s": ["Should I wait here?|여기서 기다려야 할까요?", "You have to wait in line.|줄을 서서 기다려야 해요.", "What should we do tonight?|오늘 밤 뭐 할까요?", "We should go to bed early.|일찍 자는 게 좋겠어요.", "I should've called you.|전화했어야 했는데.", "I have to leave at seven.|일곱 시에 나가야 해요.", "You don't have to rush.|서두르지 않아도 돼요.", "Should I bring anything?|뭐 가져가야 할까요?"], "d": ["A:Come to dinner on Friday!|금요일에 저녁 먹으러 오세요!", "B:Thank you. Should I bring anything?|고마워요. 뭐 가져가야 할까요?", "A:No, you don't have to.|아니요, 안 그러셔도 돼요.", "B:Okay. What time should I come?|알겠어요. 몇 시에 갈까요?"], "p": "I should've called you.|슈드 해브는 슈러브처럼 줄여 말합니다. 했어야 했는데 하는 후회의 뜻이에요.", "sub": ["Should I call a taxi?|택시 부를까요", "Should I wait outside?|밖에서 기다릴까요", "I should've asked first.|먼저 물어봤어야", "I should've left early.|일찍 나왔어야", "You have to wait here.|여기서 기다려", "You don't have to rush.|서두르지 마"], "st": ["Tom has a flight at nine.|톰은 아홉 시 비행기를 타요.", "He has to be at the airport at seven.|그는 일곱 시까지 공항에 가야 해요.", "But he leaves home late.|하지만 그는 늦게 집을 나서요.", "He thinks, 'I should've left early.'|그는 '일찍 나왔어야 했는데'라고 생각해요."], "q": ["What time is Tom's flight?|At nine.", "When does he have to be at the airport?|At seven.", "What does he think?|He should've left early."], "o": ["Should I bring anything to your house?|You don't have to. Just bring your family.", "What should I see in Korea?|You should see the old palaces. They're beautiful."], "my": "So I should just keep going, one sentence a day.|그러니 하루 한 문장씩 그냥 계속하면 돼요."}]}, "12": {"days": [{"title": "공항에서", "tip": "지금까지 배운 표현을 공항에서 써 봅니다. 입국 심사 질문에는 짧고 또렷하게 답하면 충분해요.", "s": ["I'm here on vacation.|휴가로 왔어요.", "I'm traveling with my family.|가족과 여행 중이에요.", "I'm staying for five days.|5일 동안 머물러요.", "Where's gate twelve?|12번 게이트는 어디예요?", "Can I take this on the plane?|이거 기내에 가지고 타도 돼요?", "I'd like a window seat, please.|창가 자리로 주세요.", "Where can I get a taxi?|택시는 어디서 타요?", "Is this the line for check-in?|여기가 체크인 줄인가요?"], "d": ["A:What's the purpose of your visit?|방문 목적이 뭔가요?", "B:I'm here on vacation.|휴가로 왔어요.", "A:How long are you staying?|얼마나 머무세요?", "B:I'm staying for five days.|5일 동안 머물러요."], "p": "Where's gate twelve?|의문사로 시작하는 질문은 끝을 올리지 않고 내립니다. 웨얼즈와 트웰브에 힘을 주고 끝은 내려 주세요.", "sub": ["I'm here on business.|출장", "I'm here for a wedding.|결혼식", "I'm staying for a week.|일주일", "I'm staying at a hotel downtown.|시내 호텔", "Where's the restroom?|화장실", "Where's the bus stop?|버스 정류장"], "st": ["Jun and his family land in Sydney.|준과 가족이 시드니에 도착해요.", "The officer asks, 'Why are you here?'|직원이 '왜 오셨어요?'라고 물어요.", "Jun says, 'We're here on vacation.'|준은 '휴가로 왔어요'라고 말해요.", "Then they take a taxi to the hotel.|그다음 택시를 타고 호텔에 가요."], "q": ["Where do Jun and his family land?|In Sydney.", "Why are they there?|They're on vacation.", "How do they go to the hotel?|By taxi."], "o": ["Is this your first time here?|Yes, it is. I'm here with my family.", "Where are you staying?|I'm staying at a hotel near the beach."], "my": "Next year, I want to travel abroad with my family. At the airport, I can say, 'I'm here on vacation.'|내년에 가족과 해외여행을 가고 싶어요. 공항에서는 '휴가로 왔어요'라고 말할 수 있어요."}, {"title": "호텔에서", "tip": "호텔에서 예약 확인, 부탁, 고장 신고를 해 봅니다. 부탁할 때는 쿠드 위로 정중하게 시작하세요.", "s": ["I have a reservation.|예약했어요.", "Can I check in early?|일찍 체크인할 수 있어요?", "Could we get a baby bed?|아기 침대 받을 수 있을까요?", "The air conditioner doesn't work.|에어컨이 안 돼요.", "What time is breakfast?|아침 식사는 몇 시예요?", "Is there a pharmacy near here?|근처에 약국 있어요?", "I need more towels, please.|수건 좀 더 주세요.", "Can you call a taxi for us?|택시 좀 불러 주실래요?"], "d": ["A:Good afternoon. How can I help you?|안녕하세요. 무엇을 도와드릴까요?", "B:Hi, I have a reservation. I'm {name}.|안녕하세요, 예약했어요. 저는 {nameKo}이에요.", "A:Welcome. Here's your key.|환영합니다. 열쇠 여기 있어요.", "B:Thank you. Could we get a baby bed?|고마워요. 아기 침대 받을 수 있을까요?"], "p": "Could we get a baby bed?|예나 아니오로 답하는 질문은 끝을 올립니다. 베이비 베드에서 끝을 살짝 올려 부탁하는 느낌을 주세요.", "sub": ["Could we get extra pillows?|베개 추가", "Could we get a late checkout?|늦은 체크아웃", "The shower doesn't work.|샤워기", "Is there a bank near here?|은행", "Is there a park near here?|공원", "What time is checkout?|체크아웃 시간"], "st": ["Sara checks in at a hotel.|사라는 호텔에 체크인해요.", "Her room is nice, but it's hot.|방은 좋은데 더워요.", "The air conditioner doesn't work.|에어컨이 고장 났어요.", "She calls the front desk, and they fix it.|프런트에 전화하자 고쳐 줘요."], "q": ["Where does Sara check in?|At a hotel.", "What's the problem?|The air conditioner doesn't work.", "Who does she call?|The front desk."], "o": ["Do you need anything else?|Yes. I need more towels, please.", "How is your room?|It's nice, but it's a little hot."], "my": "At the hotel, I can ask for a baby bed.|호텔에서는 아기 침대를 부탁할 수 있어요."}, {"title": "식당에서", "tip": "식당에서 자리 잡기, 주문, 계산까지 해 봅니다. 아일 해브는 주문할 때 가장 자연스러운 말이에요.", "s": ["A table for three, please.|세 명 자리 주세요.", "Can we sit outside?|밖에 앉아도 돼요?", "What do you recommend?|뭐가 추천 메뉴예요?", "I'll have the chicken, please.|저는 치킨으로 할게요.", "Can I get a glass of water?|물 한 잔 주시겠어요?", "Is it spicy?|매워요?", "It was really good.|정말 맛있었어요.", "Can we get the check, please?|계산서 주시겠어요?"], "d": ["A:Hi, are you ready to order?|안녕하세요, 주문하시겠어요?", "B:What do you recommend?|뭐가 추천 메뉴예요?", "A:The fish is really good today.|오늘은 생선이 정말 좋아요.", "B:Great. I'll have the fish, please.|좋네요. 생선으로 할게요."], "p": "a glass of water|오브는 약하게 어로 줄어 어 글래서 워러처럼 들립니다. 워터의 터도 부드럽게 러로 바뀌어요.", "sub": ["A table for two, please.|두 명", "I'll have the steak.|스테이크", "I'll have the same.|같은 걸로", "Can I get some bread?|빵", "Can I get a high chair?|아기 의자", "Can we get a box?|포장 용기"], "st": ["Mia and her husband go to a seafood restaurant.|미아 부부는 해산물 식당에 가요.", "She asks, 'What do you recommend?'|그녀는 '뭘 추천하세요?'라고 물어요.", "The waiter says the crab is fresh.|웨이터는 게가 신선하다고 해요.", "They order crab, and it's delicious.|그들은 게를 주문하고, 아주 맛있어요."], "q": ["Where do they go?|To a seafood restaurant.", "What is fresh?|The crab.", "Is the crab good?|Yes, it's delicious."], "o": ["How was everything?|It was really good. Thank you.", "Would you like dessert?|No, thank you. Can we get the check, please?"], "my": "At restaurants, I like to ask, 'What do you recommend?'|식당에서는 '뭘 추천하세요?'라고 묻는 걸 좋아해요."}, {"title": "바이어 만나기", "tip": "처음 만나는 바이어와 인사하고 회사를 소개합니다. 명함을 건네며 웃으면서 말해보세요.", "s": ["Thank you for coming.|와 주셔서 감사합니다.", "Nice to finally meet you.|드디어 만나서 반가워요.", "Did you find us okay?|오시는 길은 괜찮으셨어요?", "Here's my business card.|제 명함이에요.", "We make screws, bolts and rivets.|저희는 나사, 볼트, 리벳을 만들어요.", "Can I show you some samples?|샘플을 좀 보여 드릴까요?", "You should see our factory.|저희 공장을 꼭 보셔야 해요.", "When do you need them?|언제 필요하세요?"], "d": ["A:Nice to finally meet you.|드디어 만나서 반가워요.", "B:Thank you for coming. Here's my business card.|와 주셔서 감사합니다. 제 명함이에요.", "A:Thanks. So, what do you make?|고마워요. 그래서, 무엇을 만드세요?", "B:We make screws, bolts and rivets.|저희는 나사, 볼트, 리벳을 만들어요."], "p": "What do you make?|왓 두 유는 빨리 말하면 와류처럼 들립니다. 원어민이 이렇게 말해도 당황하지 말고 뒤의 메이크에 집중하세요.", "sub": ["Thank you for waiting.|기다려 줘서", "Thank you for your time.|시간 내줘서", "Can I show you our catalog?|카탈로그", "Can I show you the price list?|가격표", "When do you need the samples?|샘플", "How many do you need?|수량"], "st": ["Mr. Brown visits a rivet factory.|브라운 씨는 리벳 공장을 방문해요.", "The sales manager gives him some samples.|영업 담당자가 그에게 샘플을 줘요.", "He likes the quality.|그는 품질이 마음에 들어요.", "He needs ten thousand pieces next month.|그는 다음 달에 만 개가 필요해요."], "q": ["What does Mr. Brown visit?|A rivet factory.", "What does he like?|The quality.", "How many pieces does he need?|Ten thousand."], "o": ["Do you have this in stainless steel?|Yes, we do. Can I show you a sample?", "When can you ship?|We can ship in two weeks."], "my": "And someday, I want to meet buyers and say, 'Thank you for coming.'|그리고 언젠가 바이어를 만나 '와 주셔서 감사합니다'라고 말하고 싶어요."}, {"title": "상황별 총정리", "tip": "길 묻기, 쇼핑, 작별 인사까지 입 트기 단계를 마무리합니다. 막히면 다시 말해 달라고 하면 돼요.", "s": ["Excuse me, can you help me?|실례합니다, 좀 도와주실래요?", "Sorry, can you say that again?|죄송한데 다시 말해 주실래요?", "I'm looking for this place.|이곳을 찾고 있어요.", "Is it far from here?|여기서 멀어요?", "How much is this?|이거 얼마예요?", "I like it. I'll take it.|마음에 들어요. 이걸로 할게요.", "I have to go. Nice talking to you.|가야 해요. 얘기 즐거웠어요.", "Have a good trip!|즐거운 여행 되세요!"], "d": ["A:Excuse me, are you okay?|실례지만, 괜찮으세요?", "B:Yes. I'm looking for this place. Is it far?|네. 이곳을 찾고 있어요. 멀어요?", "A:No, it's close. Just go straight.|아니요, 가까워요. 쭉 가세요.", "B:Thank you so much!|정말 고마워요!"], "p": "Nice talking to you.|토킹에서 엘 소리는 내지 않습니다. 토는 입을 크게 벌려 오와 아 사이 소리로 내세요.", "sub": ["I'm looking for the station.|역", "I'm looking for a pharmacy.|약국", "Is it far from the hotel?|호텔에서", "How much is this bag?|가방", "I'll take two.|두 개", "Nice talking to you.|얘기 즐거웠어요"], "st": ["Leo is lost in Rome.|레오는 로마에서 길을 잃었어요.", "He asks a woman, 'Is it far from here?'|그는 한 여자에게 '여기서 멀어요?'라고 물어요.", "She says, 'No, it's a five-minute walk.'|그녀는 '아니요, 걸어서 5분이에요'라고 해요.", "Leo thanks her and walks there.|레오는 고맙다고 하고 걸어가요."], "q": ["Where is Leo?|In Rome.", "Is the place far?|No, it's a five-minute walk.", "How does he go there?|He walks."], "o": ["Where are you going?|I'm looking for this restaurant. Is it far?", "How do you like it here?|I love it. The food is great."], "my": "I'm not perfect yet, but now I can do all of this.|아직 완벽하진 않지만, 이제 이 모든 걸 할 수 있어요."}]}, "13": {"days": [{"title": "worked, watched 과거형 트 소리", "tip": "지난 주말 이야기를 과거형으로 합니다. 워크트, 워치트처럼 끝을 짧은 트로 닫아 주세요.", "s": ["I worked on Saturday morning.|토요일 오전에 일했어요.", "I watched a movie at home.|집에서 영화를 봤어요.", "We walked in the park.|우리는 공원을 걸었어요.", "I cooked dinner for my family.|가족을 위해 저녁을 요리했어요.", "I washed the car.|세차를 했어요.", "I helped with the housework.|집안일을 도왔어요.", "We talked a lot.|우리는 이야기를 많이 했어요.", "I looked after the baby.|아기를 돌봤어요."], "d": ["A:How was your weekend?|주말 어땠어요?", "B:Pretty good. I worked on Saturday morning.|꽤 좋았어요. 토요일 오전에 일했어요.", "A:Oh no. What about Sunday?|저런. 일요일은요?", "B:I cooked dinner for my family.|가족을 위해 저녁을 요리했어요."], "p": "I worked on Saturday.|워크트의 끝소리는 드가 아니라 짧은 트입니다. 워크트 온은 워크톤처럼 이어 말하세요.", "sub": ["I watched TV.|티비", "I walked to the store.|가게", "I cooked pasta.|파스타", "I washed the dishes.|설거지", "I helped my parents.|부모님", "I talked to my brother.|형제와 통화"], "st": ["Dan had a quiet weekend.|댄은 조용한 주말을 보냈어요.", "He worked on Saturday morning.|토요일 오전에 일했어요.", "In the afternoon, he walked in the park.|오후에는 공원을 걸었어요.", "At night, he watched a movie.|밤에는 영화를 봤어요."], "q": ["When did Dan work?|On Saturday morning.", "Where did he walk?|In the park.", "What did he do at night?|He watched a movie."], "o": ["What did you do on Saturday?|I worked in the morning. Then I rested.", "Did you cook last weekend?|Yes, I cooked dinner for my family."], "my": "Last weekend was busy. I worked on Saturday morning.|지난 주말은 바빴어요. 토요일 오전에 일했어요."}, {"title": "played, stayed 과거형 드 소리", "tip": "플레이드, 스테이드처럼 끝이 드로 끝나는 과거형입니다. 드를 짧게 붙여 다음 단어로 넘어가세요.", "s": ["I stayed home on Sunday.|일요일엔 집에 있었어요.", "I played with my baby.|아기랑 놀았어요.", "We cleaned the house.|우리는 집을 청소했어요.", "I called my parents.|부모님께 전화했어요.", "It rained all day.|하루 종일 비가 왔어요.", "We ordered chicken.|치킨을 시켜 먹었어요.", "I relaxed on the sofa.|소파에서 쉬었어요.", "The baby smiled a lot.|아기가 많이 웃었어요."], "d": ["A:Did you go out on Sunday?|일요일에 밖에 나갔어요?", "B:No, it rained all day. I stayed home.|아니요, 하루 종일 비가 왔어요. 집에 있었어요.", "A:What did you do?|뭐 했어요?", "B:I played with my baby.|아기랑 놀았어요."], "p": "I played with my baby.|플레이드의 끝 드는 아주 짧게 붙여서 냅니다. 플레이드 위드를 끊지 말고 한 번에 이어 말하세요.", "sub": ["I stayed in bed.|침대", "I played soccer.|축구", "We cleaned the car.|차 청소", "I called my friend.|친구", "We ordered pizza.|피자", "It snowed a lot.|눈"], "st": ["It rained on Sunday.|일요일에 비가 왔어요.", "Kate stayed home with her kids.|케이트는 아이들과 집에 있었어요.", "They played games and ordered pizza.|그들은 게임을 하고 피자를 시켰어요.", "Kate relaxed in the evening.|케이트는 저녁에 쉬었어요."], "q": ["How was the weather on Sunday?|It rained.", "What did they order?|Pizza.", "What did Kate do in the evening?|She relaxed."], "o": ["What did you do on Saturday afternoon?|I stayed home and played with my baby.", "Did you call your parents?|Yes, I called them on Saturday night."], "my": "In the afternoon, I played with my baby at home.|오후에는 집에서 아기랑 놀았어요."}, {"title": "visited, wanted 과거형 이드 소리", "tip": "트나 드로 끝나는 동사는 과거형에서 이드가 붙습니다. 비지티드, 원티드처럼 한 박자 늘려 말해보세요.", "s": ["We visited my parents.|부모님 댁에 갔어요.", "I wanted to sleep more.|더 자고 싶었어요.", "We needed some groceries.|장 볼 게 좀 있었어요.", "We waited for an hour.|한 시간 기다렸어요.", "  me tell you about my trip.|제 여행 얘기 해 드릴게요.", "First, we went to the beach.|먼저 바다에 갔어요.", "Then we had lunch.|그다음 점심을 먹었어요.", "The best part was the food.|제일 좋았던 건 음식이었어요.", "We didn't have much time.|시간이 많지 않았어요.", "It was a great trip.|정말 좋은 여행이었어요.", "I want to go back.|다시 가고 싶어요.", "You should go there.|거기 꼭 가 보세요."], "d": ["A:How was your trip?|여행 어땠어요?", "B:It was a great trip. The best part was the food.|정말 좋은 여행이었어요. 제일 좋았던 건 음식이었어요.", "A:Sounds great.|좋았겠네요.", "B:You should go there. I want to go back, too.|꼭 가 보세요. 저도 다시 가고 싶어요."], "p": "The best part was the food.|베스트 파트에서 앞 단어의 트는 소리 내지 않고 베스 파트처럼 말합니다. 자음 사이의 트는 자주 빠져요.", "sub": ["The best part was the beach.|해변", "The best part was the hotel.|호텔", "First, we went to the market.|시장", "Then we took a taxi.|택시", "I want to go back next year.|내년", "You should try the coffee there.|커피"], "st": ["Grace tells her friend about her trip to Paris.|그레이스는 친구에게 파리 여행 이야기를 해요.", "First, they visited a famous museum.|먼저 유명한 박물관에 갔어요.", "Then they had dinner by the river.|그다음 강가에서 저녁을 먹었어요.", "She says the best part was the bread.|제일 좋았던 건 빵이었다고 해요."], "q": ["Where did Grace go?|To Paris.", "What did they visit first?|A famous museum.", "What was the best part?|The bread."], "o": ["What was the best part of your trip?|The best part was the food. It was cheap and delicious.", "Do you want to go back?|Yes, I want to go back with my family."], "my": "The best part was my baby's smile. I want to go back next year.|제일 좋았던 건 아기의 웃음이었어요. 내년에 다시 가고 싶어요."}]}, "15": {"days": [{"title": "I'm going to ~ 정해 둔 계획", "tip": "아임 고잉 투 뒤에 동사를 붙이면 이미 정해 둔 계획이 됩니다. 넥스트 먼스, 디스 써머 같은 시간 말과 함께 써보세요.", "s": ["I'm going to visit Japan.|저는 일본에 갈 거예요.", "I'm going to take a day off.|하루 휴가를 낼 거예요.", "We're going to travel next month.|저희는 다음 달에 여행 갈 거예요.", "I'm going to meet a customer tomorrow.|내일 고객을 만날 거예요.", "We're going to stay for a week.|저희는 일주일 동안 머물 거예요.", "It's going to be fun.|재미있을 거예요.", "It's going to rain today.|오늘 비가 올 거예요.", "What  get the bill.|계산은 제가", "I'll text you later.|나중에 문자", "I'll wait here.|여기서 기다림", "I'll ask my boss.|상사에게 물어봄", "I'll pick you up.|데리러 감", "We'll see.|두고 봐요"], "st": ["Mike is at a cafe near his hotel.|마이크는 호텔 근처 카페에 있어요.", "He says, I'll have a latte, please.|그는 라떼 한 잔 달라고 말해요.", "His phone rings. It's his boss.|전화가 울려요. 그의 상사예요.", "He says, I'll call you back in ten minutes.|그는 10분 뒤에 다시 전화하겠다고 해요."], "q": ["Where is Mike?|At a cafe near his hotel.", "What does he order?|A latte.", "When will he call his boss back?|In ten minutes."], "o": ["Can you send me the details?|Sure. I'll send them to you today.", "What would you like to drink?|I'll have an iced coffee, please."], "my": "I'll book the hotel this weekend.|이번 주말에 호텔을 예약할 거예요."}, {"title": "Are you going to ~? 계획 묻기", "tip": "아 유 고잉 투로 상대의 계획을 물어봅니다. 웬, 웨어, 하우 롱을 앞에 붙이면 질문이 더 넓어져요.", "s": ["Are you going to stay long?|오래 머무실 거예요?", "Where are you going to stay?|어디서 묵을 거예요?", "How long are you going to stay?|얼마나 머물 거예요?", "When are you going to come back?|언제 돌아올 거예요?", "Will you be here tomorrow?|내일 여기 계실 거예요?", "Will you join us for dinner?|저녁 같이 하실래요?", "Are you going to visit Korea?|한국에 오실 거예요?", "Who are you going to meet?|누구를 만날 거예요?"], "d": ["A:How long are you going to stay here?|여기 얼마나 머물 거예요?", "B:Five days. When are you going to go back?|5일이요. 언제 돌아가세요?", "A:This Friday. Will you join us for dinner?|이번 금요일이요. 저녁 같이 하실래요?", "B:Sure, I'd love to.|좋아요, 기꺼이요."], "p": "Will you join us?|윌 유는 끊지 말고 윌류처럼 이어 말합니다. 엘 소리가 다음 유에 붙어요.", "sub": ["Are you going to drive?|운전할 거예요?", "Are you going to take a taxi?|택시 탈 거예요?", "What time are you going to leave?|몇 시 출발", "Will you be at the meeting?|회의 참석", "Are you going to buy it?|살 거예요?", "Will you call me tonight?|오늘 밤 전화"], "st": ["Chris is a buyer from Australia.|크리스는 호주에서 온 구매 담당자예요.", "He's going to visit a factory in Korea.|그는 한국의 한 공장을 방문할 거예요.", "His Korean partner asks, How long are you going to stay?|한국 파트너가 얼마나 머물 거냐고 물어요.", "Chris says, Just three days.

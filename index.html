 a few dishes?|요리 몇 개 시키는 게 어때요?", "What do you think of the samples?|샘플 어떻게 보셨어요?"], "d": ["A:This place is great. How did you find it?|여기 좋네요. 어떻게 찾으셨어요?", "B:I chose it because the seafood is great.|해산물이 훌륭해서 골랐어요.", "A:Nice. By the way, your samples were good.|좋네요. 그런데 샘플 좋았어요.", "B:Thank you. I think they're stronger than most.|감사합니다. 대부분 제품보다 튼튼하다고 생각해요."], "p": "Thank you for coming.|포는 약하게 퍼 처럼 줄이고 커밍에 힘을 줍니다. 땡큐퍼커밍 처럼 한 번에 말하세요.", "sub": ["Thank you for your time.|시간 내 주셔서 감사", "I chose it because it's quiet.|조용해서 골랐어요", "Our screws are cheaper than theirs.|더 저렴해요", "I think the quality is better.|품질이 더 좋아요", "Have you ever tried kimchi?|김치 먹어 봤어요", "Why don't we meet again next month?|다음 달 다시 만나요"], "st": ["Mr. Han had dinner with a buyer from Germany.|한 씨는 독일에서 온 바이어와 저녁을 먹었어요.", "The buyer said the price was a little high.|바이어는 가격이 조금 높다고 했어요.", "Mr. Han said, It costs more, but it lasts longer.|한 씨는 더 비싸지만 더 오래 간다고 했어요.", "The buyer agreed and asked for more samples.|바이어는 동의하고 샘플을 더 요청했어요."], "q": ["Where was the buyer from?|Germany.", "What did the buyer say about the price?|It was a little high.", "What did the buyer ask for?|More samples."], "o": ["Why should we choose your company?|Because our quality is good, and we deliver on time.", "What do you think of our new product?|I think it's great. It looks stronger than the old one."], "my": "I also had dinner with a buyer there.|거기서 바이어와 저녁도 먹었어요."}, {"title": "놀이터에서: 경험, 리액션, 제안", "tip": "놀이터에서 다른 부모와 이야기하는 상황입니다. 아이 이야기는 리액션과 제안으로 쉽게 이어져요.", "s": ["How old is your little one?|아이가 몇 살이에요?", "Mine just turned one.|우리 아이는 막 한 살이 됐어요.", "Wow, she's so cute!|와, 너무 귀여워요!", "Is this your first time at this park?|이 공원 처음 오셨어요?", "Have you ever been to the zoo here?|여기 동물원 가 보셨어요?", "I think the zoo is better for babies.|동물원이 아기들한테 더 좋은 것 같아요.", "Why don't we let the kids play together?|아이들끼리 같이 놀게 할까요?", "Oh no, are you okay, buddy?|저런, 괜찮니, 꼬마야?"], "d": ["A:Hi! How old is your little one?|안녕하세요! 아이가 몇 살이에요?", "B:Mine just turned one. How about yours?|우리 아이는 막 한 살 됐어요. 그쪽은요?", "A:She's two. Have you been to the zoo here?|두 살이에요. 여기 동물원 가 보셨어요?", "B:No, not yet. Why don't we go together sometime?|아니요, 아직이요. 언제 같이 가는 게 어때요?"], "p": "How old is your little one?|올드 이즈는 붙여서 올디즈 처럼 말합니다. 하우 올디즈 유어 처럼 한 번에 이어 보세요.", "sub": ["How old is your son?|아들 몇 살", "Mine is almost two.|우리 애는 거의 두 살", "He's so big for his age!|나이에 비해 커요", "Have you ever been to the aquarium?|아쿠아리움 가봤어요", "Why don't we sit over there?|저기 앉아요", "Be careful, sweetie!|조심해, 아가"], "st": ["Sam takes his son to the playground.|샘은 아들을 놀이터에 데려가요.", "He meets a mom with a little girl.|그는 어린 딸을 둔 엄마를 만나요.", "The kids play together, and they laugh a lot.|아이들이 같이 놀고 많이 웃어요.", "The mom says, Why don't we meet here again?|그 엄마가 여기서 또 만나자고 해요."], "q": ["Where does Sam take his son?|To the playground.", "Who does he meet?|A mom with a little girl.", "What does the mom suggest?|Meeting there again."], "o": ["How old is your baby?|My baby just turned one.", "Have you ever taken your baby to a zoo?|Yes, last spring. My baby loved the giraffes."], "my": "I was nervous, but I think it went well.|긴장했지만 잘된 것 같아요."}, {"title": "여행 이야기 들려주기", "tip": "지난 여행을 순서대로 이야기해봅니다. 퍼스트, 앤 덴, 피널리 같은 연결어로 이으면 이야기가 매끄러워요.", "s": ["Let me tell you about our trip.|우리 여행 얘기 해 드릴게요.", "First, we flew to Hawaii.|먼저 하와이로 날아갔어요.", "The flight was long, but the baby slept.|비행은 길었지만 아기는 잤어요.", "And then we rented a car.|그러고 나서 차를 빌렸어요.", "Actually, it was my first time driving abroad.|사실 해외 운전은 처음이었어요.", "We had a lot of fun at the beach.|해변에서 정말 즐거웠어요.", "Finally, we watched the sunset. It was amazing.|마지막으로 석양을 봤어요. 정말 멋졌어요.", "I'd love to go back someday.|언젠가 꼭 다시 가고 싶어요."], "d": ["A:How was your trip to Hawaii?|하와이 여행 어땠어요?", "B:It was amazing. We had a lot of fun.|정말 좋았어요. 아주 즐거웠어요.", "A:What did you do there?|거기서 뭐 했어요?", "B:First, we went to the beach, and then we watched the sunset.|먼저 해변에 갔고, 그다음에 석양을 봤어요."], "p": "We had a lot of fun.|어 랏 오브는 얼라러 처럼 붙어서 빠르게 지나갑니다. 끝의 펀에 힘을 주세요.", "sub": ["First, we checked in.|먼저 체크인", "And then we went swimming.|그다음 수영", "After that, we had dinner.|그 후 저녁", "Actually, it rained a lot.|사실 비 많이", "Finally, we went home.|마지막으로 귀가", "It was the best trip ever.|최고의 여행"], "st": ["Last year, Nick went to Canada with his family.|작년에 닉은 가족과 캐나다에 갔어요.", "First, they visited a big lake.|먼저 큰 호수에 갔어요.", "Then it snowed, so they stayed in a cabin.|그러다 눈이 와서 오두막에 머물렀어요.", "Actually, that was the best part of the trip.|사실 그게 여행에서 가장 좋았어요."], "q": ["Where did Nick go last year?|To Canada.", "What did they visit first?|A big lake.", "What was the best part?|Staying in a cabin."], "o": ["Where did you go on your last trip?|We went to Japan. We had a lot of fun.", "What was the best part of your trip?|Actually, the food was the best part."], "my": "After that, we relaxed at the beach, and my baby loved it.|그 후에 해변에서 쉬었는데 아기가 정말 좋아했어요."}, {"title": "문장 늘리기 총정리", "tip": "석 달 동안 배운 과거, 미래, 이유, 비교, 경험, 의견, 제안, 리액션을 한 번에 꺼내 봅니다. 틀려도 멈추지 말고 끝까지 말해보세요.", "s": ["Last weekend, I went camping with my family.|지난 주말에 가족과 캠핑을 갔어요.", "Next month, I'm going to visit a customer.|다음 달에 고객사를 방문할 거예요.", "I'm learning English because I love traveling.|여행을 좋아해서 영어를 배우고 있어요.", "Speaking is harder than listening for me.|저는 듣기보다 말하기가 더 어려워요.", "Have you ever been to Korea?|한국에 가 보신 적 있어요?", "I think practice is the most important thing.|연습이 가장 중요한 것 같아요.", "Why don't we keep in touch?|계속 연락하고 지내는 게 어때요?", "Wow, that's great! I'm so happy for you.|와, 잘됐네요! 정말 기뻐요."], "d": ["A:Your English is really good!|영어 정말 잘하시네요!", "B:Really? Thank you. I practice every day in the car.|정말요? 고마워요. 매일 차에서 연습해요.", "A:Wow. Have you ever been to an English school?|와. 영어 학원 다녀 보신 적 있어요?", "B:No. I think practice is the most important thing.|아니요. 연습이 가장 중요한 것 같아요."], "p": "Coffee or tea?|둘 중에 고르는 질문은 앞 단어에서 올리고 뒤 단어에서 내립니다. 커피는 올리고 티는 내리세요.", "sub": ["Last year, we went to Vietnam.|작년 베트남", "I'm going to start running again.|다시 달리기", "I was late because of the rain.|비 때문에 늦음", "This one is cheaper than that one.|이게 더 싸요", "Would you like coffee or tea?|커피 또는 차", "Let's grab dinner sometime.|언제 저녁 한번"], "st": ["Daniel started English a few months ago.|다니엘은 몇 달 전에 영어를 시작했어요.", "At first, he couldn't say anything.|처음에 그는 아무 말도 못 했어요.", "But he practiced every day in his car.|하지만 매일 차에서 연습했어요.", "Now he can chat with people on trips.|이제 그는 여행에서 사람들과 이야기할 수 있어요."], "q": ["When did Daniel start English?|A few months ago.", "Where did he practice?|In his car.", "What can he do now?|Chat with people on trips."], "o": ["Why are you learning English?|Because I want to talk with people when I travel.", "What are you going to do on your next trip?|I'm going to talk to more people in English."], "my": "Next time, I'm going to speak even more English.|다음번엔 영어를 훨씬 더 많이 할 거예요."}]}});
Object.assign(EXTRAS,{"3": [{"my": "When I travel, I like to talk to people.|여행할 때 저는 사람들과 이야기하는 걸 좋아해요.", "p": "What do you do?|왓 두 유는 와루유처럼 빠르게 이어집니다. 왓으로 시작하는 질문은 끝을 내려서 말해야 자연스러워요.", "sub": ["What's your email?|이메일", "What do you need?|필요한 것", "What's the problem?|문제", "What do you think?|생각", "What's your favorite food?|좋아하는 음식", "What time do you open?|여는 시간"], "st": ["Lisa is at a market in Vietnam.|리사는 베트남의 한 시장에 있어요.", "She points and asks, What's this?|그녀는 가리키며 이게 뭐예요? 하고 물어요.", "The man says, It's a mango cake.|남자가 망고 케이크라고 해요.", "Then she asks, What do you recommend?|그리고 그녀는 뭘 추천하냐고 물어요."], "q": ["Where is Lisa?|She's at a market in Vietnam.", "What is the food?|It's a mango cake.", "What does she ask last?|What do you recommend?"], "o": ["What do you do?|I work in sales at a fastener company.", "What do you like to do?|I like running and playing with my baby."]}, {"my": "I usually ask first, Where are you from?|저는 보통 먼저 어디서 오셨어요? 하고 물어요.", "p": "Where are you from?|웨어 아 유는 웨어라유처럼 이어집니다. 웨어 끝의 알 소리를 다음 단어에 붙여 한 번에 말하세요.", "sub": ["Where is the bus stop?|버스 정류장", "Where is the exit?|출구", "Where are you staying?|숙소", "Where is your office?|사무실", "Where can I park?|주차", "Where did you buy that?|산 곳"], "st": ["Sam is on a trip in Hawaii.|샘은 하와이 여행 중이에요.", "He meets a woman at the beach.|그는 해변에서 한 여성을 만나요.", "She's from Australia.|그녀는 호주에서 왔어요.", "He asks, Where is a good place to eat?|그는 어디가 먹기 좋은 곳이냐고 물어요."], "q": ["Where is Sam?|He's in Hawaii.", "Where is the woman from?|She's from Australia.", "What does Sam ask about?|A good place to eat."], "o": ["Where are you from?|I'm from Korea, near the sea.", "Where do you want to go next?|I want to go to Europe with my family."]}, {"my": "Then I ask, How long are you here for?|그다음엔 여기 얼마나 계세요? 하고 물어요.", "p": "How much is this?|하우 머치 이즈는 하우머치즈처럼 붙여 말합니다. 이즈는 앞 단어에 붙어 즈 소리만 남아요.", "sub": ["How much is the room?|방 가격", "How long is the flight?|비행 시간", "How many rooms do you need?|방 몇 개", "How was the meeting?|회의 어땠는지", "How's your family?|가족 안부", "How far is the hotel?|호텔까지 거리"], "st": ["Mr. Cho visits a customer in Vietnam.|조 씨는 베트남의 고객을 방문해요.", "The customer asks, How much is this rivet?|고객이 이 리벳은 얼마냐고 물어요.", "Mr. Cho asks, How many do you need?|조 씨가 몇 개 필요하냐고 물어요.", "The customer needs fifty thousand.|고객은 오만 개가 필요해요."], "q": ["Where does Mr. Cho go?|He goes to Vietnam.", "What does the customer ask about?|The price of a rivet.", "How many rivets does he need?|Fifty thousand."], "o": ["How was your day?|It was busy, but good.", "How old is your baby?|My baby is ten months old."]}, {"my": "Sometimes they ask, Why are you here? I say, Because I'm on vacation.|가끔 사람들이 왜 오셨어요? 하고 물어요. 저는 휴가 중이라서요 라고 해요.", "p": "Because I'm on vacation.|비코즈는 대화에서 커즈처럼 짧게 줄어듭니다. 커즈가 들리면 이유를 말하는 중이에요.", "sub": ["When is the meeting?|회의 시간", "When do you close?|닫는 시간", "Who is your boss?|상사", "Who made this?|만든 사람", "Why is it so cheap?|싼 이유", "Because it's on sale.|세일 중이라서"], "st": ["Mia is at the airport.|미아는 공항에 있어요.", "A man asks, Why are you here?|한 남자가 왜 왔냐고 물어요.", "She says, Because I'm on vacation.|그녀는 휴가 중이라서요 라고 해요.", "She's here with her husband and son.|그녀는 남편, 아들과 함께 와 있어요."], "q": ["Where is Mia?|She's at the airport.", "Why is she here?|Because she's on vacation.", "Who is she with?|Her husband and son."], "o": ["Why are you learning English?|Because I want to travel with my family.", "When do you have free time?|I have free time on weekends."]}, {"my": "But I often miss words. Then I say, Could you repeat that?|하지만 자주 못 알아들어요. 그럴 땐 다시 말씀해 주시겠어요? 하고 말해요.", "p": "Sorry, I didn't catch that.|디든트의 트는 거의 소리가 나지 않아 디든 캐치처럼 들립니다. 캐치 댓도 끊지 말고 이어 말하세요.", "sub": ["Sorry, I didn't hear you.|못 들었음", "Could you say it slowly?|천천히", "What does this word mean?|이 단어 뜻", "You mean next Monday?|다음 월요일 말이죠", "Let me check.|확인해볼게요", "Could you spell that?|철자"], "st": ["Paul calls a hotel in New York.|폴은 뉴욕의 한 호텔에 전화해요.", "The staff speaks very fast.|직원이 아주 빨리 말해요.", "Paul says, Sorry, I didn't catch that.|폴은 죄송해요, 못 알아들었어요 라고 해요.", "Then the staff speaks slowly.|그러자 직원이 천천히 말해요."], "q": ["Who does Paul call?|A hotel in New York.", "How does the staff speak at first?|Very fast.", "What does the staff do next?|The staff speaks slowly."], "o": ["Do you understand me?|Mostly, but could you speak slowly?", "What do you say when you don't understand?|I say, Sorry, could you repeat that?"]}], "4": [{"my": "I usually get up early and drive to work.|저는 보통 일찍 일어나서 차로 출근해요.", "p": "I usually get up at six.|겟 업은 게럽처럼 이어집니다. 모음 사이에 낀 트는 부드러운 르 소리로 바뀌어요.", "sub": ["I usually walk to work.|걸어서 출근", "I usually eat breakfast.|아침 먹음", "I usually go to bed at eleven.|11시 취침", "I always play with my baby.|아기와 놀기", "I sometimes work late.|가끔 야근", "I never skip breakfast.|아침 거르지 않음"], "st": ["Ken usually gets up at six.|켄은 보통 6시에 일어나요.", "He drinks coffee and drives to work.|그는 커피를 마시고 차로 출근해요.", "He usually finishes at seven.|그는 보통 7시에 일이 끝나요.", "On weekends, he sometimes plays tennis.|주말에는 가끔 테니스를 쳐요."], "q": ["When does Ken get up?|At six.", "How does he go to work?|He drives.", "What does he do on weekends?|He sometimes plays tennis."], "o": ["What time do you usually get up?|I usually get up at six.", "What do you usually do after work?|I usually play with my baby."]}, {"my": "Last summer, I went to Japan with my family.|작년 여름에 가족과 일본에 갔어요.", "p": "I went to Japan.|웬트 투는 트가 거의 사라져 웬투처럼 한 번에 들립니다. 웬 뒤에 바로 투를 붙이세요.", "sub": ["I went to the beach.|해변", "I went shopping.|쇼핑", "I went to Jeju last year.|작년 제주", "It was cold.|추웠음", "It was a long day.|긴 하루", "The hotel was clean.|호텔 깨끗"], "st": ["Amy went to Thailand last month.|에이미는 지난달 태국에 갔어요.", "She went with her husband and baby.|남편, 아기와 함께 갔어요.", "The hotel wasn't expensive.|호텔은 비싸지 않았어요.", "The food was delicious.|음식은 맛있었어요."], "q": ["Where did Amy go?|She went to Thailand.", "Who did she go with?|Her husband and baby.", "How was the food?|It was delicious."], "o": ["Where did you go last year?|I went to Jeju with my family.", "How was your weekend?|It was great. I went to the beach."]}, {"my": "Last night, I didn't sleep well. My baby woke up.|어젯밤엔 잘 못 잤어요. 아기가 깼거든요.", "p": "No, I didn't.|디든트는 끝의 트를 거의 소리 내지 않고 디든에서 멈춥니다. 디드와 헷갈리지 않게 든을 분명히 말하세요.", "sub": ["Did you have dinner?|저녁", "Did you call him?|전화", "Did you like the hotel?|호텔 마음에 듦", "Did you see my message?|메시지 확인", "I didn't eat breakfast.|아침 안 먹음", "I didn't have time.|시간 없었음"], "st": ["Nick met a client this morning.|닉은 오늘 아침 고객을 만났어요.", "The client asked, Did you get my email?|고객이 제 이메일 받으셨어요? 하고 물었어요.", "Nick said, No, I didn't.|닉은 아니요, 못 받았어요 라고 했어요.", "He checked again and found it.|그는 다시 확인해서 이메일을 찾았어요."], "q": ["Who did Nick meet?|A client.", "Did Nick see the email at first?|No, he didn't.", "What did he do next?|He checked again."], "o": ["Did you sleep well last night?|No, I didn't. My baby woke up.", "Did you eat lunch?|Yes, I did. I had kimchi stew."]}, {"my": "Next year, we're going to visit Europe.|내년에 저희는 유럽에 갈 거예요.", "p": "I'm going to call you.|고잉 투는 거너로 줄어듭니다. 아임 거너 콜 유처럼 한 덩어리로 말해보세요.", "sub": ["I'm going to rest.|쉬기", "I'm going to send it today.|오늘 발송", "We're going to eat out.|외식", "It's going to be hot.|더울 것", "Are you going to come?|올 건지", "I'm going to buy a gift.|선물 사기"], "st": ["Ella is going to visit Italy.|엘라는 이탈리아에 갈 거예요.", "She's going to stay for a week.|일주일 동안 머무를 거예요.", "She's going to eat pasta every day.|매일 파스타를 먹을 거예요.", "But it's going to rain there.|하지만 거기엔 비가 올 거예요."], "q": ["Where is Ella going to go?|To Italy.", "How long is she going to stay?|For a week.", "What's the weather going to be like?|It's going to rain."], "o": ["What are you going to do this weekend?|I'm going to take my baby to the park.", "Are you going to travel next year?|Yes, we're going to visit Europe."]}, {"my": "So I practice English in my car every day.|그래서 매일 차에서 영어를 연습해요.", "p": "I worked late. I called you.|과거형 끝소리는 앞 소리에 따라 트 또는 드로 짧게 납니다. 워크트, 콜드처럼 붙이고 워크드처럼 늘리지 마세요.", "sub": ["I worked late yesterday.|어제 야근", "I called my client.|고객에게 전화", "We stayed at a nice hotel.|좋은 호텔", "I watched a movie.|영화", "We visited my parents.|부모님 방문", "I finished my work early.|일찍 끝냄"], "st": ["Dan is a sales manager in Korea.|댄은 한국의 영업 매니저예요.", "Last week, he worked late every day.|지난주에 그는 매일 늦게까지 일했어요.", "On Saturday, he stayed home with his baby.|토요일에는 아기와 집에 있었어요.", "He's going to travel next month.|그는 다음 달에 여행을 갈 거예요."], "q": ["What does Dan do?|He's a sales manager.", "What did he do on Saturday?|He stayed home with his baby.", "When is he going to travel?|Next month."], "o": ["What did you do last weekend?|I stayed home and played with my baby.", "Can you tell me about yourself?|I'm {name}. I work in sales in Korea."]}]});

<script>const $=q=>document.querySelector(q),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

 try{const {packs,extras,seen,pron,...core}=S;const c=db.collection("data/users/"+uid);await c.doc("progress").set(core);await c.doc("seen").set({map:seen,pron});await c.doc("packs").set({json:JSON.stringify({packs,extras})})}catch(e){}
 saveBusy=false;if(saveAgain){saveAgain=false;saveRemote()}}

 try{const [d,u]=await Promise.all([claude.use("db"),claude.use("user")]);if(!d||!u)return;uid=await u.id();db=d;
  const c=db.collection("data/users/"+uid),[p,se,pk]=await Promise.all([c.doc("progress").get(),c.doc("seen").get(),c.doc("packs").get()]);

/* 이름 넣기: 수업 문장의 {name}, {nameKo}를 설정에 적은 이름으로 바꾼다. 공개 파일에는 실제 이름이 들어가지 않는다. */
const josa=n=>{const c=n.charCodeAt(n.length-1);return c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28?"이에요":"예요"};
const per=t=>{const e=S.name||"Min",k=S.nameKo||"민";return String(t).replace(/\{nameKo\}이에요/g,k+josa(k)).replace(/\{nameKo\}/g,k).replace(/\{name\}/g,e)};
const KO={}; /* 영어 문장 → 뜻. 운전 화면에 함께 띄운다 */
const split=x=>{x=per(x);const i=x.indexOf("|"),en=x.slice(0,i),ko=x.slice(i+1);KO[en]=ko;return{en,ko}};

 const obj=x=>x&&typeof x==="object"&&!Array.isArray(x)?x:{};
 S={...S,...n,log:obj(n.log),seen:obj(n.seen),pron:obj(n.pron),packs:obj(n.packs),extras:obj(n.extras),day:Math.floor(n.day)};

/* 수업 생성 */
const XFMT=`"p":"오늘 발음 포인트가 담긴 짧은 영어 예문|한국어 1~2문장 설명(영어 알파벳 없이 한글 발음 표기)","sub":["바꿔 말하기용 완전한 영어 문장.|짧은 한국어 힌트"] 6개,"st":["3인칭 짧은 이야기 한 줄.|한국어 뜻"] 4개,"q":["이야기에 대한 영어 질문?|짧은 영어 답."] 3개,"o":["학습자에게 묻는 열린 질문?|학습자 입장의 자연스러운 예시 답."] 2개,"my":"학습자 본인의 대사 1~2문장. 5일치를 1일부터 이어 붙이면 이번 주 주제에 맞는 하나의 자연스러운 자기 이야기가 되도록, 그날 표현을 사용|한국어 뜻"`;
const validX=d=>d&&typeof d.p==="string"&&d.p.includes("|")&&[["sub",4],["st",3],["q",2],["o",2]].every(([k,n])=>Array.isArray(d[k])&&d[k].length>=n&&d[k].every(x=>typeof x==="string"&&x.includes("|")));
function validPack(p,needX){return p&&Array.isArray(p.days)&&p.days.length===5&&p.days.every(d=>d.title&&d.tip&&Array.isArray(d.s)&&d.s.length>=6&&Array.isArray(d.d)&&d.d.length>=4&&d.s.every(x=>x.includes("|"))&&d.d.every(x=>/^[AB]:/.test(x)&&x.includes("|"))&&(!needX||validX(d)))}
const who=()=>"학습자: 말문이 거의 안 트인 초보에서 출발한 한국인 성인."+(S.profile?" 학습자 소개: "+S.profile.replace(/\s+/g," ").slice(0,300)+".":"")+" 목표는 해외 가족여행 중 외국인과의 스몰토크와 간단한 비즈니스 대화. 학습자 이름이 필요하면 영어에는 {name}, 한국어에는 {nameKo}라고 그대로 쓰세요. 운전 중 귀로만 듣고 따라 하는 수업이므로 원어민이 실제로 쓰는 자연스럽고 짧은 구어체로 쓰세요.";
async function generate(need){if(genBusy||!sample||!need)return;genBusy=true;genErr="";renderHome();const w=need.w,ph=phaseOf(w);
 const len=w<=24?"3~9단어":w<=38?"5~12단어":"6~14단어";let prompt;
 if(need.full){const prev=(packOf(w-1)||{days:[]}).days.map(d=>d.title).join(", ");
  prompt=`운전 중 청취용 영어 수업 일주일치(5일)를 JSON으로 작성하세요.\n${who()}\n${w}주차 / 전체 ${WEEKS.length}주. 구간: ${ph.name} (${ph.goal}). 이번 주 주제: ${WEEKS[w-1]}. 지난주 소제목: ${prev||"없음"}.\n규칙: 문장은 ${len}. 하루 s는 정확히 8개, d는 A(상대)와 B(학습자)가 번갈아 말하는 ${w<=24?4:6}줄이며 A로 시작. 지난 표현을 일부 재사용. tip은 음성으로 읽을 한국어 1~2문장이며 영어 알파벳 없이 한글로 표기.\n형식: {"days":[{"title":"짧은 제목","tip":"...","s":["English sentence.|한국어 뜻"],"d":["A:English line.|한국어 뜻","B:English line.|한국어 뜻"],${XFMT}}]}\ndays는 정확히 5개. JSON만 출력.`}
 else{const days=packOf(w).days.map((d,i)=>`${i+1}일 ${d.title}: ${d.s.map(x=>x.split("|")[0]).join(" / ")}`).join("\n");
  prompt=`운전 중 청취용 영어 수업에 추가 활동을 JSON으로 작성하세요.\n${who()}\n${w}주차 주제: ${WEEKS[w-1]}. 각 날의 문장:\n${days}\n각 날의 문장과 표현을 활용하고 문장은 ${len}.\n형식: {"days":[{${XFMT}}]}\ndays는 정확히 5개이며 위 1~5일 순서. JSON만 출력.`}
 try{const p=await sample.json(prompt,{modelTier:"default",cache:false});
  if(need.full){if(!validPack(p,true))throw{code:"bad"};S.packs[w]=p}else{if(!p||!Array.isArray(p.days)||p.days.length!==5||!p.days.every(validX))throw{code:"bad"};S.extras[w]=p.days}
  save();showToast(w+"주차 수업이 준비됐습니다.")}
 catch(e){genErr=e&&e.code==="not_granted"?"Claude 사용 허용이 필요합니다. 페이지를 새로 열고 허용해 주세요.":e&&e.code==="rate_limited"?"요청이 많아 잠시 막혔습니다. 몇 분 뒤 다시 눌러주세요.":"만들지 못했습니다. 잠시 뒤 다시 눌러주세요."}
 genBusy=false;renderHome()}

/* 문장과 발음 체크 */
const W={day:null,i:0,res:null,busy:false,tip:""};
const normW=t=>t.toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9']+/g," ").trim();
function diffWords(target,heard){const disp=target.split(/\s+/).filter(x=>normW(x)),a=disp.map(normW),b=normW(heard).split(/\s+/).filter(Boolean),n=a.length,m=b.length;
 const D=Array.from({length:n+1},()=>new Array(m+1).fill(0));for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)D[i][j]=a[i]===b[j]?D[i+1][j+1]+1:Math.max(D[i+1][j],D[i][j+1]);
 const ok=new Array(n).fill(false);let i=0,j=0;while(i<n&&j<m){if(a[i]===b[j]){ok[i]=true;i++;j++}else if(D[i+1][j]>=D[i][j+1])i++;else j++}
 return{disp,ok,score:n?Math.round(ok.filter(Boolean).length/n*100):0}}
/* 음성인식은 숫자를 10처럼 숫자로 적기도 한다. 문장 속 영어 숫자와 맞춰 본다. */
const NUMW=["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"],TENW=["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
const numWord=n=>n<20?NUMW[n]:n<100?TENW[Math.floor(n/10)]+(n%10?" "+NUMW[n%10]:""):n<1000?NUMW[Math.floor(n/100)]+" hundred"+(n%100?" "+numWord(n%100):""):n<1e6?numWord(Math.floor(n/1000))+" thousand"+(n%1000?" "+numWord(n%1000):""):String(n);
const spellNums=t=>t.replace(/\b\d{1,3}(?:,\d{3})+\b|\b\d+\b/g,m=>numWord(+m.replace(/,/g,"")));
/* 후보 여러 개 중 가장 잘 맞는 것으로 채점 */
function bestOf(target,texts){return texts.map(h=>{const a=diffWords(target,h),b=diffWords(target,spellNums(h));return{...(b.score>a.score?b:a),heard:h}}).sort((x,y)=>y.score-x.score)[0]}
function defaultWordDay(){return S.morningDay===S.day?S.day:Math.max(0,S.lastDay>=0?S.lastDay:S.day-1)}
function renderWords(){if(W.day===null)W.day=defaultWordDay();const maxD=Math.max(S.day,0),L=lessonAt(W.day),box=$("#v-words"),old=$("#heard"),draft=old?old.value:"";
 if(!L){box.innerHTML=`<p class="notice">이번 주 수업을 먼저 만들어 주세요. 오늘 탭에 버튼이 있습니다.</p>`;return}
 W.i=Math.min(W.i,L.s.length-1);const s=L.s[W.i],r=W.res,ps=S.pron[s.id];
 box.innerHTML=`<div class="top"><h3 class="sec">${L.week}주 ${L.dayNo}일: ${esc(L.title)}</h3><div class="row"><button class="btn" id="wd-p" ${W.day<=0?"disabled":""} aria-label="이전 날">이전 날</button><button class="btn" id="wd-n" ${W.day>=maxD?"disabled":""} aria-label="다음 날">다음 날</button></div></div>
 <div class="notice pc"><span class="small">발음 체크 ${W.i+1}/${L.s.length}${ps!=null?` · 지난 점수 ${ps}점`:""}</span><b class="big">${esc(s.en)}</b><span class="ko">${esc(s.ko)}</span>
 <div class="row"><button class="btn" data-say="${esc(s.en)}">듣기</button><button class="btn" id="slow">천천히 듣기</button></div>
 ${micReady()?`<button class="micbtn ${W.listening?"on":""}" id="mic" aria-pressed="${!!W.listening}"><span class="dot" aria-hidden="true"></span>${W.listening?"듣는 중, 누르면 멈춤":"누르고 영어로 읽기"}</button><p class="live" id="live" aria-live="polite">${W.listening?"위 문장을 소리 내어 읽어 주세요":""}</p>`:""}
 <details class="kb" ${micReady()?"":"open"}><summary>${micReady()?"마이크가 안 되면 키보드로 입력":"키보드로 입력"}</summary><label for="heard">키보드의 마이크 버튼을 누르고 위 문장을 영어로 읽어보세요<textarea id="heard" placeholder="여기에 말한 내용이 글자로 들어옵니다" autocapitalize="off"></textarea></label><div class="row"><button class="btn" id="chk">확인</button></div></details>
 <div class="row"><button class="btn" id="pc-p" ${W.i<=0?"disabled":""}>이전 문장</button><button class="btn" id="pc-n" ${W.i>=L.s.length-1?"disabled":""}>다음 문장</button></div>
 ${r?`<div class="res"><div class="score">${r.score}점</div><p class="diff">${r.disp.map((w,k)=>`<span class="${r.ok[k]?"ok":"miss"}">${esc(w)}</span>`).join(" ")}</p><p class="small">휴대폰이 알아들은 말: ${esc(r.heard)}</p>
 ${r.score===100?`<p>원어민용 음성인식기가 그대로 알아들었습니다. 잘하셨어요.</p>`:`<p class="small">빨간 단어가 다르게 들린 부분입니다. 듣기를 누르고 그 단어만 다시 따라 해보세요.</p>${sample?`<div class="row"><button class="btn" id="why" ${W.busy?"disabled":""}>${W.busy?"생각하는 중…":"어떻게 고쳐 말할까요?"}</button></div>`:""}${W.tip?`<div class="fix">${esc(W.tip)}</div>`:""}`}</div>`:""}</div>
 <h3 class="sec">이날의 문장</h3><ul class="list">${L.s.map((x,k)=>`<li><button data-say="${esc(x.en)}"><span class="en">${esc(x.en)}${S.pron[x.id]!=null?` <small class="small">${S.pron[x.id]}점</small>`:""}</span><span class="ko">${esc(x.ko)}</span></button></li>`).join("")}</ul>
 ${L.p?`<h3 class="sec">발음 포인트</h3><div class="notice"><button class="play" data-say="${esc(L.p.en)}">${esc(L.p.en)}</button>${esc(L.p.ko)}</div>`:""}
 ${L.st.length?`<h3 class="sec">짧은 이야기</h3><ul class="list">${L.st.map(x=>`<li><button data-say="${esc(x.en)}"><span class="en">${esc(x.en)}</span><span class="ko">${esc(x.ko)}</span></button></li>`).join("")}</ul>`:""}
 <h3 class="sec">회화</h3><ul class="list">${L.d.map(l=>`<li><button data-say="${esc(l.en)}"><span class="en">${l.who==="A"?"상대":"나"}: ${esc(l.en)}</span><span class="ko">${esc(l.ko)}</span></button></li>`).join("")}</ul>`;
 bindSay(box);$("#heard").value=draft;
 $("#wd-p").onclick=()=>{W.day--;W.i=0;W.res=null;W.tip="";renderWords()};$("#wd-n").onclick=()=>{W.day++;W.i=0;W.res=null;W.tip="";renderWords()};
 $("#slow").onclick=()=>{synth&&synth.cancel();pickVoices();speak(s.en,"en",.65)};
 const move=k=>{W.i+=k;W.res=null;W.tip="";$("#heard").value="";renderWords()};$("#pc-p").onclick=()=>move(-1);$("#pc-n").onclick=()=>move(1);
 $("#chk").onclick=()=>{const h=$("#heard").value.trim();if(!h){showToast("키보드의 마이크를 누르고 문장을 읽어주세요.");return}W.res=bestOf(s.en,[h]);W.tip="";S.pron[s.id]=W.res.score;save();renderWords()};
 const mb=$("#mic");if(mb)mb.onclick=()=>{if(MIC.on){micStop();return}
  if(synth)synth.cancel();
  let p;try{p=listenOnce({onPartial:t=>{const lv=$("#live");if(lv)lv.textContent=t||"…"}})}catch(e){p=Promise.reject({code:"upstream_error"})}
  W.listening=true;mb.classList.add("on");mb.setAttribute("aria-pressed","true");mb.lastChild.textContent="듣는 중, 누르면 멈춤";$("#live").textContent="위 문장을 소리 내어 읽어 주세요";
  p.then(r=>{W.listening=false;if(!r.texts.length){showToast("말소리를 받지 못했습니다. 다시 누르고 읽어 주세요.");renderWords();return}
   W.res=bestOf(s.en,r.texts);W.tip="";S.pron[s.id]=W.res.score;save();renderWords()}).catch(e=>{W.listening=false;showToast(micErr(e&&e.code));renderWords()})};
 const why=$("#why");if(why)why.onclick=async()=>{W.busy=true;renderWords();
  try{const t=await sample(`한국인 영어 초보가 "${s.en}"라고 읽었는데 휴대폰 음성인식은 "${r.heard}"로 알아들었습니다. 어떤 단어의 발음을 어떻게 고치면 되는지 한국어로 2~3문장만 알려주세요. 입 모양과 혀 위치를 쉽게 설명하고, 소리는 한글로 표기하세요. 인사말 없이 바로 설명만.`,{modelTier:"quick"});W.tip=t.text.trim()}catch(e){W.tip=e&&e.code==="not_granted"?"Claude 사용 허용이 필요합니다.":"설명을 받지 못했습니다. 다시 눌러주세요."}
  W.busy=false;renderWords()}}

/* 집에서 회화 */
const SCEN=[{k:"비행기 옆자리",open:"Hi there! Is this your first time going there?",ko:"안녕하세요! 거기 처음 가시는 거예요?",role:"a friendly traveler sitting next to the learner on a plane"},{k:"호텔 조식",open:"Good morning! Are you here with your family?",ko:"좋은 아침이에요! 가족과 함께 오셨어요?",role:"another hotel guest chatting at breakfast"},{k:"아이 이야기",open:"Oh, your baby is so cute! How old?",ko:"아, 아기가 정말 귀엽네요! 몇 살이에요?",role:"a kind parent at a playground on holiday"},{k:"해외 거래처 첫인사",open:"Nice to meet you. Could you tell me about your company?",ko:"반갑습니다. 회사 소개를 부탁드려도 될까요?",role:"a foreign buyer meeting a Korean company manager"},{k:"가격과 납기",open:"What's your price for ten thousand rivets, and how soon can you ship?",ko:"리벳 1만 개 가격이 얼마이고 얼마나 빨리 보낼 수 있나요?",role:"a foreign purchasing manager asking about rivet price and delivery"}];
let T={i:0,msgs:[],busy:false,err:""};function initTalk(){T.msgs=[{r:"them",en:SCEN[T.i].open,ko:SCEN[T.i].ko}];T.err=""}
function renderTalk(){if(!T.msgs.length)initTalk();const box=$("#v-talk"),old=$("#say-in"),draft=old?old.value:"";
 box.innerHTML=`<h3 class="sec">집에서 회화</h3><p class="small">${micReady()?"말하기를 누르고 영어로 말하면 글자로 들어옵니다. 확인하고 보내기를 누르세요.":"휴대폰 키보드의 마이크를 누르고 영어로 말하면 글자로 입력됩니다."} 막히면 한국어를 섞어도 됩니다. 주 2회, 15분이면 충분합니다.</p>
 <div class="chips">${SCEN.map((s,i)=>`<button class="chip" data-i="${i}" aria-pressed="${i===T.i}">${s.k}</button>`).join("")}</div>
 <div class="chat">${T.msgs.map(m=>m.r==="me"?`<div class="m me">${esc(m.en)}</div>`:m.r==="fix"?`<div class="fix"><b>더 자연스럽게: ${esc(m.en)}</b>${esc(m.ko)}</div>`:`<div class="m them"><span class="en">${esc(m.en)}</span><span class="ko">${esc(m.ko)}</span><button class="play" data-say="${esc(m.en)}">다시 듣기</button></div>`).join("")}${T.busy?'<div class="m them"><span class="ko">답을 생각하는 중…</span></div>':""}</div>
 ${T.err?`<p style="color:var(--warn)">${esc(T.err)}</p>`:""}
 ${sample?`<label for="say-in">내 말<textarea id="say-in" placeholder="Hi. Yes, it's my first time."></textarea></label><div class="row">${micReady()?`<button class="btn" id="talk-mic">말하기</button>`:""}<button class="btn primary" id="send" ${T.busy?"disabled":""}>보내기</button><button class="btn" id="reset">처음부터</button></div>`:`<p class="notice">AI 회화는 Claude에 로그인해 이 페이지를 열면 사용할 수 있습니다.</p>`}`;
 box.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{T.i=+b.dataset.i;initTalk();renderTalk()});bindSay(box);
 const inp=$("#say-in");if(inp)inp.value=draft;const sn=$("#send");if(sn)sn.onclick=sendTalk;const r=$("#reset");if(r)r.onclick=()=>{initTalk();renderTalk()};
 const tm=$("#talk-mic");if(tm)tm.onclick=()=>{if(MIC.on){micStop();return}if(synth)synth.cancel();const base=inp.value.trim();
  let p;try{p=listenOnce({maxMs:20000,onPartial:t=>{inp.value=(base?base+" ":"")+t}})}catch(e){p=Promise.reject({code:"upstream_error"})}
  tm.textContent="듣는 중, 누르면 멈춤";tm.classList.add("on");
  p.then(x=>{inp.value=(base?base+" ":"")+(x.texts[0]||"");if(!x.texts.length)showToast("말소리를 받지 못했습니다. 다시 눌러 주세요.")}).catch(e=>showToast(micErr(e&&e.code))).finally(()=>{tm.textContent="말하기";tm.classList.remove("on")})}}
async function sendTalk(){const inp=$("#say-in"),text=inp.value.trim();if(!text||T.busy)return;inp.value="";T.msgs.push({r:"me",en:text,ko:""});T.busy=true;T.err="";renderTalk();const sc=SCEN[T.i],w=weekOf(S.day);
 const hist=T.msgs.filter(m=>m.r!=="fix").map(m=>(m.r==="me"?"Learner: ":"You: ")+m.en).join("\n");
 const prompt=`You are ${sc.role}. Role-play with a Korean adult beginner learner of English (week ${w} of ${WEEKS.length}, this week's theme: ${WEEKS[Math.min(w,WEEKS.length)-1]}). Speak in short natural sentences a beginner can hear and answer, end with one easy question. The learner typed via voice input, so ignore punctuation and spelling errors.\n\n${hist}\n\nReturn JSON only: {"reply":"your next line in English, max 20 words","reply_ko":"natural Korean translation","natural":"the most natural English version of the learner's last message, or empty string if already natural","note_ko":"one short Korean tip about the correction, or empty string"}`;
 try{const a=await sample.json(prompt,{modelTier:"quick",cache:false});if(a.natural)T.msgs.push({r:"fix",en:a.natural,ko:a.note_ko||""});T.msgs.push({r:"them",en:a.reply,ko:a.reply_ko||""});T.busy=false;renderTalk();synth&&synth.cancel();pickVoices();speak(a.reply,"en",S.rate,"A")}catch(e){T.busy=false;T.err=e&&e.code==="not_granted"?"Claude 사용 허용이 필요합니다.":e&&e.code==="rate_limited"?"요청이 많습니다. 잠시 뒤 다시 보내주세요.":"답을 받지 못했습니다. 다시 보내주세요.";renderTalk()}}

/* 노선 */
function renderRoute(){const w=weekOf(S.day);$("#v-route").innerHTML=`<h3 class="sec">14개월 노선</h3><p class="small">평일 하루 1시간, 총 약 280시간. 출근길에 새 문장을 넣고 퇴근길에 다른 방법으로 꺼냅니다.</p><ol class="route">${PHASES.map(p=>{const c=w>p.to?"done":w>=p.from?"now":"";return`<li class="${c}"><i></i><span class="wk">${p.from}–${p.to}주</span><b>${p.name}</b><p>${p.goal}</p><details ${c==="now"?"open":""}><summary>주차별 주제</summary><ol>${WEEKS.slice(p.from-1,p.to).map((t,i)=>{const n=p.from+i;return`<li class="${n===w?"cur":""}"><span>${n}주</span>${esc(t)}</li>`}).join("")}</ol></details></li>`}).join("")}</ol>`}
function renderAll(){const n=Math.ceil((new Date(S.goal+"T00:00:00")-new Date())/864e5);$("#dday").textContent="여행까지 D-"+Math.max(0,n);renderHome();renderWords();renderRoute();if(cur==="talk")renderTalk()}
function go(v){cur=v;document.querySelectorAll("nav button").forEach(x=>x.setAttribute("aria-current",x.dataset.v===v));["home","talk","words","route"].forEach(k=>$("#v-"+k).hidden=k!==cur);if(cur==="talk")renderTalk();if(cur==="words")renderWords();window.scrollTo(0,0)}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.v));
$("#d-pause").onclick=togglePause;$("#d-next").onclick=next;$("#d-prev").onclick=prev;$("#d-end").onclick=()=>finish(false);
loadLocal();renderAll();initCaps();

/* 오늘의 단어 (하루 5개)
   build.py가 app.js 바로 뒤에 붙인다. app.js를 고치지 않고 buildSession, reviewUnits, renderWords를 감싸서 끼워 넣는다.
   - 출근 수업: "새 문장" 바로 앞에 단어 미리 익히기 (단어 천천히 → 뜻 → 단어 → 예문)
   - 퇴근 수업: "아침 문장 떠올리기" 바로 뒤에 단어 떠올리기 (뜻 → 잠깐 멈춤 → 단어 → 예문)
   - 30분이 남아 복습이 돌 때: 세 번에 한 번 단어 떠올리기
   - 문장 탭: "이날의 문장" 위에 오늘의 단어 목록 (누르면 단어와 예문이 들린다)
   데이터: VOCAB[주차][0~4] = ["word|뜻|Example sentence.|예문 뜻", ...] */
(function(){
 if(typeof VOCAB==="undefined"||!VOCAB)return;
 const vocabOf=day=>{const w=Math.floor(day/5)+1,a=VOCAB[w]&&VOCAB[w][day%5];if(!Array.isArray(a))return[];
  return a.map(x=>{const p=per(String(x)).split("|").map(t=>t.trim());if(p[0])KO[p[0]]=p[1]||"";if(p[2])KO[p[2]]=p[3]||"";return{en:p[0]||"",ko:p[1]||"",ex:p[2]||"",exKo:p[3]||""}}).filter(v=>v.en&&v.ko)};
 window.vocabOf=vocabOf;

 const uVocab=(V,r)=>[intro("오늘의 단어","오늘 문장에 나오는 단어 "+V.length+"개를 먼저 익힙니다. 단어를 듣고 두 번 따라 하세요."),
  ...V.map(v=>({label:"오늘의 단어",steps:[say(v.en,"en",.72),wait(repNew(v.en)),koS(v.ko),wait(250),say(v.en,"en",r),wait(repNew(v.en)),...(v.ex?[say(v.ex,"en",r),wait(repMs(v.ex))]:[])]}))];
 const uVocabRecall=(V,r)=>[intro("단어 떠올리기","한국말 뜻을 듣고 영어 단어를 먼저 말해보세요."),
  ...shuffle(V).map(v=>({label:"단어 떠올리기",steps:[cue(v.ko),wait(2200),say(v.en,"en",r),wait(repNew(v.en)),...(v.ex?[say(v.ex,"en",r),wait(repMs(v.ex))]:[])]}))];

 const baseBuild=buildSession;
 buildSession=function(kind,L,r){const u=baseBuild(kind,L,r);if(!L)return u;const V=vocabOf(L.day);if(!V.length)return u;
  if(kind==="m"){let i=u.findIndex(x=>x.label==="새 문장");if(i<0)i=Math.min(1,u.length);u.splice(i,0,...uVocab(V,r))}
  else{let last=-1;u.forEach((x,k)=>{if(x.label==="아침 문장 떠올리기")last=k});u.splice(last>=0?last+1:Math.min(1,u.length),0,...uVocabRecall(V,r))}
  return u};

 const baseReview=reviewUnits;
 reviewUnits=function(L,r){const u=baseReview(L,r);if(L&&P.round%3===0){const V=vocabOf(L.day);if(V.length)u.push(...uVocabRecall(V,r))}return u};

 const baseWords=renderWords;
 renderWords=function(){baseWords();const box=$("#v-words");if(!box||W.day===null)return;const V=vocabOf(W.day);if(!V.length)return;
  const html=`<h3 class="sec">오늘의 단어</h3><p class="small">누르면 단어와 예문이 들립니다.</p><ul class="list vocab">${V.map(v=>`<li><button data-say="${esc(v.ex?v.en+". "+v.ex:v.en)}"><span class="en">${esc(v.en)}<span class="vk">${esc(v.ko)}</span></span>${v.ex?`<span class="vx">${esc(v.ex)}</span><span class="ko">${esc(v.exKo)}</span>`:""}</button></li>`).join("")}</ul>`;
  const h=[...box.querySelectorAll("h3.sec")].find(x=>x.textContent.trim()==="이날의 문장");
  if(h)h.insertAdjacentHTML("beforebegin",html);else box.insertAdjacentHTML("beforeend",html);bindSay(box)};

 const st=document.createElement("style");
 st.textContent=".vocab .vk{font-weight:400;color:var(--amber,#B8860B);margin-left:10px;font-size:15px}.vocab .vx{display:block;font-size:15px;color:var(--fg);margin-top:2px}";
 document.head.appendChild(st);
 try{renderWords()}catch(e){}
})();
</script>
